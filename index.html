<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>MTM · Visualizador de Torneo</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script src="https://cdn.polyfill.io/v3/polyfill.min.js?features=fetch,Promise,Array.from,Element.prototype.closest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,900&family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <script>
    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }
    if (!isIOS()) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>');
    }
  </script>

  <style>
    :root {
      --color-bg: #0a0a0f;
      --color-surface: #14141e;
      --color-surface-hover: #1e1e2f;
      --color-text: #e2e8f0;
      --color-text-muted: #94a3b8;
      --color-border: #2d2d44;
      --neon-purple: #a855f7;
      --neon-cyan: #22d3ee;
      --neon-pink: #ec4899;
      --neon-green: #4ade80;
      --neon-yellow: #facc15;
      --neon-red: #f87171;
      --radius: 12px;
      --font-size-base: 14px;
      --spacing-base: 0.8rem;
      --density-scale: 1;
    }

    [data-theme="dominio"] {
      --color-bg: #000000;
      --color-surface: #0a0a0a;
      --color-surface-hover: #1a1a1a;
      --color-text: #e8e8e8;
      --color-text-muted: #aaaaaa;
      --color-border: #2a2a2a;
      --neon-purple: #00a84d;
      --neon-cyan: #00a84d;
      --neon-pink: #d32f2f;
      --neon-green: #00a84d;
      --neon-yellow: #ffc107;
      --neon-red: #d32f2f;
    }

    [data-theme="light"] {
      --color-bg: #f5f5f5;
      --color-surface: #ffffff;
      --color-surface-hover: #eeeeee;
      --color-text: #222222;
      --color-text-muted: #666666;
      --color-border: #cccccc;
      --neon-purple: #3b82f6;
      --neon-cyan: #06b6d4;
      --neon-pink: #ec4899;
      --neon-green: #22c55e;
      --neon-yellow: #eab308;
      --neon-red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: var(--font-size-base);
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
      -webkit-text-size-adjust: 100%;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

    .app { display: flex; min-height: 100vh; background: var(--color-bg); }

    /* ========================================
       SIDEBAR
       ======================================== */
    .sidebar {
      width: 220px;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease, background 0.3s;
      z-index: 100;
      -webkit-overflow-scrolling: touch;
    }

    [data-theme="dominio"] .sidebar { background: rgba(0, 0, 0, 0.97); }
    [data-theme="light"] .sidebar { background: rgba(255, 255, 255, 0.95); }

    .sidebar-brand {
      padding: 1.2rem 1rem 0.8rem;
      border-bottom: 1px solid var(--color-border);
      text-align: center;
    }
    .sidebar-brand .logo-container {
      width: 80px; height: 80px;
      margin: 0 auto 0.5rem;
      border-radius: 50%;
      background: #000;
      border: 2px solid var(--color-border);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .sidebar-brand .logo-container img { width: 100%; height: 100%; object-fit: contain; }
    .sidebar-brand .logo-container .no-logo { color: var(--color-text-muted); font-size: 0.6rem; text-align: center; padding: 0.2rem; }

    .sidebar-brand h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.5px;
    }
    .sidebar-brand h1 .mtm { color: var(--neon-purple); }
    .sidebar-brand small {
      display: block;
      font-size: 0.6rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
    }

    .sidebar-nav { flex: 1; padding: 0.5rem 0.3rem; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .nav-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #ffffff !important;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 4px solid transparent;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); }
    .nav-item.active { background: rgba(255,255,255,0.08); }
    .nav-item i { color: #ffffff !important; width: 1.2rem; text-align: center; }
    .nav-divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 0.3rem 0.5rem; padding: 0.2rem 0; }

    [data-theme="light"] .nav-item { color: #222222 !important; }
    [data-theme="light"] .nav-item i { color: #222222 !important; }

    .hamburger {
      display: none;
      position: fixed;
      top: 0.8rem; left: 0.8rem;
      z-index: 200;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.5rem 0.7rem;
      color: var(--color-text);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .sidebar-footer {
      padding: 0.8rem 0.6rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .sidebar-footer .settings-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.4rem 1rem;
      color: var(--color-text-muted);
      font-size: 0.65rem; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 0.4rem;
      width: 100%; justify-content: center;
    }
    .sidebar-footer .settings-btn:hover { background: var(--color-surface-hover); color: #fff; border-color: var(--neon-purple); }

    /* ========================================
       MAIN CONTENT
       ======================================== */
    .main {
      flex: 1;
      padding: 1.2rem 2rem 2rem;
      overflow-y: auto;
      max-height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section { display: none; animation: fadeSlide 0.3s ease; }
    .section.active { display: block; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem; font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.3px;
      margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .section-title span { color: var(--neon-purple); }
    .section-title .print-btn {
      margin-left: auto;
      font-size: 0.7rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.3rem 0.8rem;
      color: var(--color-text);
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-weight: 600; text-transform: none;
    }
    .section-title .print-btn:hover { background: var(--neon-purple); color: #000; }

    .card {
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.8rem 1rem;
      margin-bottom: 0.8rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .card:hover { border-color: var(--neon-purple); }

    .card-header {
      font-weight: 700;
      color: var(--color-text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.3rem;
      display: flex; justify-content: space-between; align-items: center;
    }

    /* ========================================
       TABLAS
       ======================================== */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); background: rgba(0,0,0,0.2); -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    thead { background: rgba(30, 30, 47, 0.6); border-bottom: 1px solid var(--color-border); }
    thead th {
      padding: 0.6rem 0.8rem;
      text-align: left;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      font-size: 0.65rem;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid rgba(45, 45, 68, 0.25); transition: background 0.15s; }
    tbody tr:hover { background: var(--color-surface-hover); }
    tbody td { padding: 0.5rem 0.8rem; vertical-align: middle; }

    .th-pts { color: var(--neon-cyan); }
    .th-pj { color: var(--color-text); }
    .th-pg { color: var(--neon-green); }
    .th-pe { color: var(--neon-yellow); }
    .th-pp { color: var(--neon-red); }
    .th-gf { color: var(--neon-cyan); }
    .th-gc { color: var(--neon-pink); }
    .th-dg { color: var(--neon-yellow); }
    .td-pts { color: var(--neon-cyan); font-weight: 700; }
    .td-pj { color: var(--color-text); }
    .td-pg { color: var(--neon-green); font-weight: 700; }
    .td-pe { color: var(--neon-yellow); font-weight: 700; }
    .td-pp { color: var(--neon-red); font-weight: 700; }
    .td-gf { color: var(--neon-cyan); font-weight: 700; }
    .td-gc { color: var(--neon-pink); font-weight: 700; }
    .td-dg { color: var(--neon-yellow); font-weight: 700; }

    .power-badge {
      display: inline-block;
      font-size: 0.65rem; font-weight: 900;
      padding: 0.05rem 0.5rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
      margin-right: 0.2rem;
    }
    .power-badge.atk { color: var(--neon-cyan); background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.25); }
    .power-badge.def { color: var(--neon-pink); background: rgba(236,72,153,0.12); border: 1px solid rgba(236,72,153,0.25); }
    .power-badge.glb { color: var(--neon-yellow); background: rgba(250,204,21,0.12); border: 1px solid rgba(250,204,21,0.25); }

    .trend-up { color: var(--neon-green); font-size: 0.65rem; margin-left: 0.1rem; }
    .trend-down { color: var(--neon-red); font-size: 0.65rem; margin-left: 0.1rem; }
    .trend-flat { color: var(--color-text-muted); font-size: 0.65rem; margin-left: 0.1rem; }

    .row-clasif { border-left: 4px solid var(--neon-green); }
    .row-descenso { border-left: 4px solid var(--neon-red); }
    .row-ascenso { border-left: 4px solid var(--neon-yellow); }

    .shield-sm { width: 1.6rem; height: 1.6rem; object-fit: contain; background: #000; border-radius: 50%; border: 1px solid var(--color-border); flex-shrink: 0; }

    /* ========================================
       PLAYER SLOTS (Rediseñados)
       ======================================== */
    .player-slot {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(20,20,30,0.95), rgba(30,30,45,0.95));
      border: 2px solid var(--color-border);
      border-radius: 10px;
      padding: 0.4rem 0.5rem;
      min-width: 105px;
      max-width: 130px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .player-slot::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--color-border);
      transition: all 0.25s;
    }
    .player-slot:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

    .player-slot.titular {
      border-color: rgba(34, 211, 238, 0.4);
      background: linear-gradient(135deg, rgba(34,211,238,0.1), rgba(20,20,30,0.95));
    }
    .player-slot.titular::before { background: var(--neon-cyan); box-shadow: 0 0 12px var(--neon-cyan); }
    .player-slot.titular:hover { border-color: var(--neon-cyan); box-shadow: 0 8px 20px rgba(34,211,238,0.25); }

    .player-slot.suplente {
      border-color: rgba(236, 72, 153, 0.4);
      background: linear-gradient(135deg, rgba(236,72,153,0.1), rgba(20,20,30,0.95));
    }
    .player-slot.suplente::before { background: var(--neon-pink); box-shadow: 0 0 12px var(--neon-pink); }
    .player-slot.suplente:hover { border-color: var(--neon-pink); box-shadow: 0 8px 20px rgba(236,72,153,0.25); }

    .player-slot.reserva {
      border-color: rgba(148, 163, 184, 0.3);
      background: linear-gradient(135deg, rgba(148,163,184,0.05), rgba(20,20,30,0.95));
      opacity: 0.8;
    }
    .player-slot.reserva:hover { opacity: 1; }
    .player-slot.reserva::before { background: #64748b; }

    .player-slot.captain {
      border-color: var(--neon-yellow) !important;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.25);
    }
    .player-slot.captain::before {
      background: var(--neon-yellow) !important;
      box-shadow: 0 0 15px var(--neon-yellow) !important;
    }

    .player-slot .slot-name {
      font-size: 0.68rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 115px;
      margin-bottom: 0.1rem;
    }
    .player-slot .slot-rank { font-size: 0.52rem; font-weight: 700; margin-bottom: 0.2rem; }
    .player-slot .slot-stats { display: flex; justify-content: center; gap: 0.15rem; flex-wrap: wrap; }
    .player-slot .slot-stats span {
      background: rgba(0,0,0,0.5);
      padding: 0.08rem 0.3rem;
      border-radius: 6px;
      font-size: 0.5rem;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* ========================================
       TEAM CARD V2 (con scroll interno)
       ======================================== */
    .team-card-v2 {
      background: rgba(20, 20, 30, 0.85);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .team-card-v2:hover { border-color: var(--neon-purple); box-shadow: 0 8px 30px rgba(168, 85, 247, 0.15); }

    .team-card-v2 .header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--color-border);
    }
    .team-card-v2 .header .shield {
      width: 3rem; height: 3rem;
      border-radius: 50%;
      background: #000;
      border: 2px solid var(--color-border);
      object-fit: contain;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
      flex-shrink: 0;
    }
    .team-card-v2 .header .info { flex: 1; min-width: 0; }
    .team-card-v2 .header .name {
      font-size: 1rem; font-weight: 900;
      color: var(--neon-purple);
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .team-card-v2 .header .meta {
      display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.3rem;
      font-size: 0.65rem;
    }

    .team-players-scroll {
      max-height: 380px;
      overflow-y: auto;
      padding-right: 0.4rem;
      scroll-behavior: smooth;
    }
    .team-players-scroll::-webkit-scrollbar { width: 4px; }
    .team-players-scroll::-webkit-scrollbar-track { background: transparent; }
    .team-players-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

    .section-label-v2 {
      font-size: 0.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      margin: 0.5rem 0 0.3rem;
      padding-bottom: 0.2rem;
      border-bottom: 1px dashed var(--color-border);
      display: flex; align-items: center; gap: 0.3rem;
    }
    .players-grid-v2 { display: flex; flex-wrap: wrap; gap: 0.3rem; }

    /* ========================================
       PERFORMANCE
       ======================================== */
    .perf-layout { display: flex; gap: 1rem; min-height: 480px; }
    .perf-list {
      flex: 0 0 200px;
      max-height: 480px;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
      border-radius: var(--radius);
      padding: 0.5rem;
      border: 1px solid var(--color-border);
    }
    .perf-list .list-item {
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      border-left: 3px solid transparent;
      margin-bottom: 2px;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .perf-list .list-item:hover { background: var(--color-surface-hover); }
    .perf-list .list-item.active { background: var(--color-surface-hover); border-left-color: var(--neon-purple); color: #fff; }
    .perf-list .list-item.sub-item { padding-left: 1.8rem; font-size: 0.7rem; border-left-color: transparent; }
    .perf-list .list-item.sub-item.active { border-left-color: var(--neon-cyan); }
    .perf-team-header {
      font-weight: 700; font-size: 0.7rem;
      color: var(--neon-cyan);
      padding: 0.3rem 0.5rem;
      border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; gap: 0.4rem;
      margin-top: 0.2rem;
    }
    .perf-team-header img { width: 1.2rem; height: 1.2rem; border-radius: 50%; background: #000; border: 1px solid var(--color-border); object-fit: contain; }

    .perf-chart-area {
      flex: 1;
      min-width: 0;
      background: rgba(0,0,0,0.15);
      border-radius: var(--radius);
      padding: 1rem;
      border: 1px solid var(--color-border);
      display: flex; flex-direction: column; gap: 0.8rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .perf-chart-area canvas {
      width: 100% !important;
      height: auto !important;
      min-width: 600px;
      min-height: 280px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      border: 1px solid var(--color-border);
      cursor: crosshair;
      touch-action: none;
      display: block;
    }

    .perf-line-selectors {
      display: flex; flex-wrap: wrap; gap: 0.8rem 1.5rem;
      padding: 0.3rem 0.6rem;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      border: 1px solid var(--color-border);
      align-items: center;
    }
    .perf-line-selectors label {
      display: flex; align-items: center; gap: 0.3rem;
      font-size: 0.7rem; font-weight: 700;
      cursor: pointer; user-select: none;
    }
    .perf-line-selectors input[type="checkbox"] { width: 0.9rem; height: 0.9rem; accent-color: var(--neon-purple); cursor: pointer; }
    .perf-line-selectors .btn-refresh {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 0.2rem 0.6rem;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .perf-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
    .perf-stats-grid .stat-box {
      background: rgba(0,0,0,0.2);
      padding: 0.5rem 0.5rem;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--color-border);
    }
    .perf-stats-grid .stat-box .label { font-size: 0.55rem; color: var(--color-text-muted); text-transform: uppercase; }
    .perf-stats-grid .stat-box .value { font-size: 1.2rem; font-weight: 900; }

    /* Promedios llamativos */
    .perf-avg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.6rem;
      margin-top: 0.6rem;
    }
    .perf-avg-card {

  // ==========================================
  // UTILIDADES
  // ==========================================
  function formatCurrency(amount) {
    if (amount >= 1e6) return '$' + (amount / 1e6).toFixed(1) + 'M';
    if (amount >= 1e3) return '$' + (amount / 1e3).toFixed(0) + 'K';
    return '$' + amount.toFixed(0);
  }

  function getRankColor(rank) {
    const colors = {
      'Bronce': '#cd7f32', 'Plata': '#c0c0c0', 'Oro': '#ffd700',
      'Platino': '#e5e4e2', 'Diamante': '#b9f2ff', 'Campeón': '#ff6b6b',
      'Gran Campeón': '#ff4757', 'SSL': '#ff4757'
    };
    return colors[rank] || '#fff';
  }

  function getTeamById(teams, id) {
    if (!teams) return null;
    return teams.find(t => t.id === id);
  }

  function getPlayerById(torneo, playerId) {
    if (!torneo || !torneo.teams) return null;
    for (let tm of torneo.teams) {
      const p = tm.players.find(x => x.id === playerId);
      if (p) return p;
    }
    return null;
  }

  function formatDate(timestamp) {
    try {
      const d = new Date(timestamp);
      return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
    } catch (_) { return '--/--/--'; }
  }

  function getTipoInfo(type) {
    const map = {
      'bonus': { label: 'Bonos', icon: '🏆', cls: 'bonus' },
      'transfer_in': { label: 'Fichajes', icon: '📥', cls: 'fichaje' },
      'transfer_out': { label: 'Ventas', icon: '📤', cls: 'venta' },
      'loan': { label: 'Préstamos', icon: '📋', cls: 'prestamo' },
      'penalty': { label: 'Sanciones', icon: '⚠️', cls: 'sancion' },
      'release': { label: 'Liberación', icon: '📄', cls: 'transferencia' },
      'return': { label: 'Retorno', icon: '↩️', cls: 'transferencia' }
    };
    return map[type] || { label: 'Otro', icon: '🔄', cls: 'transferencia' };
  }

  function getPlayerCategory(pig) {
    if (pig > 200) return { label: 'Leyenda', emoji: '⭐', multiplier: 3.0 };
    if (pig > 150) return { label: 'Elite', emoji: '🏆', multiplier: 2.5 };
    if (pig > 100) return { label: 'Superestrella', emoji: '💎', multiplier: 2.0 };
    if (pig > 75) return { label: 'Estrella', emoji: '🌟', multiplier: 1.6 };
    if (pig > 50) return { label: 'Promesa', emoji: '⚡', multiplier: 1.3 };
    if (pig > 30) return { label: 'Consolidado', emoji: '🔄', multiplier: 1.0 };
    if (pig > 15) return { label: 'Rotación', emoji: '📋', multiplier: 0.7 };
    if (pig > 5) return { label: 'Fondo', emoji: '🪑', multiplier: 0.5 };
    return { label: 'Novato', emoji: '🆕', multiplier: 0.3 };
  }

  function getRankMultiplier(rank, division) {
    const base = { 'Bronce':0.5, 'Plata':0.7, 'Oro':1.0, 'Platino':1.3, 'Diamante':1.7, 'Campeón':2.2, 'Gran Campeón':2.8, 'SSL':3.5 }[rank] || 1.0;
    if (rank === 'SSL') return 3.5;
    const bonus = { 1:0, 2:0.12, 3:0.25 }[division] || 0;
    return base * (1 + bonus);
  }

  function applyPowerFrenzy(value) {
    if (value <= 120) return Math.min(value, 500);
    if (value <= 200) return 120 + (value - 120) / 1.2;
    if (value <= 400) return 200 + (value - 200) / 1.8;
    return 400 + (value - 400) / 3;
  }

  function getPlayerVisibility(player, team) {
    if (!team) return '☆☆☆☆☆';
    const pig = player.seasonStats?.pig || 0;
    const cat = getPlayerCategory(pig);
    const catFactor = cat.multiplier;
    const rankFactor = getRankMultiplier(player.rocketRank, player.division || 2);
    const roleMap = { 'Titular 🌟':1.5, 'Suplente 🔄':0.9, 'Reserva 💤':0.5 };
    const roleFactor = roleMap[player.role] || 0.5;
    const glb = team.glb || 50;
    let teamFactor = 0.5;
    if (glb >= 450) teamFactor = 2.0;
    else if (glb >= 350) teamFactor = 1.7;
    else if (glb >= 250) teamFactor = 1.4;
    else if (glb >= 150) teamFactor = 1.1;
    else if (glb >= 100) teamFactor = 0.9;
    else if (glb >= 70) teamFactor = 0.7;
    let raw = catFactor * rankFactor * roleFactor * teamFactor;
    const scaled = Math.pow(raw, 0.6);
    let stars = Math.min(5, Math.max(1, Math.ceil(scaled)));
    if (player.isCaptain && glb >= 250) stars = Math.max(stars, 4);
    if (player.isCaptain && glb >= 400) stars = 5;
    return '★'.repeat(stars) + '☆'.repeat(5 - stars);
  }

  function getTeamName(teamId) {
    if (!teamId) return 'Agente Libre';
    if (!currentData) return '?';
    for (let tm of currentData.teams) {
      if (tm.id === teamId) return tm.name;
    }
    return '?';
  }

  // ==========================================
  // CÁLCULO DE RANKINGS
  // ==========================================
  function calculateRankings(torneo) {
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          allPlayers.push({ ...p, teamName: team.name, teamShield: team.shield, teamGlb: team.glb });
        }
      });
    });
    (torneo.freeAgents || []).forEach(p => {
      if (p.name && p.name.trim() !== '') {
        allPlayers.push({ ...p, teamName: 'Agente Libre', teamShield: '', teamGlb: 0 });
      }
    });
    if (allPlayers.length === 0) return {};

    const sortBy = (key) => {
      const sorted = [...allPlayers].sort((a, b) => {
        const va = a.seasonStats?.[key] || 0;
        const vb = b.seasonStats?.[key] || 0;
        return vb - va;
      });
      sorted.forEach((p, i) => p[`rank_${key}`] = i + 1);
    };

    sortBy('goals');
    sortBy('assists');
    sortBy('saves');
    sortBy('shots');
    sortBy('pig');

    const sortedByMarket = [...allPlayers].sort((a, b) => (b.marketValue || 0) - (a.marketValue || 0));
    sortedByMarket.forEach((p, i) => p.rank_market = i + 1);

    const sortedByPig = [...allPlayers].sort((a, b) => (b.seasonStats?.pig || 0) - (a.seasonStats?.pig || 0));
    sortedByPig.forEach((p, i) => p.rank_bdor = i + 1);

    const cache = {};
    allPlayers.forEach(p => {
      cache[p.id] = {
        rank_market: p.rank_market || 0,
        rank_goals: p.rank_goals || 0,
        rank_assists: p.rank_assists || 0,
        rank_saves: p.rank_saves || 0,
        rank_shots: p.rank_shots || 0,
        rank_pig: p.rank_pig || 0,
        rank_bdor: p.rank_bdor || 0
      };
    });
    return cache;
  }

  function showPrintModalIOS(htmlContent, filename) {
    try {
      const printWindow = window.open('', '_blank', 'width=800,height=600');
      if (!printWindow) { alert('Por favor, permite las ventanas emergentes para imprimir.'); return; }
      printWindow.document.write(`
        <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Imprimir - ${filename}</title>
        <style>body { background: #0a0a0f; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; padding: 2rem; max-width: 900px; margin: 0 auto; } img { max-width: 100%; } table { width: 100%; border-collapse: collapse; } th, td { padding: 0.3rem 0.5rem; border: 1px solid #2d2d44; } th { background: #1e1e2f; }</style>
        </head><body>${htmlContent}<script>window.onload=function(){window.print();};<\/script></body></html>
      `);
      printWindow.document.close();
    } catch (e) { alert('Error al imprimir: ' + e.message); }
  }

  function showPrintModal(htmlContent, filename, width = 800) {
    if (isIOS() || /^((?!chrome|android).)*safari/i.test(navigator.userAgent)) { showPrintModalIOS(htmlContent, filename); return; }
    if (typeof html2canvas === 'undefined') { showPrintModalIOS(htmlContent, filename); return; }

    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'fixed';
    tempDiv.style.left = '-9999px';
    tempDiv.style.top = '0';
    tempDiv.style.width = width + 'px';
    tempDiv.style.background = '#0a0a0f';
    tempDiv.style.padding = '1rem';
    tempDiv.style.color = '#e2e8f0';
    tempDiv.style.fontFamily = 'Inter, system-ui, sans-serif';
    tempDiv.style.borderRadius = '8px';
    tempDiv.innerHTML = htmlContent;
    document.body.appendChild(tempDiv);

    html2canvas(tempDiv, {
      scale: 2,

  // ==========================================
  // CÁLCULO DE PODER REAL POR JORNADA
  // ==========================================
  function calculateTeamPowerAtRound(teamId, torneo, targetRound) {
    const team = getTeamById(torneo.teams, teamId);
    if (!team) return { atk: 0, def: 0, glb: 0 };

    let pigAtk = 0, pigDef = 0, formAtk = 0, formDef = 0;

    for (let r = 0; r <= targetRound; r++) {
      const round = torneo.rounds[r];
      if (!round) continue;
      round.forEach(m => {
        if (!m.played) return;
        if (m.h !== teamId && m.a !== teamId) return;
        const isHome = m.h === teamId;
        if (isHome) {
          formAtk += (m.sH - 3) * 1.5;
          formDef += (3 - m.sA) * 1.5;
        } else {
          formAtk += (m.sA - 3) * 1.5;
          formDef += (3 - m.sH) * 1.5;
        }
        formAtk = Math.max(-20, Math.min(20, formAtk));
        formDef = Math.max(-20, Math.min(20, formDef));
        if (m.stats) {
          m.stats.forEach(st => {
            if (st.tId === teamId) {
              pigAtk += (st.g || 0) * 2.0 + (st.a || 0) * 1.5;
              pigDef += (st.s || 0) * 1.0;
            }
          });
        }
      });
    }

    const activePlayers = team.players.filter(p => p.name && p.name.trim() !== '');
    let avgRankMult = 1;
    if (activePlayers.length > 0) {
      const sum = activePlayers.reduce((acc, p) => acc + getRankMultiplier(p.rocketRank, p.division || 2), 0);
      avgRankMult = sum / activePlayers.length;
      avgRankMult = 1 + (avgRankMult - 1) * 2.0;
    }

    let baseAtk = 30 + (pigAtk / 25) + (formAtk * 1.5);
    let baseDef = 30 + (pigDef / 30) + (formDef * 1.5);
    let calcAtk = applyPowerFrenzy(baseAtk * avgRankMult);
    let calcDef = applyPowerFrenzy(baseDef * avgRankMult);

    const atk = Math.min(500, Math.max(10, Math.floor(calcAtk)));
    const def = Math.min(500, Math.max(10, Math.floor(calcDef)));
    const glb = Math.floor((atk + def) / 2);
    return { atk, def, glb };
  }

  // ==========================================
  // PERFORMANCE
  // ==========================================
  function getPlayoffLabels(torneo) {
    const labels = [];
    const rounds = torneo.rounds || [];
    const totalRounds = rounds.length;
    let lastPlayedRound = -1;
    for (let i = 0; i < totalRounds; i++) {
      const round = rounds[i];
      if (round && round.some(m => m.played)) lastPlayedRound = i;
    }
    if (lastPlayedRound === -1) {
      labels.push({ type: 'liguilla', round: 0, roundIdx: 0, label: 'J1', hasData: false });
      return labels;
    }
    for (let i = 0; i <= lastPlayedRound; i++) {
      const round = rounds[i];
      const hasPlayed = round && round.some(m => m.played);
      labels.push({ type: 'liguilla', round: i, roundIdx: i, label: `J${i + 1}`, hasData: hasPlayed });
    }
    if (torneo.playoffs && torneo.playoffs.rounds) {
      const playoffRounds = torneo.playoffs.rounds;
      const phaseNames = ['4°tos', 'Semis', 'Final'];
      playoffRounds.forEach((round, idx) => {
        const hasPlayed = round && round.some(m => m.played);
        labels.push({
          type: 'playoff', round: idx, roundIdx: idx,
          label: phaseNames[idx] || `PO${idx + 1}`, hasData: hasPlayed
        });
      });
    }
    return labels;
  }

  function calculateTeamPerformance(teamId, torneo) {
    const team = getTeamById(torneo.teams, teamId);
    if (!team) return [];
    const labels = getPlayoffLabels(torneo);
    const result = [];
    let totalGF = 0, totalGA = 0, totalSaves = 0, totalMatches = 0;

    labels.forEach((label) => {
      let gf = 0, ga = 0, saves = 0;
      if (label.type === 'liguilla') {
        const round = torneo.rounds[label.round];
        if (round) {
          round.forEach(m => {
            if (m.played && (m.h === teamId || m.a === teamId)) {
              const isHome = m.h === teamId;
              gf += isHome ? m.sH : m.sA;
              ga += isHome ? m.sA : m.sH;
              totalMatches++;
              if (m.stats) m.stats.forEach(st => { if (st.tId === teamId) saves += st.s || 0; });
            }
          });
        }
      } else if (label.type === 'playoff') {
        const round = torneo.playoffs.rounds[label.round];
        if (round) {
          round.forEach(m => {
            if (m.played && (m.h === teamId || m.a === teamId)) {
              const isHome = m.h === teamId;
              gf += isHome ? m.sH : m.sA;
              ga += isHome ? m.sA : m.sH;
              totalMatches++;
              if (m.stats) m.stats.forEach(st => { if (st.tId === teamId) saves += st.s || 0; });
            }
          });
        }
      }
      totalGF += gf;
      totalGA += ga;
      totalSaves += saves;

      const power = calculateTeamPowerAtRound(teamId, torneo, label.roundIdx);
      result.push({
        label: label.label, type: label.type, roundIdx: label.roundIdx,
        hasData: label.hasData,
        atk: power.atk, def: power.def, glb: power.glb,
        gf, ga, saves, matches: totalMatches
      });
    });

    result.totalGF = totalGF;
    result.totalGA = totalGA;
    result.totalSaves = totalSaves;
    result.matches = totalMatches;
    return result;
  }

  function calculatePlayerPerformance(playerId, torneo) {
    const result = [];
    let totalGoals = 0, totalAssists = 0, totalSaves = 0, totalShots = 0, totalPIG = 0;
    const labels = getPlayoffLabels(torneo);

    labels.forEach((label) => {
      let goals = 0, assists = 0, saves = 0, shots = 0;
      if (label.type === 'liguilla') {
        const round = torneo.rounds[label.round];
        if (round) {
          round.forEach(m => {
            if (m.played && m.stats) {
              const stat = m.stats.find(s => s.pId === playerId);
              if (stat) {
                goals += stat.g || 0; assists += stat.a || 0;
                saves += stat.s || 0; shots += stat.t || 0;
              }
            }
          });
        }
      } else if (label.type === 'playoff') {
        const round = torneo.playoffs.rounds[label.round];
        if (round) {
          round.forEach(m => {
            if (m.played && m.stats) {
              const stat = m.stats.find(s => s.pId === playerId);
              if (stat) {
                goals += stat.g || 0; assists += stat.a || 0;
                saves += stat.s || 0; shots += stat.t || 0;
              }
            }
          });
        }
      }
      const pig = (goals * 2) + (assists * 1.5) + (saves * 1) + ((shots - goals) * 0.2);
      totalGoals += goals; totalAssists += assists;
      totalSaves += saves; totalShots += shots; totalPIG += pig;
      result.push({
        label: label.label, type: label.type, roundIdx: label.roundIdx,
        hasData: label.hasData,
        goals, assists, saves, shots, pig
      });
    });

    result.totalGoals = totalGoals;
    result.totalAssists = totalAssists;
    result.totalSaves = totalSaves;
    result.totalShots = totalShots;
    result.totalPIG = totalPIG;
    return result;
  }

  function calculatePlayerMarketValueHistory(playerId, torneo) {
    const history = [];
    const labels = getPlayoffLabels(torneo);
    let accumulatedStats = { goals: 0, assists: 0, saves: 0, shots: 0, matches: 0 };
    let pigHistory = [];

    let player = null, team = null;
    for (let tm of torneo.teams) {
      const found = tm.players.find(p => p.id === playerId);
      if (found) { player = found; team = tm; break; }
    }
    if (!player || !team) return history;
    const basePlayer = JSON.parse(JSON.stringify(player));
    const baseTeam = JSON.parse(JSON.stringify(team));

    labels.forEach((label) => {
      let goals = 0, assists = 0, saves = 0, shots = 0, matches = 0;
      if (label.type === 'liguilla') {
        const round = torneo.rounds[label.round];
        if (round) {
          round.forEach(m => {
            if (m.played && m.stats) {
              const stat = m.stats.find(s => s.pId === playerId);
              if (stat) { goals += stat.g || 0; assists += stat.a || 0; saves += stat.s || 0; shots += stat.t || 0; matches++; }
            }
          });
        }
      } else if (label.type === 'playoff') {
        const round = torneo.playoffs.rounds[label.round];
        if (round) {
          round.forEach(m => {
            if (m.played && m.stats) {
              const stat = m.stats.find(s => s.pId === playerId);
              if (stat) { goals += stat.g || 0; assists += stat.a || 0; saves += stat.s || 0; shots += stat.t || 0; matches++; }
            }
          });
        }
      }
      accumulatedStats.goals += goals; accumulatedStats.assists += assists;
      accumulatedStats.saves += saves; accumulatedStats.shots += shots; accumulatedStats.matches += matches;
      const pig = (accumulatedStats.goals * 2) + (accumulatedStats.assists * 1.5) + (accumulatedStats.saves * 1) + ((accumulatedStats.shots - accumulatedStats.goals) * 0.2);
      pigHistory.push(pig);
      const marketValue = calculateMarketValueFromStats(basePlayer, baseTeam, accumulatedStats, pigHistory);
      history.push({
        label: label.label, type: label.type, roundIdx: label.roundIdx,
        marketValue, pig, matches: accumulatedStats.matches,
        goals: accumulatedStats.goals, assists: accumulatedStats.assists,
        saves: accumulatedStats.saves, shots: accumulatedStats.shots
      });
    });
    return history;
  }

  function getBasePrice(rank, division) {
    const BASE_PRICES = {
      'Bronce': { 1: 300, 2: 500, 3: 700 }, 'Plata': { 1: 800, 2: 1200, 3: 2000 },
      'Oro': { 1: 2500, 2: 3500, 3: 5000 }, 'Platino': { 1: 6000, 2: 8000, 3: 10000 },
      'Diamante': { 1: 15000, 2: 18000, 3: 22000 }, 'Campeón': { 1: 25000, 2: 40000, 3: 60000 },
      'Gran Campeón': { 1: 90000, 2: 120000, 3: 160000 }, 'SSL': { 1: 250000, 2: 250000, 3: 250000 }
    };
    return BASE_PRICES[rank]?.[division] || 5000;
  }

  function calculateMarketValueFromStats(player, team, stats, pigHistory) {
    if (!player || !team) return 5000;
    const { goals, assists, saves, shots } = stats;
    const effectivePig = (goals * 2) + (assists * 1.5) + (saves * 1) + ((shots - goals) * 0.2);
    const basePrice = getBasePrice(player.rocketRank, player.division || 2);
    const ROLE_MULTIPLIER = { 'Titular 🌟': 1.4, 'Suplente 🔄': 0.9, 'Reserva 💤': 0.6 };
    let roleFactor = player.isCaptain ? 1.8 : (ROLE_MULTIPLIER[player.role] || 0.6);
    let sanctionPenalty = 0;
    if (player.sanctions) {
      const active = player.sanctions.filter(s => s.active);
      if (active.some(s => s.type === 'red' || s.type === 'suspension')) sanctionPenalty = -0.30;
      else if (active.some(s => s.type === 'yellow')) sanctionPenalty = -0.10;
    }
    roleFactor = Math.max(0.1, roleFactor + sanctionPenalty);
    const avgPIG = pigHistory.length > 0 ? pigHistory.reduce((a,b) => a+b, 0) / pigHistory.length : 0;
    const last5 = pigHistory.slice(-5);
    const avgLast5 = last5.length > 0 ? last5.reduce((a,b) => a+b, 0) / last5.length : 0;
    let streakPenalty = 0;
    if (last5.length >= 3 && avgLast5 < avgPIG * 0.5) streakPenalty = -0.20;
    else if (last5.length >= 3 && avgLast5 < avgPIG * 0.7) streakPenalty = -0.10;
    roleFactor = Math.max(0.1, roleFactor + streakPenalty);
    const pigValue = effectivePig * 25000;
    const goalValue = goals * 40000;
    const assistValue = assists * 25000;
    const saveValue = saves * 20000;
    const dangerValue = (goals + assists + shots) * 10000;
    let performanceValue = (pigValue * 0.5) + (goalValue * 0.15) + (assistValue * 0.1) + (saveValue * 0.05) + (dangerValue * 0.05);
    performanceValue *= (1 + (avgPIG / 1000));
    const rankValue = getRankMultiplier(player.rocketRank, player.division || 2);
    const rankFactor = 0.5 + (rankValue / 2);
    let category = 0.3;
    if (effectivePig > 200) category = 3.0;
    else if (effectivePig > 150) category = 2.5;
    else if (effectivePig > 100) category = 2.0;
    else if (effectivePig > 75) category = 1.6;
    else if (effectivePig > 50) category = 1.3;
    else if (effectivePig > 30) category = 1.0;
    else if (effectivePig > 15) category = 0.7;
    else if (effectivePig > 5) category = 0.5;
    const glb = team.glb || 50;
    let visibility = 0.6;
    if (glb >= 450) visibility = 2.0;
    else if (glb >= 350) visibility = 1.7;
    else if (glb >= 250) visibility = 1.4;
    else if (glb >= 150) visibility = 1.1;
    else if (glb >= 100) visibility = 0.9;
    else if (glb >= 70) visibility = 0.7;
    let marketValue = (basePrice * roleFactor * visibility) + (performanceValue * rankFactor * roleFactor * category * visibility);
    const minPrice = basePrice * 0.5;
    marketValue = Math.max(minPrice, Math.min(20000000, marketValue));
    return Math.round(marketValue / 100) * 100;
  }

  function drawPerformanceChart(canvasId, data, type, labels, visibleLines) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const parentRect = canvas.parentElement.getBoundingClientRect();
    let width = Math.min((parentRect.width || 800) - 40, 850);
    if (width < 200) width = 700;
    const height = 280;
    const dpr = window.devicePixelRatio || 1;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    if (!data || data.length === 0 || !labels || labels.length === 0) {
      ctx.fillStyle = '#94a3b8';
      ctx.font = '14px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Sin datos disponibles', width / 2, height / 2);
      return;
    }

    const alignedData = labels.map((label, idx) => {
      const entry = data[idx] || {};
      return {
        label: label.label, type: label.type,
        roundIdx: label.roundIdx !== undefined ? label.roundIdx : idx,
        hasData: label.hasData,
        goals: entry.goals || 0, assists: entry.assists || 0,
        saves: entry.saves || 0, shots: entry.shots || 0,
        pig: entry.pig || 0, atk: entry.atk || 0, def: entry.def || 0,
        glb: entry.glb || 0, marketValue: entry.marketValue || 0
      };
    });

    let maxVal = 0, maxValMarket = 0;
    alignedData.forEach(d => {
      if (type === 'equipo') maxVal = Math.max(maxVal, d.atk || 0, d.def || 0, d.glb || 0);
      else {
        maxVal = Math.max(maxVal, d.goals || 0, d.assists || 0, d.saves || 0, d.shots || 0, d.pig || 0);
        maxValMarket = Math.max(maxValMarket, d.marketValue || 0);
      }
    });
    maxVal = maxVal * 1.15;
    if (maxVal < 10) maxVal = 10;
    maxVal = Math.ceil(maxVal / 5) * 5;
    maxValMarket = maxValMarket * 1.15;
    if (maxValMarket > 0 && maxValMarket < 10000) maxValMarket = 10000;
    maxValMarket = Math.ceil(maxValMarket / 1000) * 1000;

    const padding = { top: 20, bottom: 35, left: 45, right: 65 };
    const chartWidth = width - padding.left - padding.right;
    const chartHeight = height - padding.top - padding.bottom;

    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 11px Inter, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(type === 'equipo' ? 'EQUIPO' : 'JUGADOR', padding.left, 14);

    const legendColors = {
      'goals': '#4ade80', 'assists': '#22d3ee', 'saves': '#ec4899',
      'shots': '#facc15', 'pig': '#a855f7', 'marketValue': '#ff6b6b',
      'atk': '#22d3ee', 'def': '#ec4899', 'glb': '#facc15'
    };
    const legendLabels = {
      'goals': '⚽ Goles', 'assists': '🎯 Asist', 'saves': '🧤 Salv',
      'shots': '💀 Tiros', 'pig': '📊 PIG', 'marketValue': '💰 Valor',
      'atk': '⚡ ATK', 'def': '🛡️ DEF', 'glb': '⭐ GLB'
    };

    const keys = type === 'equipo' ? ['atk', 'def', 'glb'] : ['goals', 'assists', 'saves', 'shots', 'pig', 'marketValue'];
    let legendItems = [];
    keys.forEach(key => {
      if (visibleLines[key]) legendItems.push({ key, color: legendColors[key], label: legendLabels[key] });
    });

    legendItems.forEach((item, i) => {
      const xPos = padding.left + 10 + i * 78;
      ctx.fillStyle = item.color;
      ctx.fillRect(xPos, 8, 14, 3);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '8px Inter, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(item.label, xPos + 18, 12);
    });

    ctx.strokeStyle = 'rgba(45,45,68,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    for (let i = 0; i <= 5; i++) {
      const y = padding.top + (i / 5) * chartHeight;
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(width - padding.right, y);
      ctx.stroke();
      ctx.fillStyle = '#94a3b8';
      ctx.font = '9px Inter, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(Math.round(maxVal - (i / 5) * maxVal), padding.left - 6, y + 3);
    }

    if (type !== 'equipo' && visibleLines.marketValue && maxValMarket > 0) {
      ctx.strokeStyle = 'rgba(255,107,107,0.2)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      for (let i = 0; i <= 5; i++) {
        const y = padding.top + (i / 5) * chartHeight;
        ctx.beginPath();
        ctx.moveTo(width - padding.right + 5, y);
        ctx.lineTo(width - padding.right + 10, y);
        ctx.stroke();
        ctx.fillStyle = '#ff6b6b';
        ctx.font = '8px Inter, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(formatCurrency(maxValMarket - (i / 5) * maxValMarket), width - padding.right + 12, y + 3);
      }
    }

    ctx.strokeStyle = 'rgba(45,45,68,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top + chartHeight);
    ctx.lineTo(width - padding.right, padding.top + chartHeight);
    ctx.stroke();

    const totalPoints = alignedData.length;
    alignedData.forEach((d, i) => {
      const x = padding.left + (i / (totalPoints - 1 || 1)) * chartWidth;
      const isPlayoff = d.type === 'playoff';
      ctx.fillStyle = isPlayoff ? '#facc15' : '#94a3b8';
      ctx.font = isPlayoff ? 'bold 8px Inter, sans-serif' : '8px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.label, x, padding.top + chartHeight + 16);
      if (isPlayoff && i > 0 && alignedData[i-1].type === 'liguilla') {
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.15)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(x, padding.top);
        ctx.lineTo(x, padding.top + chartHeight);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    });

    const allPoints = [];

    const drawLineWithPoints = (key, color, useRightScale = false, yOffset = 0) => {
      if (!visibleLines[key]) return;
      const hasData = alignedData.some(d => d[key] > 0);
      if (!hasData) return;

      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([]);

      const points = [];
      alignedData.forEach((d, i) => {
        const x = padding.left + (i / (totalPoints - 1 || 1)) * chartWidth;
        const val = typeof d[key] === 'number' ? d[key] : 0;
        let y;
        if (useRightScale && maxValMarket > 0) y = padding.top + chartHeight - (val / maxValMarket) * chartHeight;
        else y = padding.top + chartHeight - (val / maxVal) * chartHeight;
        y += yOffset;
        points.push({ x, y, val, label: d.label, roundIdx: d.roundIdx, type: d.type, data: d, key });
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      points.forEach((p) => {
        if (p.val > 0 || key === 'marketValue') {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3.5, 0, 2 * Math.PI);
          ctx.fillStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 6;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        allPoints.push(p);
      });
    };

    if (type === 'equipo') {
      const allSame = alignedData.every(d => d.atk === d.def && d.def === d.glb && d.atk > 0);
      if (allSame) {
        drawLineWithPoints('atk', '#22d3ee', false, -3);
        drawLineWithPoints('def', '#ec4899', false, 0);
        drawLineWithPoints('glb', '#facc15', false, 3);
      } else {
        drawLineWithPoints('atk', '#22d3ee', false, 0);
        drawLineWithPoints('def', '#ec4899', false, 0);
        drawLineWithPoints('glb', '#facc15', false, 0);
      }
    } else {
      drawLineWithPoints('goals', '#4ade80', false);
      drawLineWithPoints('assists', '#22d3ee', false);
      drawLineWithPoints('saves', '#ec4899', false);
      drawLineWithPoints('shots', '#facc15', false);
      drawLineWithPoints('pig', '#a855f7', false);
      if (visibleLines.marketValue) drawLineWithPoints('marketValue', '#ff6b6b', true);
    }

    canvas._chartPoints = allPoints;
    canvas._type = type;
    canvas._labels = labels;
    canvas._torneo = currentData;
    canvas._teamId = type === 'equipo' ? perfSelectedTeamId : null;
    canvas._playerId = type === 'jugador' ? perfSelectedPlayerId : null;
  }

  // ==========================================
  // TOOLTIP (CORREGIDO para móvil)
  // ==========================================
  function setupTooltip(canvasId) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const tooltip = document.getElementById('perf-tooltip');
    let tooltipTimeout = null;

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
      const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
      return { x: clientX - rect.left, y: clientY - rect.top, clientX, clientY };
    }

    function showTooltip(e) {
      const coords = getCanvasCoords(e);
      const points = canvas._chartPoints || [];
      const isTouch = !!(e.touches && e.touches.length > 0);

      let candidates = points.filter(p => {
        const dx = Math.abs(p.x - coords.x);
        const dy = Math.abs(p.y - coords.y);
        return dx < 22 && dy < 30;
      });

      let closest = null;
      let minDist = Infinity;
      for (let p of candidates) {
        const dist = Math.sqrt(Math.pow(p.x - coords.x, 2) + Math.pow(p.y - coords.y, 2));
        if (dist < minDist) { minDist = dist; closest = p; }
      }

      if (closest) {
        const type = canvas._type || 'equipo';
        const torneo = canvas._torneo || currentData;

        tooltip.style.display = 'block';
        let left, top;

        if (isTouch) {
          // En móvil: arriba del dedo con offset generoso
          top = coords.clientY - 160;
          left = coords.clientX - 130;
          if (top < 10) top = coords.clientY + 40;
          if (left < 10) left = 10;
          if (left + 260 > window.innerWidth) left = window.innerWidth - 270;
        } else {
          left = coords.clientX + 15;
          top = coords.clientY - 10;
          if (left + 280 > window.innerWidth) left = coords.clientX - 280;
          if (top + 200 > window.innerHeight) top = window.innerHeight - 200;
        }

        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';

        document.getElementById('tooltip-jornada').textContent = closest.label || '';

        let statsHtml = '';
        const d = closest.data || {};
        if (type === 'equipo') {
          statsHtml = `
            <div>⚡ ATK: ${d.atk || 0}</div>
            <div>🛡️ DEF: ${d.def || 0}</div>
            <div>⭐ GLB: ${d.glb || 0}</div>
          `;
        } else {
          statsHtml = `
            <div>⚽ Goles: ${d.goals || 0}</div>
            <div>🎯 Asistencias: ${d.assists || 0}</div>
            <div>🧤 Salvadas: ${d.saves || 0}</div>
            <div>💀 Tiros: ${d.shots || 0}</div>
            <div>📊 PIG: ${(d.pig || 0).toFixed(1)}</div>
            ${d.marketValue !== undefined && d.marketValue > 0 ? `<div>💰 Valor: ${formatCurrency(d.marketValue)}</div>` : ''}
          `;
        }
        document.getElementById('tooltip-stats').innerHTML = statsHtml;

        // Buscar el partido correcto usando roundIdx
        let matchHtml = 'Sin partido en esta jornada';
        if (torneo && closest.roundIdx !== undefined && closest.roundIdx !== null) {
          let match = null;
          if (closest.type === 'liguilla') {
            const round = torneo.rounds && torneo.rounds[closest.roundIdx];
            if (round) {
              if (type === 'equipo') {
                match = round.find(m => m.played && (m.h === canvas._teamId || m.a === canvas._teamId));
              } else {
                const playerId = canvas._playerId;
                for (let tm of torneo.teams) {
                  if (tm.players.some(p => p.id === playerId)) {
                    match = round.find(m => m.played && (m.h === tm.id || m.a === tm.id));
                    break;
                  }
                }
              }
            }
          } else if (closest.type === 'playoff' && torneo.playoffs && torneo.playoffs.rounds) {
            const round = torneo.playoffs.rounds[closest.roundIdx];
            if (round) {
              if (type === 'equipo') {
                match = round.find(m => m.played && (m.h === canvas._teamId || m.a === canvas._teamId));
              } else {
                const playerId = canvas._playerId;
                for (let tm of torneo.teams) {
                  if (tm.players.some(p => p.id === playerId)) {
                    match = round.find(m => m.played && (m.h === tm.id || m.a === tm.id));
                    break;
                  }
                }
              }
            }
          }
          if (match) {
            const h = getTeamById(torneo.teams, match.h);
            const a = getTeamById(torneo.teams, match.a);
            matchHtml = `${h?.name || '?'} ${match.sH} - ${match.sA} ${a?.name || '?'}`;
          }
        }
        document.getElementById('tooltip-match').textContent = matchHtml;
      } else {
        tooltip.style.display = 'none';
      }
    }

    function hideTooltip() {
      if (tooltipTimeout) clearTimeout(tooltipTimeout);
      tooltipTimeout = setTimeout(() => { tooltip.style.display = 'none'; }, 200);
    }

    canvas.addEventListener('mousemove', function(e) {
      if (tooltipTimeout) clearTimeout(tooltipTimeout);
      showTooltip(e);
    });
    canvas.addEventListener('mouseleave', hideTooltip);

    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      if (touch) {
        const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY, touches: e.touches };
        showTooltip(fakeEvent);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      if (touch) {
        const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY, touches: e.touches };
        showTooltip(fakeEvent);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', hideTooltip, { passive: true });
  }

            <div class="avg-label">Salvadas</div>

            <span class="avg-icon">📊</span>
            <div class="avg-value">${matches}</div>
            <div class="avg-label">Partidos</div>
          </div>
        </div>
        <div class="perf-avg-grid">
          <div class="perf-avg-card goals">
            <span class="avg-icon">📈</span>
            <div class="avg-value">${avgGF}</div>
            <div class="avg-label">Prom. GF / Partido</div>
          </div>
          <div class="perf-avg-card conceded">
            <span class="avg-icon">📉</span>

          <div class="peak-item"><span class="peak-label">🔺 DEF Peak:</span> <span class="peak-value">${defPeak.value}</span> <span class="text-muted">(${defPeak.label})</span></div>

  // ==========================================
  // RENDERIZADO PERFORMANCE - JUGADORES
  // ==========================================
  function renderPerformanceJugadores() {
    const torneo = currentData;
    if (!torneo) return;
    const listContainer = document.getElementById('perf-jugador-list');
    if (!listContainer) return;
    if (!torneo.teams || torneo.teams.length === 0) {
      listContainer.innerHTML = '<div class="empty-state">No hay jugadores.</div>';
      return;
    }

    let listHtml = '';
    torneo.teams.forEach(t => {
      const players = t.players.filter(p => p.name && p.name.trim() !== '');
      if (players.length === 0) return;
      listHtml += `<div class="perf-team-header"><img src="${t.shield || ''}">${t.name}</div>`;
      players.forEach(p => {
        const active = p.id === perfSelectedPlayerId ? 'active' : '';
        const pig = p.seasonStats?.pig || 0;
        listHtml += `<div class="list-item sub-item ${active}" onclick="selectPerformancePlayer('${p.id}')">
          ${p.isCaptain ? '👑' : ''}
          <span>${p.name}</span>
          <span style="margin-left:auto;font-size:0.6rem;color:var(--neon-yellow);">${pig.toFixed(1)}</span>
        </div>`;
      });
    });
    listContainer.innerHTML = listHtml;

    if (!perfSelectedPlayerId || !getPlayerById(torneo, perfSelectedPlayerId)) {
      let firstPlayer = null;
      for (let team of torneo.teams) {
        for (let player of team.players) {
          if (player.name && player.name.trim() !== '') {
            if (player.seasonStats && player.seasonStats.matchesPlayed > 0) { firstPlayer = player; break; }
            if (!firstPlayer) firstPlayer = player;
          }
        }
        if (firstPlayer && firstPlayer.seasonStats?.matchesPlayed > 0) break;
      }
      if (firstPlayer) perfSelectedPlayerId = firstPlayer.id;
    }

    if (perfSelectedPlayerId) {
      const playerContent = document.getElementById('perf-jugadores-content');
      if (playerContent && !playerContent.classList.contains('active')) playerContent.classList.add('active');

      const labels = getPlayoffLabels(torneo);
      const data = calculatePlayerPerformance(perfSelectedPlayerId, torneo);
      const marketData = calculatePlayerMarketValueHistory(perfSelectedPlayerId, torneo);

      const combinedData = data.map((d, idx) => {
        const market = marketData[idx] || { marketValue: 0 };
        return { ...d, marketValue: market.marketValue || 0 };
      });

      let pigPeak = { value: 0, label: '' };
      let valuePeak = { value: 0, label: '' };
      let valueMin = { value: Infinity, label: '' };

      combinedData.forEach((d, i) => {
        const lbl = labels[i]?.label || '';
        if (d.pig > pigPeak.value) { pigPeak.value = d.pig; pigPeak.label = lbl; }
        if (d.marketValue > valuePeak.value) { valuePeak.value = d.marketValue; valuePeak.label = lbl; }
        if (d.marketValue < valueMin.value && d.marketValue > 0) { valueMin.value = d.marketValue; valueMin.label = lbl; }
      });

      const visibleLines = {
        goals: document.getElementById('perf-show-goals')?.checked !== false,
        assists: document.getElementById('perf-show-assists')?.checked !== false,
        saves: document.getElementById('perf-show-saves')?.checked !== false,
        shots: document.getElementById('perf-show-shots')?.checked !== false,
        pig: document.getElementById('perf-show-pig')?.checked !== false,
        marketValue: document.getElementById('perf-show-value')?.checked !== false
      };

      const totalRounds = labels.length || 1;
      const totals = data;
      const avgGoals = (totals.totalGoals / totalRounds).toFixed(2);
      const avgAssists = (totals.totalAssists / totalRounds).toFixed(2);
      const avgSaves = (totals.totalSaves / totalRounds).toFixed(2);
      const avgShots = (totals.totalShots / totalRounds).toFixed(2);

      const statsHtml = `
        <div class="perf-avg-grid">
          <div class="perf-avg-card goals">
            <span class="avg-icon">⚽</span>
            <div class="avg-value">${totals.totalGoals}</div>
            <div class="avg-label">Goles Totales</div>
          </div>
          <div class="perf-avg-card assists">
            <span class="avg-icon">🎯</span>
            <div class="avg-value">${totals.totalAssists}</div>
            <div class="avg-label">Asistencias</div>
          </div>
          <div class="perf-avg-card saves">
            <span class="avg-icon">🧤</span>
            <div class="avg-value">${totals.totalSaves}</div>
            <div class="avg-label">Salvadas</div>
          </div>
          <div class="perf-avg-card shots">
            <span class="avg-icon">💀</span>
            <div class="avg-value">${totals.totalShots}</div>
            <div class="avg-label">Tiros</div>
          </div>
        </div>
        <div class="perf-avg-grid">
          <div class="perf-avg-card goals">
            <span class="avg-icon">📈</span>
            <div class="avg-value">${avgGoals}</div>
            <div class="avg-label">Prom. Goles / Jornada</div>
          </div>
          <div class="perf-avg-card assists">
            <span class="avg-icon">📈</span>
            <div class="avg-value">${avgAssists}</div>
            <div class="avg-label">Prom. Asist / Jornada</div>
          </div>
          <div class="perf-avg-card saves">
            <span class="avg-icon">📈</span>
            <div class="avg-value">${avgSaves}</div>
            <div class="avg-label">Prom. Salv / Jornada</div>
          </div>
          <div class="perf-avg-card shots">
            <span class="avg-icon">📈</span>
            <div class="avg-value">${avgShots}</div>
            <div class="avg-label">Prom. Tiros / Jornada</div>
          </div>
        </div>
        <div class="perf-peaks">
          <div class="peak-item"><span class="peak-label">📊 PIG Peak:</span> <span class="peak-value">${pigPeak.value.toFixed(1)}</span> <span class="text-muted">(${pigPeak.label})</span></div>
          ${valuePeak.value > 0 ? `<div class="peak-item"><span class="peak-label">💰 Valor Peak:</span> <span class="peak-value">${formatCurrency(valuePeak.value)}</span> <span class="text-muted">(${valuePeak.label})</span></div>` : ''}
          ${valueMin.value < Infinity ? `<div class="peak-item"><span class="peak-label">📉 Valor Mín:</span> <span class="peak-value">${formatCurrency(valueMin.value)}</span> <span class="text-muted">(${valueMin.label})</span></div>` : ''}
        </div>
      `;
      document.getElementById('perf-jugador-stats').innerHTML = statsHtml;

      requestAnimationFrame(() => {
        setTimeout(() => {
          drawPerformanceChart('perf-jugador-chart', combinedData, 'jugador', labels, visibleLines);
          setupTooltip('perf-jugador-chart');
        }, 50);
      });
    }
  }

  function refreshPerfChart(type) {
    if (type === 'equipo') renderPerformanceEquipos();
    else renderPerformanceJugadores();
  }

  function selectPerformanceEquipo(teamId) {
    if (perfSelectedTeamId === teamId) return;
    perfSelectedTeamId = teamId;
    renderPerformanceEquipos();
  }

  function selectPerformancePlayer(playerId) {
    if (perfSelectedPlayerId === playerId) return;
    perfSelectedPlayerId = playerId;
    renderPerformanceJugadores();
  }

  function switchPerfTab(tab) {
    perfCurrentTab = tab;
    document.querySelectorAll('.perf-tabs button').forEach(b => b.classList.remove('active'));
    document.querySelector(`.perf-tabs button[data-tab="${tab}"]`)?.classList.add('active');
    document.querySelectorAll('.perf-sub-view').forEach(v => v.classList.remove('active'));

    if (tab === 'equipos') {
      document.getElementById('perf-equipos-content').classList.add('active');
      document.getElementById('perf-title').textContent = 'Equipos';
      renderPerformanceEquipos();
    } else {
      document.getElementById('perf-jugadores-content').classList.add('active');
      document.getElementById('perf-title').textContent = 'Jugadores';
      renderPerformanceJugadores();
    }
  }

    const tab = perfCurrentTab || 'equipos';

      const data = calculateTeamPerformance(perfSelectedTeamId, torneo);
      const matches = data.matches || 0;
