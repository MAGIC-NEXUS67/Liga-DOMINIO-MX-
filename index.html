<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>MTM · Visualizador de Torneo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,900&family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ========================================
       VARIABLES GLOBALES (tema por defecto)
       ======================================== */
    :root {
      --color-bg: #0a0a0f;
      --color-surface: #14141e;
      --color-surface-hover: #1e1e2f;
      --color-text: #e2e8f0;
      --color-text-muted: #94a3b8;
      --color-border: #2d2d44;
      --neon-purple: #a855f7;
      --neon-cyan: #22d3ee;
      --neon-pink: #ec4899;
      --neon-green: #4ade80;
      --neon-yellow: #facc15;
      --neon-red: #f87171;
      --radius: 12px;
      --font-size-base: 14px;
      --spacing-base: 0.8rem;
      --density-scale: 1;
      --logo-url: none;
    }

    /* Tema DOMINIO MX */
    [data-theme="dominio"] {
      --color-bg: #000000;
      --color-surface: #0a0a0a;
      --color-surface-hover: #1a1a1a;
      --color-text: #e8e8e8;
      --color-text-muted: #aaaaaa;
      --color-border: #2a2a2a;
      --neon-purple: #00a84d;
      --neon-cyan: #00a84d;
      --neon-pink: #d32f2f;
      --neon-green: #00a84d;
      --neon-yellow: #ffc107;
      --neon-red: #d32f2f;
    }

    /* Tema Claro */
    [data-theme="light"] {
      --color-bg: #f5f5f5;
      --color-surface: #ffffff;
      --color-surface-hover: #eeeeee;
      --color-text: #222222;
      --color-text-muted: #666666;
      --color-border: #cccccc;
      --neon-purple: #3b82f6;
      --neon-cyan: #06b6d4;
      --neon-pink: #ec4899;
      --neon-green: #22c55e;
      --neon-yellow: #eab308;
      --neon-red: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: var(--font-size-base);
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

    /* ========================================
       LAYOUT PRINCIPAL
       ======================================== */
    .app {
      display: flex;
      min-height: 100vh;
      background: var(--color-bg);
    }

    /* SIDEBAR (PC) */
    .sidebar {
      width: 220px;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(8px);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease, background 0.3s;
      z-index: 100;
    }
    [data-theme="dominio"] .sidebar {
      background: rgba(0, 0, 0, 0.97);
    }
    [data-theme="light"] .sidebar {
      background: rgba(255, 255, 255, 0.95);
    }

    .sidebar-brand {
      padding: 1.2rem 1rem 0.8rem;
      border-bottom: 1px solid var(--color-border);
      text-align: center;
      transition: border-color 0.3s;
    }
    .sidebar-brand .logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 0.5rem;
      border-radius: 50%;
      background: #000;
      border: 2px solid var(--color-border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-brand .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .sidebar-brand .logo-container .no-logo {
      color: var(--color-text-muted);
      font-size: 0.6rem;
      text-align: center;
      padding: 0.2rem;
    }
    .sidebar-brand h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.5px;
      transition: color 0.3s;
    }
    .sidebar-brand h1 .mtm { color: var(--neon-purple); }
    .sidebar-brand h1 .mtm span { color: var(--neon-purple); }
    [data-theme="dominio"] .sidebar-brand h1 .mtm .liga { color: #00a84d; }
    [data-theme="dominio"] .sidebar-brand h1 .mtm .dom { color: #ffffff; }
    [data-theme="dominio"] .sidebar-brand h1 .mtm .mx { color: #d32f2f; }
    [data-theme="light"] .sidebar-brand h1 .mtm { color: #3b82f6; }

    .sidebar-brand small {
      display: block;
      font-size: 0.6rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
      transition: color 0.3s;
    }
    [data-theme="dominio"] .sidebar-brand small .comp { color: #00a84d; }
    [data-theme="dominio"] .sidebar-brand small .domina { color: #ffffff; }
    [data-theme="dominio"] .sidebar-brand small .repite { color: #d32f2f; }

    /* ========================================
       MENÚ PRINCIPAL CON SUBMENÚS
       ======================================== */
    .sidebar-nav {
      flex: 1;
      padding: 0.5rem 0.3rem;
      overflow-y: auto;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      margin-bottom: 2px;
    }
    .nav-item:hover {
      background: var(--color-surface-hover);
      color: #fff;
    }
    .nav-item.active {
      background: var(--color-surface-hover);
      border-left-width: 5px;
      color: #fff;
    }
    /* Alternancia de colores en DOMINIO MX: primeros 4 verdes, siguientes 5 blancos, últimos 4 rojos */
    [data-theme="dominio"] .nav-item:nth-child(-n+4) { border-left-color: #00a84d; }
    [data-theme="dominio"] .nav-item:nth-child(n+5):nth-child(-n+9) { border-left-color: #ffffff; }
    [data-theme="dominio"] .nav-item:nth-child(n+10) { border-left-color: #d32f2f; }
    [data-theme="dominio"] .nav-item.active {
      border-left-width: 5px;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.05);
    }
    [data-theme="dominio"] .nav-item:nth-child(-n+4).active { border-left-color: #00a84d; box-shadow: 0 0 12px #00a84d44; }
    [data-theme="dominio"] .nav-item:nth-child(n+5):nth-child(-n+9).active { border-left-color: #ffffff; box-shadow: 0 0 12px #ffffff44; }
    [data-theme="dominio"] .nav-item:nth-child(n+10).active { border-left-color: #d32f2f; box-shadow: 0 0 12px #d32f2f44; }

    .nav-item i {
      width: 1.2rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .nav-divider {
      border-top: 1px solid var(--color-border);
      margin: 0.6rem 0.5rem;
      padding: 0.4rem 0 0.2rem;
    }
    .nav-divider span {
      font-size: 0.55rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 700;
      padding: 0 0.5rem;
    }

    /* Submenú */
    .nav-parent {
      margin-bottom: 2px;
    }
    .nav-parent .nav-toggle {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      width: 100%;
      background: transparent;
      border: none;
      text-align: left;
      font-family: inherit;
    }
    .nav-parent .nav-toggle:hover {
      background: var(--color-surface-hover);
      color: #fff;
    }
    .nav-parent .nav-toggle .arrow {
      margin-left: auto;
      transition: transform 0.2s;
    }
    .nav-parent.open .nav-toggle .arrow {
      transform: rotate(90deg);
    }
    .nav-parent .nav-children {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
      padding-left: 1.2rem;
    }
    .nav-parent.open .nav-children {
      max-height: 500px; /* suficiente para un hijo */
    }
    .nav-parent .nav-children .nav-item {
      border-left: 3px solid var(--color-border);
      margin-bottom: 1px;
      padding-left: 1.2rem;
    }
    .nav-parent .nav-children .nav-item.active {
      border-left-color: var(--neon-purple);
    }

    /* ========================================
       BOTÓN HAMBURGUESA (móvil)
       ======================================== */
    .hamburger {
      display: none;
      position: fixed;
      top: 0.8rem;
      left: 0.8rem;
      z-index: 200;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.5rem 0.7rem;
      color: var(--color-text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .hamburger:hover { background: var(--color-surface-hover); }

    /* SIDEBAR FOOTER */
    .sidebar-footer {
      padding: 0.8rem 0.6rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: border-color 0.3s;
    }
    .sidebar-footer .settings-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.4rem 1rem;
      color: var(--color-text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      justify-content: center;
    }
    .sidebar-footer .settings-btn:hover {
      background: var(--color-surface-hover);
      color: #fff;
      border-color: var(--neon-purple);
    }
    .sidebar-footer .settings-btn i {
      font-size: 0.9rem;
    }

    /* CONTENIDO PRINCIPAL */
    .main {
      flex: 1;
      padding: 1.2rem 2rem 2rem;
      overflow-y: auto;
      max-height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      transition: padding 0.3s;
    }

    /* ========================================
       DENSIDADES
       ======================================== */
    [data-density="compact"] {
      --font-size-base: 12px;
      --spacing-base: 0.5rem;
    }
    [data-density="compact"] .main { padding: 0.6rem 1rem 1.5rem; }
    [data-density="compact"] .card { padding: 0.5rem; }
    [data-density="compact"] .section-title { font-size: 1rem; }
    [data-density="compact"] table { font-size: 0.65rem; }

    [data-density="spacious"] {
      --font-size-base: 16px;
      --spacing-base: 1.2rem;
    }
    [data-density="spacious"] .main { padding: 2rem 3rem 3rem; }
    [data-density="spacious"] .card { padding: 1.5rem; }
    [data-density="spacious"] .section-title { font-size: 1.8rem; }
    [data-density="spacious"] table { font-size: 0.9rem; }
    [data-density="spacious"] thead th { padding: 0.8rem 1rem; }
    [data-density="spacious"] tbody td { padding: 0.8rem 1rem; }

    /* ========================================
       SECCIONES
       ======================================== */
    .section {
      display: none;
      animation: fadeSlide 0.3s ease;
    }
    .section.active { display: block; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.3px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      transition: color 0.3s;
    }
    .section-title span { color: var(--neon-purple); }
    .section-title .print-btn {
      margin-left: auto;
      font-size: 0.7rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.3rem 0.8rem;
      color: var(--color-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: 0.2s;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }
    .section-title .print-btn:hover {
      background: var(--neon-purple);
      color: #000;
      border-color: var(--neon-purple);
    }

    /* CARDS */
    .card {
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.8rem 1rem;
      margin-bottom: 0.8rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: border-color 0.2s, background 0.3s;
    }
    .card:hover { border-color: var(--neon-purple); }

    .card-header {
      font-weight: 700;
      color: var(--color-text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header .expand-btn {
      font-size: 0.6rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      padding: 0.1rem 0.6rem;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: 0.2s;
    }
    .card-header .expand-btn:hover {
      background: var(--neon-purple);
      color: #000;
    }

    /* TABLAS */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      background: rgba(0,0,0,0.2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    thead {
      background: rgba(30, 30, 47, 0.6);
      border-bottom: 1px solid var(--color-border);
    }
    thead th {
      padding: 0.6rem 0.8rem;
      text-align: left;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      font-size: 0.65rem;
      white-space: nowrap;
    }

    /* Colores de encabezados según tema */
    .th-pts { color: var(--neon-cyan); }
    .th-pj { color: var(--color-text); }
    .th-pg { color: var(--neon-green); }
    .th-pe { color: var(--neon-yellow); }
    .th-pp { color: var(--neon-red); }
    .th-gf { color: var(--neon-cyan); }
    .th-gc { color: var(--neon-pink); }
    .th-dg { color: var(--neon-yellow); }

    [data-theme="dominio"] .th-pts { color: #00a84d; }
    [data-theme="dominio"] .th-pj { color: #ffffff; }
    [data-theme="dominio"] .th-pg { color: #ffffff; }
    [data-theme="dominio"] .th-pe { color: #d32f2f; }
    [data-theme="dominio"] .th-pp { color: #d32f2f; }
    [data-theme="dominio"] .th-gf { color: #00a84d; }
    [data-theme="dominio"] .th-gc { color: #d32f2f; }
    [data-theme="dominio"] .th-dg { color: #ffffff; }

    [data-theme="light"] .th-pts { color: #3b82f6; }
    [data-theme="light"] .th-pj { color: #222; }
    [data-theme="light"] .th-pg { color: #22c55e; }
    [data-theme="light"] .th-pe { color: #eab308; }
    [data-theme="light"] .th-pp { color: #ef4444; }
    [data-theme="light"] .th-gf { color: #3b82f6; }
    [data-theme="light"] .th-gc { color: #ec4899; }
    [data-theme="light"] .th-dg { color: #eab308; }

    /* Colores para celdas de datos */
    .td-pts { color: var(--neon-cyan); font-weight: 700; }
    .td-pj { color: var(--color-text); }
    .td-pg { color: var(--neon-green); font-weight: 700; }
    .td-pe { color: var(--neon-yellow); font-weight: 700; }
    .td-pp { color: var(--neon-red); font-weight: 700; }
    .td-gf { color: var(--neon-cyan); font-weight: 700; }
    .td-gc { color: var(--neon-pink); font-weight: 700; }
    .td-dg { color: var(--neon-yellow); font-weight: 700; }

    [data-theme="dominio"] .td-pts { color: #00a84d; }
    [data-theme="dominio"] .td-pj { color: #ffffff; }
    [data-theme="dominio"] .td-pg { color: #ffffff; }
    [data-theme="dominio"] .td-pe { color: #d32f2f; }
    [data-theme="dominio"] .td-pp { color: #d32f2f; }
    [data-theme="dominio"] .td-gf { color: #00a84d; }
    [data-theme="dominio"] .td-gc { color: #d32f2f; }
    [data-theme="dominio"] .td-dg { color: #ffffff; }

    [data-theme="light"] .td-pts { color: #3b82f6; }
    [data-theme="light"] .td-pj { color: #222; }
    [data-theme="light"] .td-pg { color: #22c55e; }
    [data-theme="light"] .td-pe { color: #eab308; }
    [data-theme="light"] .td-pp { color: #ef4444; }
    [data-theme="light"] .td-gf { color: #3b82f6; }
    [data-theme="light"] .td-gc { color: #ec4899; }
    [data-theme="light"] .td-dg { color: #eab308; }

    tbody tr {
      border-bottom: 1px solid rgba(45, 45, 68, 0.25);
      transition: background 0.15s;
    }
    tbody tr:hover { background: var(--color-surface-hover); }
    tbody td {
      padding: 0.5rem 0.8rem;
      vertical-align: middle;
    }

    /* POWER BADGES */
    .power-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 0.05rem 0.5rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
      margin-right: 0.2rem;
    }
    .power-badge.atk { color: var(--neon-cyan); background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.25); }
    .power-badge.def { color: var(--neon-pink); background: rgba(236,72,153,0.12); border: 1px solid rgba(236,72,153,0.25); }
    .power-badge.glb { color: var(--neon-yellow); background: rgba(250,204,21,0.12); border: 1px solid rgba(250,204,21,0.25); }
    [data-theme="dominio"] .power-badge.atk { color: #00a84d; border-color: #00a84d; background: rgba(0,168,77,0.15); }
    [data-theme="dominio"] .power-badge.def { color: #d32f2f; border-color: #d32f2f; background: rgba(211,47,47,0.15); }
    [data-theme="dominio"] .power-badge.glb { color: #ffffff; border-color: #ffffff; background: rgba(255,255,255,0.1); }

    .row-clasif { border-left: 4px solid var(--neon-green); }
    .row-descenso { border-left: 4px solid var(--neon-red); }
    .row-ascenso { border-left: 4px solid var(--neon-yellow); }

    /* JUGADORES */
    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.6rem;
      padding: 0.2rem 0;
    }
    .player-tag {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 0.1rem 0.6rem;
      font-size: 0.75rem;
      border: 1px solid var(--color-border);
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      white-space: nowrap;
    }
    .player-tag.captain { border-color: var(--neon-yellow); color: var(--neon-yellow); }
    .player-tag.titular { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .player-tag.suplente { border-color: var(--neon-pink); color: var(--neon-pink); }
    .player-tag.reserva { border-color: var(--color-border); color: var(--color-text-muted); }

    /* FILTROS */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      align-items: center;
    }
    .filters select, .filters input {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.35rem 0.7rem;
      color: var(--color-text);
      font-size: 0.75rem;
      outline: none;
    }
    .filters select:focus, .filters input:focus { border-color: var(--neon-purple); }

    /* PÓDIUM - ESTILO CÍRCULOS ESCALONADOS */
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 2rem;
      padding: 1.5rem 0;
      min-height: 200px;
    }
    .podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: 0.2s;

    }
    .podium-item .circle {

    .podium-item.first .circle {

    .podium-item.second {
      transform: translateY(0px);

    /* MVPs */
    .mvp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
    }
    .mvp-card {
      background: var(--color-surface);

    }
    .mvp-card .name {
      font-weight: 700;
      font-size: 0.85rem;
    }
    .mvp-card .stat {

    .jornada-nav {
      display: flex;
      flex-wrap: wrap;

      margin-bottom: 0.6rem;
    }
    .jornada-nav button {
      background: rgba(255,255,255,0.05);

      padding: 0.2rem 0.7rem;

    }
    .jornada-nav button:hover {

    }
    .jornada-nav button.active {
      background: var(--neon-purple);

      border-color: var(--neon-purple);

    .shield-sm {
      width: 1.6rem;
      height: 1.6rem;
      object-fit: contain;
      background: #000;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    /* MODAL DE IMPRESIÓN / AJUSTES */
    .print-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }
    .print-modal {
      background: var(--color-surface);

      border-radius: var(--radius);

      max-width: 95vw;

    .print-modal h3 {

    }
    .print-modal .preview {

    }
    .print-modal .preview img {

    }
    .print-modal .actions {
      display: flex;

    .print-modal .actions button {

    .print-modal .actions .btn-cancel {

    .print-modal .actions .btn-cancel:hover {

    }
    .print-modal .actions .btn-download {
      background: var(--neon-purple);

    }
    .print-modal .actions .btn-download:hover {

    }

    /* MODAL DE AJUSTES */
    .settings-modal {
      max-width: 650px;
    }
    .settings-modal .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--color-border);

    }
    .settings-modal .tabs button {
      background: transparent;
      border: none;
      padding: 0.4rem 1rem;
      color: var(--color-text-muted);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: 0.2s;
    }
    .settings-modal .tabs button:hover {
      background: var(--color-surface-hover);

    }
    .settings-modal .tabs button.active {
      background: var(--neon-purple);
      color: #000;
    }
    .settings-modal .tab-content {
      display: none;
    }
    .settings-modal .tab-content.active {
      display: block;
    }
    .settings-modal .tab-content label {
      display: block;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      margin-bottom: 0.3rem;
      font-weight: 700;
    }
    .settings-modal .tab-content .option-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }
    .settings-modal .tab-content .option-group button {
      padding: 0.3rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.75rem;
    }
    .settings-modal .tab-content .option-group button:hover {
      background: var(--color-surface-hover);
    }
    .settings-modal .tab-content .option-group button.active {
      background: var(--neon-purple);
      color: #000;
      border-color: var(--neon-purple);
    }
    .settings-modal .theme-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1rem;
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 0.5rem;
    }
    .settings-modal .theme-card:hover {
      border-color: var(--neon-purple);
    }
    .settings-modal .theme-card.active {
      border-color: var(--neon-purple);
      background: rgba(168,85,247,0.08);
    }
    .settings-modal .theme-card .preview {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid var(--color-border);
    }
    .settings-modal .theme-card .info .name {
      font-weight: 700;
      font-size: 0.9rem;
    }
    .settings-modal .theme-card .info .desc {
      font-size: 0.7rem;
      color: var(--color-text-muted);
    }
    .settings-modal .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .settings-modal .btn-row button {
      padding: 0.3rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.7rem;
    }
    .settings-modal .btn-row button:hover {
      background: var(--color-surface-hover);
    }
    .settings-modal .btn-row button.primary {
      background: var(--neon-purple);
      color: #000;
      border-color: var(--neon-purple);
    }
    .settings-modal .btn-row button.primary:hover {
      opacity: 0.85;
    }

    /* RESPONSIVE */
    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        transform: translateX(-100%);
        width: 260px;
        height: 100vh;
        box-shadow: 4px 0 20px rgba(0,0,0,0.6);
        border-right: 1px solid var(--color-border);
      }
      .sidebar.open { transform: translateX(0); }
      .hamburger { display: block; }
      .main {
        padding: 0.8rem 0.8rem 1.5rem;
        margin-top: 3rem;
        max-width: 100%;
      }
      .section-title { font-size: 1.1rem; }
      table { font-size: 0.7rem; }
      thead th, tbody td { padding: 0.35rem 0.5rem; }
      .podium { gap: 1rem; }
      .podium-item .circle { width: 60px; height: 60px; }
      .podium-item.first .circle { width: 75px; height: 75px; }
      .podium-item.second .circle { width: 65px; height: 65px; }
      .podium-item.third .circle { width: 55px; height: 55px; }
      .podium-item .name { font-size: 0.7rem; max-width: 80px; }
      .podium-item.first { transform: translateY(-10px); }
      .podium-item.third { transform: translateY(10px); }
      .settings-modal { max-width: 100%; }
    }

    @media (max-width: 480px) {
      .main { padding: 0.5rem 0.5rem 1rem; }
      .card { padding: 0.5rem; }
      .filters select, .filters input { font-size: 0.6rem; padding: 0.2rem 0.4rem; }
      .podium-item .circle { width: 50px; height: 50px; }
      .podium-item.first .circle { width: 60px; height: 60px; }
      .podium-item.second .circle { width: 55px; height: 55px; }

    /* UTILIDADES */
    .text-muted { color: var(--color-text-muted); }
    .text-neon-cyan { color: var(--neon-cyan); }
    .text-neon-pink { color: var(--neon-pink); }
    .text-neon-green { color: var(--neon-green); }
    .text-neon-yellow { color: var(--neon-yellow); }
    .text-neon-red { color: var(--neon-red); }
    .text-neon-purple { color: var(--neon-purple); }

    .flex-center { display: flex; align-items: center; gap: 0.4rem; }
    .gap-1 { gap: 0.3rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .fw-700 { font-weight: 700; }

    .empty-state {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }

      opacity: 0.5;
    }

    .match-clickable {
      cursor: pointer;
      transition: background 0.15s;
    }
    .match-clickable:hover {
      background: var(--color-surface-hover);
    }

    .print-preview-img {
      max-width: 100%;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    /* TABLAS DE PRECIOS */
    .price-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .price-table th, .price-table td {
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--color-border);
      text-align: center;
    }
    .price-table th {
      background: rgba(30,30,47,0.6);
      color: var(--color-text-muted);
      font-weight: 700;
      font-size: 0.6rem;
      text-transform: uppercase;
    }

    }

      background: rgba(168,85,247,0.1);

    .price-table .rango-header {
      font-weight: 900;

      color: var(--neon-purple);

    [data-theme="dominio"] .price-table .rango-header { color: #00a84d; }
    [data-theme="light"] .price-table .rango-header { color: #3b82f6; }

</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo-container" id="logoContainer">
        <img id="logoImage" src="" alt="Logo" style="display:none;" />
        <span class="no-logo" id="noLogoText">🖼️ Logo</span>
      </div>
      <h1 class="mtm" id="brandTitle">MTM <span>NEXUS</span></h1>
      <small id="brandSub">Visualizador de Torneo</small>
    </div>
    <nav class="sidebar-nav" id="mainNav"></nav>
    <div class="sidebar-footer">
      <button class="settings-btn" onclick="openSettings()">
        <i class="fas fa-cog"></i> Ajustes
      </button>
    </div>
  </aside>

  <!-- BOTÓN HAMBURGUESA -->
  <button class="hamburger" id="hamburgerBtn" aria-label="Menú">
    <i class="fas fa-bars"></i>
  </button>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main" id="mainContent">
    <div id="sectionsContainer"></div>
  </main>

</div>

<script>
  // ==========================================
  // CONFIGURACIÓN DE MENÚS (con submenú para Mercado)
  // ==========================================
  const MENU_ITEMS = [
    { id: 'tabla', label: 'Tabla General', icon: 'fa-table' },
    { id: 'media', label: 'Tabla de Media', icon: 'fa-chart-simple' },
    { id: 'jornadas', label: 'Jornadas', icon: 'fa-calendar-day' },
    { id: 'playoffs', label: 'PlayOffs', icon: 'fa-sitemap' },
    { id: 'stats', label: 'Stats', icon: 'fa-chart-bar' },
    { id: 'balon', label: 'Balón de Oro', icon: 'fa-trophy' },
    { id: 'equipos', label: 'Equipos', icon: 'fa-users' },
    { id: 'mercado', label: 'Mercado', icon: 'fa-store', children: [
      { id: 'precios', label: 'Precios agentes libres', icon: 'fa-tag' }
    ] },
    { id: 'economia', label: 'Mov. Económicos', icon: 'fa-coins' },
    { id: 'sanciones', label: 'Sanciones', icon: 'fa-gavel' },
    { id: 'seleccion', label: 'Selección Nacional', icon: 'fa-flag' },
    { id: 'amistosos', label: 'Partidos Amistosos', icon: 'fa-handshake' },
    { id: 'salon', label: 'Salón de la Fama', icon: 'fa-medal' }
  ];

  let data = null;
  let currentSection = 'tabla';
  const statsLimits = { goals: 10, assists: 10, saves: 10, shots: 10 };
  const MAX_STATS_LIMIT = 50;
  let currentMvpJornada = 0;

  const sidebar = document.getElementById('sidebar');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mainNav = document.getElementById('mainNav');
  const sectionsContainer = document.getElementById('sectionsContainer');

  // ==========================================
  // UTILIDADES
  // ==========================================
  function formatCurrency(amount) {
    if (amount >= 1e6) return '$' + (amount / 1e6).toFixed(1) + 'M';
    if (amount >= 1e3) return '$' + (amount / 1e3).toFixed(0) + 'K';
    return '$' + amount.toFixed(0);
  }

  function getRankColor(rank) {
    const colors = {
      'Bronce': '#cd7f32', 'Plata': '#c0c0c0', 'Oro': '#ffd700',
      'Platino': '#e5e4e2', 'Diamante': '#b9f2ff', 'Campeón': '#ff6b6b',
      'Gran Campeón': '#ff4757', 'SSL': '#ff4757'
    };
    return colors[rank] || '#fff';
  }

  function getTeamById(teams, id) {
    return teams.find(t => t.id === id);
  }

  // ==========================================
  // TEMAS Y DENSIDAD
  // ==========================================
  let currentTheme = 'dominio';
  let currentDensity = 'normal';
  let customThemes = [];

  function loadCustomThemes() {
    try {
      const saved = localStorage.getItem('mtm_custom_themes');
      if (saved) customThemes = JSON.parse(saved);
    } catch (_) { customThemes = []; }
  }

  function saveCustomThemes() {
    localStorage.setItem('mtm_custom_themes', JSON.stringify(customThemes));
  }

  function applyTheme(theme) {
    currentTheme = theme;
    let themeConfig = null;
    if (theme.startsWith('custom_')) {
      const id = theme.replace('custom_', '');
      themeConfig = customThemes.find(t => t.id === id);
      if (!themeConfig) {
        applyTheme('dominio');
        return;
      }
    }

    if (theme === 'dominio') {
      document.documentElement.setAttribute('data-theme', 'dominio');
      document.getElementById('brandTitle').innerHTML = '<span class="liga">LIGA</span> <span class="dom">DOMINIO</span> <span class="mx">MX</span>';
      document.getElementById('brandSub').innerHTML = '<span class="comp">COMPITE</span>, <span class="domina">DOMINA</span> <span class="repite">Y REPITE</span>';
      loadLogo('logo.png', 'logo.jpg');
    } else if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.getElementById('brandTitle').innerHTML = 'MTM <span>NEXUS</span>';
      document.getElementById('brandSub').textContent = 'Modo Claro';
      loadLogo('logo.png', 'logo.jpg');
    } else if (theme.startsWith('custom_') && themeConfig) {
      document.documentElement.removeAttribute('data-theme');
      const root = document.documentElement.style;
      root.setProperty('--color-bg', themeConfig.colors.bg || '#0a0a0f');
      root.setProperty('--color-surface', themeConfig.colors.surface || '#14141e');
      root.setProperty('--color-surface-hover', themeConfig.colors.surfaceHover || '#1e1e2f');
      root.setProperty('--color-text', themeConfig.colors.text || '#e2e8f0');
      root.setProperty('--color-text-muted', themeConfig.colors.textMuted || '#94a3b8');
      root.setProperty('--color-border', themeConfig.colors.border || '#2d2d44');
      root.setProperty('--neon-purple', themeConfig.colors.purple || '#a855f7');
      root.setProperty('--neon-cyan', themeConfig.colors.cyan || '#22d3ee');
      root.setProperty('--neon-pink', themeConfig.colors.pink || '#ec4899');
      root.setProperty('--neon-green', themeConfig.colors.green || '#4ade80');
      root.setProperty('--neon-yellow', themeConfig.colors.yellow || '#facc15');
      root.setProperty('--neon-red', themeConfig.colors.red || '#f87171');
      document.getElementById('brandTitle').innerHTML = themeConfig.name || 'Tema personalizado';
      document.getElementById('brandSub').textContent = themeConfig.subtitle || 'Personalizado';
      loadLogo('logo.png', 'logo.jpg');
    } else {
      applyTheme('dominio');
      return;
    }
    localStorage.setItem('mtm_theme', theme);
  }

  function applyDensity(density) {
    currentDensity = density;
    document.documentElement.setAttribute('data-density', density);
    localStorage.setItem('mtm_density', density);
  }

  function loadLogo(...names) {
    const img = document.getElementById('logoImage');
    const noLogo = document.getElementById('noLogoText');
    for (let name of names) {
      const testImg = new Image();
      testImg.onload = function() {
        img.src = name;
        img.style.display = 'block';
        noLogo.style.display = 'none';
      };
      testImg.onerror = function() {
        img.style.display = 'none';
        noLogo.style.display = 'block';
      };
      testImg.src = name;
      break;
    }
  }

  function loadPreferences() {
    const savedTheme = localStorage.getItem('mtm_theme');
    if (savedTheme) {
      if (savedTheme.startsWith('custom_')) {
        const id = savedTheme.replace('custom_', '');
        if (customThemes.some(t => t.id === id)) {
          applyTheme(savedTheme);
          return;
        }
      }
      applyTheme(savedTheme);
    } else {
      applyTheme('dominio');
    }
    const savedDensity = localStorage.getItem('mtm_density');
    if (savedDensity) applyDensity(savedDensity);
    else applyDensity('normal');
  }

  // ==========================================
  // AJUSTES (modal)
  // ==========================================
  function openSettings() {
    loadCustomThemes();

    const overlay = document.createElement('div');
    overlay.className = 'print-modal-overlay';
    overlay.innerHTML = `
      <div class="print-modal settings-modal">
        <h3><i class="fas fa-cog"></i> Ajustes</h3>
        <div class="tabs">
          <button class="active" data-tab="personalizacion">Personalización</button>
          <button data-tab="temas">Temas</button>
        </div>
        <div id="settings-personalizacion" class="tab-content active">
          <label>Densidad (solo PC)</label>
          <div class="option-group">
            <button data-density="compact" class="${currentDensity === 'compact' ? 'active' : ''}">Compacto</button>
            <button data-density="normal" class="${currentDensity === 'normal' ? 'active' : ''}">Normal</button>
            <button data-density="spacious" class="${currentDensity === 'spacious' ? 'active' : ''}">Espacioso</button>
          </div>
          <p style="font-size:0.7rem;color:var(--color-text-muted);">Ajusta el espaciado y tamaño de los elementos en pantalla.</p>
        </div>
        <div id="settings-temas" class="tab-content">
          <label>Selecciona un tema</label>
          <div class="theme-card ${currentTheme === 'mtm' ? 'active' : ''}" data-theme="mtm">
            <div class="preview" style="background:linear-gradient(135deg,#0a0a0f,#14141e);border-color:#a855f7;"></div>
            <div class="info">

  // ==========================================
  // EXPORTAR / IMPORTAR TEMAS
  // ==========================================
  function exportTheme() {
    const theme = currentTheme;
    let themeData = null;
    if (theme === 'mtm') {
      themeData = {
        name: 'MTM Visualizador de Torneo',
        subtitle: 'Morado / Neón',
        colors: {
          bg: '#0a0a0f',
          surface: '#14141e',
          surfaceHover: '#1e1e2f',
          text: '#e2e8f0',
          textMuted: '#94a3b8',
          border: '#2d2d44',
          purple: '#a855f7',
          cyan: '#22d3ee',
          pink: '#ec4899',
          green: '#4ade80',
          yellow: '#facc15',
          red: '#f87171'
        }
      };
    } else if (theme === 'dominio') {
      themeData = {
        name: 'Liga DOMINIO MX',
        subtitle: 'Verde · Blanco · Rojo',
        colors: {
          bg: '#000000',
          surface: '#0a0a0a',
          surfaceHover: '#1a1a1a',
          text: '#e8e8e8',
          textMuted: '#aaaaaa',
          border: '#2a2a2a',
          purple: '#00a84d',
          cyan: '#00a84d',
          pink: '#d32f2f',
          green: '#00a84d',
          yellow: '#ffc107',
          red: '#d32f2f'
        }
      };
    } else if (theme === 'light') {
      themeData = {
        name: 'Modo Claro',
        subtitle: 'Fondo blanco',
        colors: {
          bg: '#f5f5f5',
          surface: '#ffffff',
          surfaceHover: '#eeeeee',
          text: '#222222',
          textMuted: '#666666',
          border: '#cccccc',
          purple: '#3b82f6',
          cyan: '#06b6d4',
          pink: '#ec4899',
          green: '#22c55e',
          yellow: '#eab308',
          red: '#ef4444'
        }
      };
    } else if (theme.startsWith('custom_')) {
      const id = theme.replace('custom_', '');
      const found = customThemes.find(t => t.id === id);
      if (found) {
        themeData = { ...found };
      }
    }
    if (!themeData) {
      alert('No se puede exportar este tema.');
      return;
    }
    const json = JSON.stringify(themeData, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tema_${themeData.name.replace(/\s+/g, '_')}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importTheme(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.colors || !data.name) {
          alert('Archivo de tema inválido. Debe contener "name" y "colors".');
          return;
        }
        const id = 'theme_' + Date.now();
        data.id = id;
        customThemes.push(data);
        saveCustomThemes();
        applyTheme('custom_' + id);
        document.querySelector('.print-modal-overlay')?.remove();
        openSettings();
        alert('✅ Tema importado correctamente.');
      } catch (err) {
        alert('Error al leer el archivo: ' + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function getPrintHeader(title) {
    const logoImg = document.getElementById('logoImage');

    const leagueName = document.getElementById('brandTitle').innerText || 'LIGA DOMINIO MX';
    return `
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.5rem;border-bottom:2px solid #2d2d44;padding-bottom:0.5rem;">
        ${logoUrl ? `<img src="${logoUrl}" style="width:50px;height:50px;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;" />` : ''}
        <div>
          <div style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:1.2rem;color:var(--neon-purple);">${leagueName}</div>
          <div style="font-size:0.8rem;color:#94a3b8;">${title}</div>

      </div>

  function showPrintModal(htmlContent, filename, width = 800) {
    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'fixed';
    tempDiv.style.left = '-9999px';
    tempDiv.style.top = '0';
    tempDiv.style.width = width + 'px';
    tempDiv.style.background = '#0a0a0f';
    tempDiv.style.padding = '1rem';
    tempDiv.style.color = '#e2e8f0';
    tempDiv.style.fontFamily = 'Inter, system-ui, sans-serif';
    tempDiv.style.borderRadius = '8px';
    tempDiv.innerHTML = htmlContent;
    document.body.appendChild(tempDiv);

    html2canvas(tempDiv, {
      scale: 2,
      backgroundColor: '#0a0a0f',
      useCORS: true,
      logging: false,
      windowHeight: tempDiv.scrollHeight,
      windowWidth: tempDiv.scrollWidth
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      tempDiv.remove();

      const overlay = document.createElement('div');
      overlay.className = 'print-modal-overlay';
      overlay.innerHTML = `
        <div class="print-modal">
          <h3><i class="fas fa-print"></i> Vista previa</h3>
          <div class="preview">
            <img src="${imgData}" class="print-preview-img" alt="Vista previa" />
          </div>
          <div class="actions">
            <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cancelar</button>
            <button class="btn-download" onclick="downloadImage('${imgData}', '${filename}'); this.closest('.print-modal-overlay').remove();">Descargar</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }).catch(err => {
      tempDiv.remove();
      alert('Error al generar vista previa: ' + err.message);
    });
  }

  function downloadImage(dataUrl, filename) {
    const link = document.createElement('a');
    link.download = filename;
    link.href = dataUrl;
    link.click();
  }

  // ---------- TABLA GENERAL ----------
  function renderTabla(torneo) {
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay equipos.</div>';
    const teams = [...torneo.teams];
    teams.sort((a,b) => b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf);
    const lig = torneo.tableConfig?.liguilla ?? 8;
    const des = torneo.tableConfig?.descenso ?? 2;
    const asc = torneo.tableConfig?.ascenso ?? 2;

    let html = `<div class="table-wrap" id="tabla-general-container"><table><thead><tr>`;
    html += `<th class="th-pts">#</th><th>Equipo</th><th class="th-pts">Pts</th><th class="th-pj">PJ</th><th class="th-pg">PG</th><th class="th-pe">PE</th><th class="th-pp">PP</th><th class="th-gf">GF</th><th class="th-gc">GC</th><th class="th-dg">DG</th>`;
    html += `</tr></thead><tbody>`;
    teams.forEach((tm, i) => {
      let rowClass = '';
      if (i < asc && torneo.linkedTournamentId) rowClass = 'row-ascenso';
      else if (i < lig) rowClass = 'row-clasif';
      else if (i >= teams.length - des && des > 0) rowClass = 'row-descenso';
      const dg = (tm.gf||0) - (tm.gc||0);
      html += `<tr class="${rowClass}">`;
      html += `<td>${i+1}</td>`;
      html += `<td class="flex-center"><img src="${tm.shield||''}" class="shield-sm" alt=""> ${tm.name}</td>`;
      html += `<td class="td-pts"><strong>${tm.pts||0}</strong></td>`;
      html += `<td class="td-pj">${tm.pj||0}</td>`;
      html += `<td class="td-pg">${tm.pg||0}</td>`;
      html += `<td class="td-pe">${tm.pe||0}</td>`;
      html += `<td class="td-pp">${tm.pp||0}</td>`;
      html += `<td class="td-gf">${tm.gf||0}</td>`;
      html += `<td class="td-gc">${tm.gc||0}</td>`;
      html += `<td class="td-dg">${dg}</td>`;
      html += `</tr>`;
    });
    html += '</tbody></table></div>';
    let legend = '<div class="flex-center gap-1" style="font-size:0.65rem;margin-top:0.4rem;">';
    if (lig > 0) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-green);border-radius:2px;"></span> Clasificación</span>`;
    if (asc > 0 && torneo.linkedTournamentId) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-yellow);border-radius:2px;"></span> Ascenso</span>`;
    if (des > 0) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-red);border-radius:2px;"></span> Descenso</span>`;
    legend += '</div>';
    return html + legend;
  }

  // ---------- MOSTRAR STATS DE PARTIDO ----------
  window.showMatchStats = function(matchId) {
    if (!data) return;
    let match = null;
    for (let round of (data.rounds || [])) {
      const found = round.find(m => m.id === matchId);
      if (found) { match = found; break; }
    }
    if (!match) {
      for (let fm of (data.friendlyMatches || [])) {
        if (fm.id === matchId) { match = fm; break; }
      }
    }
    if (!match || !match.played || !match.stats) {
      alert('Este partido no tiene estadísticas detalladas.');
      return;
    }

    const h = getTeamById(data.teams, match.h);
    const a = getTeamById(data.teams, match.a);
    const hName = h ? h.name : 'Desconocido';
    const aName = a ? a.name : 'Desconocido';
    const hShield = h ? h.shield : '';
    const aShield = a ? a.shield : '';

    const hStats = match.stats.filter(s => s.tId === match.h);
    const aStats = match.stats.filter(s => s.tId === match.a);

    function renderPlayerStats(team, statsArray) {
      if (!team || !statsArray.length) return '<div class="text-muted" style="font-size:0.7rem;">Sin estadísticas</div>';
      let html = `<div style="font-size:0.7rem;margin-top:0.2rem;"><table style="width:100%;font-size:0.7rem;border-collapse:collapse;"><thead><tr style="border-bottom:1px solid var(--color-border);"><th>Jugador</th><th>G</th><th>A</th><th>S</th><th>T</th></tr></thead><tbody>`;
      statsArray.forEach(st => {
        const p = team.players.find(x => x.id === st.pId);
        const name = p ? p.name : '?';
        html += `<tr><td>${name}</td><td>${st.g||0}</td><td>${st.a||0}</td><td>${st.s||0}</td><td>${st.t||0}</td></tr>`;
      });
      html += '</tbody></table></div>';
      return html;
    }

    const modalHtml = `
      <div class="print-modal-overlay" onclick="if(event.target===this) this.remove()">
        <div class="print-modal" style="max-width:650px;">
          <h3>📊 Estadísticas del partido</h3>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:1rem;margin-bottom:0.5rem;">
            <span class="flex-center"><img src="${hShield}" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"> ${hName}</span>

          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div><div class="card-header" style="font-size:0.7rem;">${hName}</div>${renderPlayerStats(h, hStats)}</div>
            <div><div class="card-header" style="font-size:0.7rem;">${aName}</div>${renderPlayerStats(a, aStats)}</div>
          </div>
          <div class="actions" style="margin-top:0.5rem;">
            <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cerrar</button>
            <button class="btn-download" onclick="printMatchStats('${matchId}')">Imprimir</button>
          </div>
        </div>
      </div>
    `;
    const overlay = document.createElement('div');
    overlay.innerHTML = modalHtml;
    document.body.appendChild(overlay);
  };

  window.printMatchStats = function(matchId) {
    const match = (() => {
      for (let round of (data.rounds || [])) {
        const found = round.find(m => m.id === matchId);
        if (found) return found;
      }
      for (let fm of (data.friendlyMatches || [])) {

      }
      return null;
    })();
    if (!match) return alert('Partido no encontrado.');

    const h = getTeamById(data.teams, match.h);
