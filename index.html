<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>MTM · Visualizador de Torneo</title>

  <!-- META TAGS ANTI-CACHÉ -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- POLYFILLS PARA SAFARI -->
  <script src="https://cdn.polyfill.io/v3/polyfill.min.js?features=fetch,Promise,Array.from,Element.prototype.closest"></script>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,900&family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet" />

  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <!-- HTML2CANVAS (solo si no es iOS) -->
  <script>
    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }
    if (!isIOS()) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>');
    }
  </script>

  <style>
    /* ========================================
       VARIABLES GLOBALES (tema por defecto)
       ======================================== */
    :root {
      --color-bg: #0a0a0f;
      --color-surface: #14141e;
      --color-surface-hover: #1e1e2f;
      --color-text: #e2e8f0;
      --color-text-muted: #94a3b8;
      --color-border: #2d2d44;
      --neon-purple: #a855f7;
      --neon-cyan: #22d3ee;
      --neon-pink: #ec4899;
      --neon-green: #4ade80;
      --neon-yellow: #facc15;
      --neon-red: #f87171;
      --radius: 12px;
      --font-size-base: 14px;
      --spacing-base: 0.8rem;
      --density-scale: 1;
      --logo-url: none;
    }

    /* Tema DOMINIO MX */
    [data-theme="dominio"] {
      --color-bg: #000000;
      --color-surface: #0a0a0a;
      --color-surface-hover: #1a1a1a;
      --color-text: #e8e8e8;
      --color-text-muted: #aaaaaa;
      --color-border: #2a2a2a;
      --neon-purple: #00a84d;
      --neon-cyan: #00a84d;
      --neon-pink: #d32f2f;
      --neon-green: #00a84d;
      --neon-yellow: #ffc107;
      --neon-red: #d32f2f;
    }

    /* Tema Claro */
    [data-theme="light"] {
      --color-bg: #f5f5f5;
      --color-surface: #ffffff;
      --color-surface-hover: #eeeeee;
      --color-text: #222222;
      --color-text-muted: #666666;
      --color-border: #cccccc;
      --neon-purple: #3b82f6;
      --neon-cyan: #06b6d4;
      --neon-pink: #ec4899;
      --neon-green: #22c55e;
      --neon-yellow: #eab308;
      --neon-red: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: var(--font-size-base);
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
      -webkit-text-size-adjust: 100%;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

    /* ========================================
       LAYOUT PRINCIPAL
       ======================================== */
    .app {
      display: flex;
      min-height: 100vh;
      background: var(--color-bg);
    }

    /* SIDEBAR (PC) */
    .sidebar {
      width: 220px;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease, background 0.3s;
      z-index: 100;
      -webkit-overflow-scrolling: touch;
    }

    @supports not (backdrop-filter: blur(8px)) {
      .sidebar {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: rgba(10, 10, 15, 0.97) !important;
      }
      .card, .print-modal, .settings-modal {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: rgba(20, 20, 30, 0.95) !important;
      }
    }

    [data-theme="dominio"] .sidebar { background: rgba(0, 0, 0, 0.97); }
    [data-theme="light"] .sidebar { background: rgba(255, 255, 255, 0.95); }
    [data-theme="light"] @supports not (backdrop-filter: blur(8px)) {
      .sidebar { background: #ffffff !important; }
      .card, .print-modal, .settings-modal { background: #ffffff !important; }
    }

    .sidebar-brand {
      padding: 1.2rem 1rem 0.8rem;
      border-bottom: 1px solid var(--color-border);
      text-align: center;
      transition: border-color 0.3s;
    }
    .sidebar-brand .logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 0.5rem;
      border-radius: 50%;
      background: #000;
      border: 2px solid var(--color-border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .sidebar-brand .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .sidebar-brand .logo-container .no-logo {
      color: var(--color-text-muted);
      font-size: 0.6rem;
      text-align: center;
      padding: 0.2rem;
    }

    .sidebar-brand h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.5px;
      transition: color 0.3s;
    }
    .sidebar-brand h1 .mtm { color: var(--neon-purple); }
    .sidebar-brand h1 .mtm span { color: var(--neon-purple); }
    [data-theme="dominio"] .sidebar-brand h1 .mtm .liga { color: #00a84d; }
    [data-theme="dominio"] .sidebar-brand h1 .mtm .dom { color: #ffffff; }
    [data-theme="dominio"] .sidebar-brand h1 .mtm .mx { color: #d32f2f; }
    [data-theme="light"] .sidebar-brand h1 .mtm { color: #3b82f6; }

    .sidebar-brand small {
      display: block;
      font-size: 0.6rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
      transition: color 0.3s;
    }
    [data-theme="dominio"] .sidebar-brand small .comp { color: #00a84d; }
    [data-theme="dominio"] .sidebar-brand small .domina { color: #ffffff; }
    [data-theme="dominio"] .sidebar-brand small .repite { color: #d32f2f; }

    /* MENÚ PRINCIPAL */
    .sidebar-nav {
      flex: 1;
      padding: 0.5rem 0.3rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      margin-bottom: 2px;
    }
    .nav-item:hover {
      background: var(--color-surface-hover);
      color: #fff;
    }
    .nav-item.active {
      background: var(--color-surface-hover);
      border-left-width: 5px;
      color: #fff;
    }
    [data-theme="dominio"] .nav-item:nth-child(-n+4) { border-left-color: #00a84d; }
    [data-theme="dominio"] .nav-item:nth-child(n+5):nth-child(-n+9) { border-left-color: #ffffff; }
    [data-theme="dominio"] .nav-item:nth-child(n+10) { border-left-color: #d32f2f; }
    [data-theme="dominio"] .nav-item.active {
      border-left-width: 5px;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.05);
    }
    [data-theme="dominio"] .nav-item:nth-child(-n+4).active { border-left-color: #00a84d; box-shadow: 0 0 12px #00a84d44; }
    [data-theme="dominio"] .nav-item:nth-child(n+5):nth-child(-n+9).active { border-left-color: #ffffff; box-shadow: 0 0 12px #ffffff44; }
    [data-theme="dominio"] .nav-item:nth-child(n+10).active { border-left-color: #d32f2f; box-shadow: 0 0 12px #d32f2f44; }

    .nav-item i { width: 1.2rem; text-align: center; font-size: 0.9rem; }
    .nav-divider {
      border-top: 1px solid var(--color-border);
      margin: 0.6rem 0.5rem;
      padding: 0.4rem 0 0.2rem;
    }
    .nav-divider span {
      font-size: 0.55rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 700;
      padding: 0 0.5rem;
    }

    /* Submenú (ya no se usa para mercado, pero mantenemos la estructura) */
    .nav-parent {
      margin-bottom: 2px;
    }
    .nav-parent .nav-toggle {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      width: 100%;
      background: transparent;
      border: none;
      text-align: left;
      font-family: inherit;
    }
    .nav-parent .nav-toggle:hover {
      background: var(--color-surface-hover);
      color: #fff;
    }
    .nav-parent .nav-toggle .arrow {
      margin-left: auto;
      transition: transform 0.2s;
    }
    .nav-parent.open .nav-toggle .arrow { transform: rotate(90deg); }
    .nav-parent .nav-children {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
      padding-left: 1.2rem;
    }
    .nav-parent.open .nav-children { max-height: 500px; }
    .nav-parent .nav-children .nav-item {
      border-left: 3px solid var(--color-border);
      margin-bottom: 1px;
      padding-left: 1.2rem;
    }
    .nav-parent .nav-children .nav-item.active { border-left-color: var(--neon-purple); }

    /* HAMBURGUESA */
    .hamburger {
      display: none;
      position: fixed;
      top: 0.8rem;
      left: 0.8rem;
      z-index: 200;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.5rem 0.7rem;
      color: var(--color-text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .hamburger:hover { background: var(--color-surface-hover); }

    /* SIDEBAR FOOTER */
    .sidebar-footer {
      padding: 0.8rem 0.6rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: border-color 0.3s;
    }
    .sidebar-footer .settings-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.4rem 1rem;
      color: var(--color-text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      justify-content: center;
    }
    .sidebar-footer .settings-btn:hover {
      background: var(--color-surface-hover);
      color: #fff;
      border-color: var(--neon-purple);
    }
    .sidebar-footer .settings-btn i { font-size: 0.9rem; }

    /* MAIN */
    .main {
      flex: 1;
      padding: 1.2rem 2rem 2rem;
      overflow-y: auto;
      max-height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      transition: padding 0.3s;
      -webkit-overflow-scrolling: touch;
    }

    /* DENSIDADES */
    [data-density="compact"] {
      --font-size-base: 12px;
      --spacing-base: 0.5rem;
    }
    [data-density="compact"] .main { padding: 0.6rem 1rem 1.5rem; }
    [data-density="compact"] .card { padding: 0.5rem; }
    [data-density="compact"] .section-title { font-size: 1rem; }
    [data-density="compact"] table { font-size: 0.65rem; }

    [data-density="spacious"] {
      --font-size-base: 16px;
      --spacing-base: 1.2rem;
    }
    [data-density="spacious"] .main { padding: 2rem 3rem 3rem; }
    [data-density="spacious"] .card { padding: 1.5rem; }
    [data-density="spacious"] .section-title { font-size: 1.8rem; }
    [data-density="spacious"] table { font-size: 0.9rem; }
    [data-density="spacious"] thead th { padding: 0.8rem 1rem; }
    [data-density="spacious"] tbody td { padding: 0.8rem 1rem; }

    /* SECCIONES */
    .section {
      display: none;
      animation: fadeSlide 0.3s ease;
    }
    .section.active { display: block; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.3px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      transition: color 0.3s;
    }
    .section-title span { color: var(--neon-purple); }
    .section-title .print-btn {
      margin-left: auto;
      font-size: 0.7rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.3rem 0.8rem;
      color: var(--color-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: 0.2s;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }
    .section-title .print-btn:hover {
      background: var(--neon-purple);
      color: #000;
      border-color: var(--neon-purple);
    }

    /* CARDS */
    .card {
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.8rem 1rem;
      margin-bottom: 0.8rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: border-color 0.2s, background 0.3s;
    }
    .card:hover { border-color: var(--neon-purple); }

    .card-header {
      font-weight: 700;
      color: var(--color-text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* TABLAS */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      background: rgba(0,0,0,0.2);
      -webkit-overflow-scrolling: touch;
    }
    .table-wrap::-webkit-scrollbar {
      height: 8px;
    }
    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--neon-purple);
      border-radius: 4px;
    }
    .table-wrap::after {
      content: '← Desliza →';
      display: block;
      font-size: 0.5rem;
      color: var(--color-text-muted);
      text-align: center;
      padding: 2px 0;
      opacity: 0.6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    thead {
      background: rgba(30, 30, 47, 0.6);
      border-bottom: 1px solid var(--color-border);
    }
    thead th {
      padding: 0.6rem 0.8rem;
      text-align: left;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      font-size: 0.65rem;
      white-space: nowrap;
    }

    /* Colores de encabezados según tema */
    .th-pts { color: var(--neon-cyan); }
    .th-pj { color: var(--color-text); }
    .th-pg { color: var(--neon-green); }
    .th-pe { color: var(--neon-yellow); }
    .th-pp { color: var(--neon-red); }
    .th-gf { color: var(--neon-cyan); }
    .th-gc { color: var(--neon-pink); }
    .th-dg { color: var(--neon-yellow); }

    [data-theme="dominio"] .th-pts { color: #00a84d; }
    [data-theme="dominio"] .th-pj { color: #ffffff; }
    [data-theme="dominio"] .th-pg { color: #ffffff; }
    [data-theme="dominio"] .th-pe { color: #d32f2f; }
    [data-theme="dominio"] .th-pp { color: #d32f2f; }
    [data-theme="dominio"] .th-gf { color: #00a84d; }
    [data-theme="dominio"] .th-gc { color: #d32f2f; }
    [data-theme="dominio"] .th-dg { color: #ffffff; }

    [data-theme="light"] .th-pts { color: #3b82f6; }
    [data-theme="light"] .th-pj { color: #222; }
    [data-theme="light"] .th-pg { color: #22c55e; }
    [data-theme="light"] .th-pe { color: #eab308; }
    [data-theme="light"] .th-pp { color: #ef4444; }
    [data-theme="light"] .th-gf { color: #3b82f6; }
    [data-theme="light"] .th-gc { color: #ec4899; }
    [data-theme="light"] .th-dg { color: #eab308; }

    /* Colores para celdas de datos */
    .td-pts { color: var(--neon-cyan); font-weight: 700; }
    .td-pj { color: var(--color-text); }
    .td-pg { color: var(--neon-green); font-weight: 700; }
    .td-pe { color: var(--neon-yellow); font-weight: 700; }
    .td-pp { color: var(--neon-red); font-weight: 700; }
    .td-gf { color: var(--neon-cyan); font-weight: 700; }
    .td-gc { color: var(--neon-pink); font-weight: 700; }
    .td-dg { color: var(--neon-yellow); font-weight: 700; }

    [data-theme="dominio"] .td-pts { color: #00a84d; }
    [data-theme="dominio"] .td-pj { color: #ffffff; }
    [data-theme="dominio"] .td-pg { color: #ffffff; }
    [data-theme="dominio"] .td-pe { color: #d32f2f; }
    [data-theme="dominio"] .td-pp { color: #d32f2f; }
    [data-theme="dominio"] .td-gf { color: #00a84d; }
    [data-theme="dominio"] .td-gc { color: #d32f2f; }
    [data-theme="dominio"] .td-dg { color: #ffffff; }

    [data-theme="light"] .td-pts { color: #3b82f6; }
    [data-theme="light"] .td-pj { color: #222; }
    [data-theme="light"] .td-pg { color: #22c55e; }
    [data-theme="light"] .td-pe { color: #eab308; }
    [data-theme="light"] .td-pp { color: #ef4444; }
    [data-theme="light"] .td-gf { color: #3b82f6; }
    [data-theme="light"] .td-gc { color: #ec4899; }
    [data-theme="light"] .td-dg { color: #eab308; }

    tbody tr {
      border-bottom: 1px solid rgba(45, 45, 68, 0.25);
      transition: background 0.15s;
    }
    tbody tr:hover { background: var(--color-surface-hover); }
    tbody td {
      padding: 0.5rem 0.8rem;
      vertical-align: middle;
    }

    /* POWER BADGES con flechas */
    .power-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 0.05rem 0.5rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
      margin-right: 0.2rem;
      transition: color 0.3s;
    }
    .power-badge.atk { color: var(--neon-cyan); background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.25); }
    .power-badge.def { color: var(--neon-pink); background: rgba(236,72,153,0.12); border: 1px solid rgba(236,72,153,0.25); }
    .power-badge.glb { color: var(--neon-yellow); background: rgba(250,204,21,0.12); border: 1px solid rgba(250,204,21,0.25); }
    [data-theme="dominio"] .power-badge.atk { color: #00a84d; border-color: #00a84d; background: rgba(0,168,77,0.15); }
    [data-theme="dominio"] .power-badge.def { color: #d32f2f; border-color: #d32f2f; background: rgba(211,47,47,0.15); }
    [data-theme="dominio"] .power-badge.glb { color: #ffffff; border-color: #ffffff; background: rgba(255,255,255,0.1); }

    .power-badge .arrow {
      display: inline-block;
      font-size: 0.7rem;
    }
    .power-badge .arrow.up { color: var(--neon-green); }
    .power-badge .arrow.down { color: var(--neon-red); }
    .power-badge .arrow.neutral { color: var(--color-text-muted); }

    /* Flechas en tabla de media - estilo compacto */
    .media-power-cell {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem 0.4rem;
    }

    .row-clasif { border-left: 4px solid var(--neon-green); }
    .row-descenso { border-left: 4px solid var(--neon-red); }
    .row-ascenso { border-left: 4px solid var(--neon-yellow); }

    /* JUGADORES */
    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.6rem;
      padding: 0.2rem 0;
    }
    .player-tag {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 0.15rem 0.7rem;
      font-size: 0.75rem;
      border: 1px solid var(--color-border);
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 28px;
    }
    .player-tag:hover {
      border-color: var(--neon-cyan);
      transform: scale(1.02);
      background: rgba(0,0,0,0.5);
    }
    .player-tag.captain { border-color: var(--neon-yellow); color: var(--neon-yellow); }
    .player-tag.titular { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .player-tag.suplente { border-color: var(--neon-pink); color: var(--neon-pink); }
    .player-tag.reserva { border-color: var(--color-border); color: var(--color-text-muted); }

    /* FILTROS */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      align-items: flex-end;
    }
    .filters .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 110px;
      flex: 1 0 auto;
    }
    .filters .filter-group label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
    }
    .filters select, .filters input {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.35rem 0.7rem;
      color: var(--color-text);
      font-size: 0.75rem;
      outline: none;
      min-width: 100px;
      font-size: 16px !important;
      height: 38px;
    }
    .filters select:focus, .filters input:focus { border-color: var(--neon-purple); }

    /* RESUMEN ECONÓMICO */
    .eco-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      align-items: center;
      font-size: 0.85rem;
    }
    .eco-summary .stat {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .eco-summary .stat .value { font-weight: 700; }
    .eco-summary .stat .label { color: var(--color-text-muted); font-size: 0.7rem; }
    .eco-summary .income { color: var(--neon-green); }
    .eco-summary .expense { color: var(--neon-red); }
    .eco-summary .net-positive { color: var(--neon-green); }
    .eco-summary .net-negative { color: var(--neon-red); }

    /* BADGE DE TIPO */
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      white-space: nowrap;
    }
    .type-badge.bonus { border-color: var(--neon-green); color: var(--neon-green); }
    .type-badge.fichaje { border-color: var(--neon-red); color: var(--neon-red); }
    .type-badge.venta { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .type-badge.prestamo { border-color: var(--neon-yellow); color: var(--neon-yellow); }
    .type-badge.sancion { border-color: var(--neon-red); color: var(--neon-red); }
    .type-badge.transferencia { border-color: var(--neon-purple); color: var(--neon-purple); }

    /* SHIELD */
    .shield-sm {
      width: 1.6rem;
      height: 1.6rem;
      object-fit: contain;
      background: #000;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    /* MODAL DE IMPRESIÓN */
    .print-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }
    .print-modal {
      background: var(--color-surface);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      max-width: 95vw;
      max-height: 90vh;
      width: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: background 0.3s;
      -webkit-overflow-scrolling: touch;
    }
    .print-modal h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      color: var(--neon-purple);
    }
    .print-modal .preview {
      background: var(--color-bg);
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      padding: 0.5rem;
      overflow: auto;
      max-height: 55vh;
      min-height: 200px;
    }
    .print-modal .preview img { max-width: 100%; border-radius: 4px; }
    .print-modal .actions {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .print-modal .actions button {
      padding: 0.4rem 1.2rem;
      border-radius: var(--radius);
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.8rem;
      min-height: 38px;
    }
    .print-modal .actions .btn-cancel {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text);
    }
    .print-modal .actions .btn-cancel:hover { background: var(--color-surface-hover); }
    .print-modal .actions .btn-download {
      background: var(--neon-purple);
      color: #000;
    }
    .print-modal .actions .btn-download:hover { opacity: 0.85; }
    .print-modal .form-group {
      margin-bottom: 0.6rem;
    }
    .print-modal .form-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--color-text-muted);
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .print-modal .form-group select,
    .print-modal .form-group input {
      width: 100%;
      padding: 0.4rem 0.6rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      color: var(--color-text);
      font-size: 0.8rem;
      height: 38px;
    }
    .print-modal .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .print-modal .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text);
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
    }
    .print-modal .checkbox-group input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: var(--neon-purple);
    }
    .print-modal .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
    @media (max-width: 600px) {
      .print-modal .row { grid-template-columns: 1fr; }
    }

    /* PÓDIUM - ESTILO CÍRCULOS ESCALONADOS */
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 2rem;
      padding: 1.5rem 0;
      min-height: 200px;
    }
    .podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: 0.2s;
      position: relative;
      cursor: pointer;
      min-height: 44px;
    }
    .podium-item:hover { transform: scale(1.02); }
    .podium-item .circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--color-surface);
      border: 3px solid var(--color-border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.3rem;
      transition: 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .podium-item .circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .podium-item .circle .no-img {
      color: var(--color-text-muted);
      font-size: 1.5rem;
      font-weight: 700;
    }
    .podium-item.first .circle {
      border-color: var(--neon-yellow);
      width: 100px;
      height: 100px;
      box-shadow: 0 0 30px rgba(250,204,21,0.3);
    }
    .podium-item.second .circle {
      border-color: #94a3b8;
      width: 85px;
      height: 85px;
    }
    .podium-item.third .circle {
      border-color: #b45309;
      width: 70px;
      height: 70px;
    }
    .podium-item .pos {
      font-weight: 900;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-top: 0.1rem;
    }
    .podium-item .name {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--color-text);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .podium-item .value {
      font-weight: 900;
      font-size: 0.9rem;
      color: var(--neon-yellow);
    }
    .podium-item .sub {
      font-size: 0.6rem;
      color: var(--color-text-muted);
    }
    .podium-item.first {
      transform: translateY(-20px);
    }
    .podium-item.second {
      transform: translateY(0px);
    }
    .podium-item.third {
      transform: translateY(20px);
    }

    /* MVPs */
    .mvp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
    }
    .mvp-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.6rem 1rem;
      min-width: 130px;
      flex: 1 0 auto;
      max-width: 200px;
      text-align: center;
    }
    .mvp-card .label {
      font-size: 0.55rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .mvp-card .name {
      font-weight: 700;
      font-size: 0.85rem;
    }
    .mvp-card .stat {
      font-size: 0.7rem;
      color: var(--neon-yellow);
    }

    .jornada-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.6rem;
    }
    .jornada-nav button {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      padding: 0.2rem 0.7rem;
      font-size: 0.65rem;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: 0.2s;
      min-height: 32px;
    }
    .jornada-nav button:hover {
      background: var(--color-surface-hover);
      color: #fff;
    }
    .jornada-nav button.active {
      background: var(--neon-purple);
      color: #000;
      border-color: var(--neon-purple);
    }

    /* TABLAS DE PRECIOS */
    .price-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .price-table th, .price-table td {
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--color-border);
      text-align: center;
    }
    .price-table th {
      background: rgba(30,30,47,0.6);
      color: var(--color-text-muted);
      font-weight: 700;
      font-size: 0.6rem;
      text-transform: uppercase;
    }
    .price-table td {
      background: rgba(0,0,0,0.2);
    }
    .price-table .highlight {
      background: rgba(168,85,247,0.1);
    }
    .price-table .rango-header {
      font-weight: 900;
      text-align: left;
      font-size: 0.8rem;
      color: var(--neon-purple);
    }
    [data-theme="dominio"] .price-table .rango-header { color: #00a84d; }
    [data-theme="light"] .price-table .rango-header { color: #3b82f6; }

    /* CONTENEDOR DE ERROR */
    #error-container {
      display: none;
      padding: 2rem;
      text-align: center;
      background: var(--color-surface);
      border-radius: var(--radius);
      border: 1px solid var(--neon-red);
      margin: 1rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    #error-container i { font-size: 3rem; color: var(--neon-red); }
    #error-container h3 { margin: 1rem 0 0.5rem; color: var(--color-text); }
    #error-container p { color: var(--color-text-muted); }
    #error-container .btn {
      margin-top: 1rem;
      display: inline-block;
      background: var(--neon-purple);
      color: #000;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
    }

    /* ========================================
       MODAL DE SELECCIÓN DE TORNEO
       ======================================== */
    .tournament-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 1.5rem;
    }
    .tournament-modal {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      padding: 2rem;
      max-width: 700px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      animation: modalFadeIn 0.3s ease;
    }
    .tournament-modal h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--neon-purple);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tournament-modal .sub {
      color: var(--color-text-muted);
      font-size: 0.8rem;
      margin-bottom: 1.8rem;
    }
    .tournament-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .tournament-card {
      background: rgba(0,0,0,0.3);
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1.5rem 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .tournament-card:hover {
      border-color: var(--neon-purple);
      background: var(--color-surface-hover);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .tournament-card img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #000;
      border: 2px solid var(--color-border);
      object-fit: contain;
    }
    .tournament-card h3 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--color-text);
    }
    .tournament-card .badge {
      font-size: 0.6rem;
      font-weight: 900;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tournament-card .badge.first {
      background: var(--neon-yellow);
      color: #000;
      box-shadow: 0 0 15px rgba(250,204,21,0.3);
    }
    .tournament-card .badge.second {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px rgba(34,211,238,0.3);
    }
    .tournament-card .info {
      font-size: 0.65rem;
      color: var(--color-text-muted);
    }
    @media (max-width: 600px) {
      .tournament-cards { grid-template-columns: 1fr; }
      .tournament-modal { padding: 1.5rem; }
    }

    /* ========================================
       BÚSQUEDA AVANZADA (modal)
       ======================================== */
    .adv-search-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 1rem;
    }
    .adv-search-overlay.active { display: flex; }
    .adv-search-modal {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      animation: modalFadeIn 0.25s ease;
    }
    .adv-search-modal h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--neon-purple);
      margin-bottom: 1rem;
      text-align: center;
      text-transform: uppercase;
    }
    .adv-search-modal .form-group {
      margin-bottom: 0.8rem;
    }
    .adv-search-modal .form-group label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
    }
    .adv-search-modal .form-group select,
    .adv-search-modal .form-group input {
      width: 100%;
      padding: 0.4rem 0.6rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      color: var(--color-text);
      font-size: 0.8rem;
      height: 38px;
    }
    .adv-search-modal .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
    .adv-search-modal .actions {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      margin-top: 1rem;
      border-top: 1px solid var(--color-border);
      padding-top: 1rem;
    }
    .adv-search-modal .actions button {
      padding: 0.4rem 1.2rem;
      border-radius: var(--radius);
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.8rem;
      min-height: 38px;
    }
    .adv-search-modal .actions .btn-apply {
      background: var(--neon-purple);
      color: #000;
    }
    .adv-search-modal .actions .btn-apply:hover { opacity: 0.85; }
    .adv-search-modal .actions .btn-clear {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text);
    }
    .adv-search-modal .actions .btn-clear:hover { background: var(--color-surface-hover); }
    .adv-search-modal .actions .btn-cancel {
      background: transparent;
      border: none;
      color: var(--color-text-muted);
    }
    .adv-search-modal .actions .btn-cancel:hover { color: #fff; }

    /* ========================================
       TARJETA DE JUGADOR (PLAYER CARD)
       ======================================== */
    .player-card-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .player-card-modal.active { display: flex; }

    .player-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      max-height: 95vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      animation: modalFadeIn 0.3s ease;
    }
    .player-card .card-header {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .player-card .player-name {
      font-size: 1.3rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 2px;
      word-break: break-word;
    }
    .player-card .player-meta {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.6rem;
    }
    .player-card .player-meta .badge-role {
      font-weight: 700;
      color: var(--neon-cyan);
    }
    .player-card .player-visibility {
      font-size: 0.7rem;
      color: var(--neon-yellow);
      margin-top: 4px;
    }
    .player-card .player-rankings {
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .player-card .player-rankings .bdor-rank {
      color: var(--neon-yellow);
    }
    .player-card .player-rankings .market-rank {
      color: var(--neon-cyan);
    }

    .player-card .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 16px 0;
      background: rgba(0,0,0,0.25);
      border-radius: var(--radius);
      padding: 10px;
    }
    .player-card .stat-item {
      text-align: center;
    }
    .player-card .stat-item .stat-value {
      display: block;
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
    }

    /* RESPONSIVE */

<script>
  // ==========================================
  // DETECCIÓN DE iOS / SAFARI
  // ==========================================
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isSafari() {
    return /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  }

  // ==========================================
  // VARIABLES GLOBALES
  // ==========================================
  let data1 = null;
  let data2 = null;
  let currentData = null;
  let currentDivision = 1;
  let customThemes = [];
  let currentTheme = 'dominio';
  let currentDensity = 'normal';
  let advFilters = { rankMin: '', rankMax: '', division: '', priceMin: 0, priceMax: Infinity };

  // MENU ITEMS - SIN SUBMENÚ DE AGENTES LIBRES
  const MENU_ITEMS = [
    { id: 'tabla', label: 'Tabla General', icon: 'fa-table' },
    { id: 'media', label: 'Tabla de Media', icon: 'fa-chart-simple' },
    { id: 'jornadas', label: 'Jornadas', icon: 'fa-calendar-day' },
    { id: 'playoffs', label: 'PlayOffs', icon: 'fa-sitemap' },
    { id: 'stats', label: 'Stats', icon: 'fa-chart-bar' },
    { id: 'balon', label: 'Balón de Oro', icon: 'fa-trophy' },
    { id: 'equipos', label: 'Equipos', icon: 'fa-users' },
    { id: 'mercado', label: 'Mercado', icon: 'fa-store' },
    { id: 'economia', label: 'Mov. Económicos', icon: 'fa-coins' },
    { id: 'sanciones', label: 'Sanciones', icon: 'fa-gavel' },
    { id: 'seleccion', label: 'Selección Nacional', icon: 'fa-flag' },
    { id: 'amistosos', label: 'Partidos Amistosos', icon: 'fa-handshake' },
    { id: 'salon', label: 'Salón de la Fama', icon: 'fa-medal' }
  ];

  let statsLimits = { goals: 10, assists: 10, saves: 10, shots: 10 };
  const MAX_STATS_LIMIT = 50;
  let currentMvpJornada = 0;
  let currentEcoFilters = { round: 'todas', type: 'todos', sort: 'reciente' };

  const sidebar = document.getElementById('sidebar');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mainNav = document.getElementById('mainNav');
  const sectionsContainer = document.getElementById('sectionsContainer');
  const errorContainer = document.getElementById('error-container');
  const errorMessage = document.getElementById('error-message');

  // ==========================================
  // UTILIDADES MEJORADAS
  // ==========================================
  function sanitize(str) {
    if (!str) return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;', '/': '&#x2F;' };
    return String(str).replace(/[&<>"'/]/g, (m) => map[m] || m);
  }

  function formatCurrency(amount) {
    if (amount >= 1e6) return '$' + (amount / 1e6).toFixed(1) + 'M';
    if (amount >= 1e3) return '$' + (amount / 1e3).toFixed(0) + 'K';
    return '$' + amount.toFixed(0);
  }

  function getRankColor(rank) {
    const colors = {
      'Bronce': '#cd7f32', 'Plata': '#c0c0c0', 'Oro': '#ffd700',
      'Platino': '#e5e4e2', 'Diamante': '#b9f2ff', 'Campeón': '#ff6b6b',
      'Gran Campeón': '#ff4757', 'SSL': '#ff4757'
    };
    return colors[rank] || '#fff';
  }

  function getRankDisplay(player) {
    if (!player) return 'Sin rango';
    if (player.rocketRank === 'SSL') return 'SSL';
    return `${player.rocketRank} ${player.division || 2}`;
  }

  function getTeamById(teams, id) {
    if (!teams || !id) return null;
    return teams.find(t => t.id === id) || null;
  }

  function formatDate(timestamp) {
    if (!timestamp) return '--/--/--';
    try {
      const d = new Date(timestamp);
      if (isNaN(d.getTime())) return '--/--/--';
      return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
    } catch (_) {
      return '--/--/--';
    }
  }

  function getTipoInfo(type) {
    const map = {
      'bonus': { label: 'Bonos', icon: '🏆', cls: 'bonus' },
      'transfer_in': { label: 'Fichajes', icon: '📥', cls: 'fichaje' },
      'transfer_out': { label: 'Ventas', icon: '📤', cls: 'venta' },
      'loan': { label: 'Préstamos', icon: '📋', cls: 'prestamo' },
      'penalty': { label: 'Sanciones', icon: '⚠️', cls: 'sancion' },
      'release': { label: 'Liberación', icon: '📄', cls: 'transferencia' },
      'return': { label: 'Retorno', icon: '↩️', cls: 'transferencia' }
    };
    return map[type] || { label: 'Otro', icon: '🔄', cls: 'transferencia' };
  }

  function getPlayerCategory(pig) {
    if (pig > 200) return { label: 'Leyenda', emoji: '⭐', multiplier: 3.0 };
    if (pig > 150) return { label: 'Elite', emoji: '🏆', multiplier: 2.5 };
    if (pig > 100) return { label: 'Superestrella', emoji: '💎', multiplier: 2.0 };
    if (pig > 75) return { label: 'Estrella', emoji: '🌟', multiplier: 1.6 };
    if (pig > 50) return { label: 'Promesa', emoji: '⚡', multiplier: 1.3 };
    if (pig > 30) return { label: 'Consolidado', emoji: '🔄', multiplier: 1.0 };
    if (pig > 15) return { label: 'Rotación', emoji: '📋', multiplier: 0.7 };
    if (pig > 5) return { label: 'Fondo', emoji: '🪑', multiplier: 0.5 };
    return { label: 'Novato', emoji: '🆕', multiplier: 0.3 };
  }

  function getPlayerVisibility(player, team) {
    if (!team) return '☆☆☆☆☆';
    const pig = player.seasonStats?.pig || 0;
    const cat = getPlayerCategory(pig);
    const catFactor = cat.multiplier;
    const rankFactor = getRankMultiplierWithDivision(player.rocketRank, player.division || 2);
    const roleMap = { 'Capitán 🎖️': 2.0, 'Titular 🌟': 1.5, 'Suplente 🔄': 0.9, 'Reserva 💤': 0.5 };
    const roleFactor = roleMap[player.role] || 0.5;
    const glb = team.glb || 50;
    let teamFactor = 0.5;
    if (glb >= 450) teamFactor = 2.0;
    else if (glb >= 350) teamFactor = 1.7;
    else if (glb >= 250) teamFactor = 1.4;
    else if (glb >= 150) teamFactor = 1.1;
    else if (glb >= 100) teamFactor = 0.9;
    else if (glb >= 70) teamFactor = 0.7;
    let raw = catFactor * rankFactor * roleFactor * teamFactor;
    const scaled = Math.pow(raw, 0.6);
    let stars = Math.min(5, Math.max(1, Math.ceil(scaled)));
    if (player.role === 'Capitán 🎖️' && glb >= 250) stars = Math.max(stars, 4);
    if (player.role === 'Capitán 🎖️' && glb >= 400) stars = 5;
    return '★'.repeat(stars) + '☆'.repeat(5 - stars);
  }

  function getRankMultiplierWithDivision(rank, division) {
    const base = { 'Bronce':0.5, 'Plata':0.7, 'Oro':1.0, 'Platino':1.3, 'Diamante':1.7, 'Campeón':2.2, 'Gran Campeón':2.8, 'SSL':3.5 }[rank] || 1.0;
    if (rank === 'SSL') return 3.5;
    const bonus = {1:0, 2:0.12, 3:0.25}[division] || 0;
    return base * (1 + bonus);
  }

  // ==========================================
  // RANKINGS (estadísticas, mercado, bdor)
  // ==========================================
  function getGlobalPlayerStats(tournament) {
    const players = [];
    if (!tournament || !tournament.teams) return players;
    tournament.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || {};
          players.push({
            id: p.id,
            name: p.name,
            teamId: team.id,
            teamName: team.name,
            teamShield: team.shield,
            g: s.goals || 0,
            a: s.assists || 0,
            s: s.saves || 0,
            t: s.shots || 0,
            imp: s.pig || 0,
            marketValue: p.marketValue || 0,
            rocketRank: p.rocketRank || 'Platino',
            division: p.division || 2,
            isCaptain: p.isCaptain || false,
            role: p.role || 'Reserva 💤',
            peligro: p.peligro || 0,
            status: p.status || 'owned',
            originalPlayer: p
          });
        }
      });
    });
    if (tournament.freeAgents) {
      tournament.freeAgents.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || {};
          players.push({
            id: p.id,
            name: p.name,
            teamId: null,
            teamName: 'Agente Libre',
            teamShield: '',
            g: s.goals || 0,
            a: s.assists || 0,
            s: s.saves || 0,
            t: s.shots || 0,
            imp: s.pig || 0,
            marketValue: p.marketValue || 0,
            rocketRank: p.rocketRank || 'Platino',
            division: p.division || 2,
            isCaptain: p.isCaptain || false,
            role: p.role || 'Reserva 💤',
            peligro: p.peligro || 0,
            status: 'free_agent',
            originalPlayer: p
          });
        }
      });
    }
    return players;
  }

  function getPlayerStatRank(playerId, statKey, tournament) {
    const all = getGlobalPlayerStats(tournament);
    const sorted = all.sort((a, b) => (b[statKey] || 0) - (a[statKey] || 0));
    const idx = sorted.findIndex(p => p.id === playerId);
    return idx >= 0 ? idx + 1 : null;
  }

  function getPlayerMarketRank(playerId, tournament) {
    const all = getGlobalPlayerStats(tournament);
    const sorted = all.sort((a, b) => (b.marketValue || 0) - (a.marketValue || 0));
    const idx = sorted.findIndex(p => p.id === playerId);
    return idx >= 0 ? idx + 1 : null;
  }

  function getPlayerBdorRank(playerId, tournament) {
    const all = getGlobalPlayerStats(tournament);
    const sorted = all.sort((a, b) => (b.imp || 0) - (a.imp || 0));
    const idx = sorted.findIndex(p => p.id === playerId);
    return idx >= 0 ? idx + 1 : null;
  }

  // ==========================================
  // POWER TRENDS (FLECHAS)
  // ==========================================
  function getPowerTrend(team, stat) {
    if (!team) return 'neutral';
    if (stat === 'atk' && team.formAtk !== undefined && team.formAtk !== null) {
      if (team.formAtk > 0.5) return 'up';
      if (team.formAtk < -0.5) return 'down';
      return 'neutral';
    }
    if (stat === 'def' && team.formDef !== undefined && team.formDef !== null) {
      if (team.formDef > 0.5) return 'up';
      if (team.formDef < -0.5) return 'down';
      return 'neutral';
    }
    if (stat === 'glb') {
      const atkTrend = getPowerTrend(team, 'atk');
      const defTrend = getPowerTrend(team, 'def');
      if (atkTrend === 'up' && defTrend === 'up') return 'up';
      if (atkTrend === 'down' && defTrend === 'down') return 'down';
      return 'neutral';
    }
    return 'neutral';
  }

  function renderPowerWithTrend(team) {
    if (!team) return '';
    const atkTrend = getPowerTrend(team, 'atk');
    const defTrend = getPowerTrend(team, 'def');
    const glbTrend = getPowerTrend(team, 'glb');

    const atkArrow = atkTrend === 'up' ? ' ▲' : (atkTrend === 'down' ? ' ▼' : '');
    const defArrow = defTrend === 'up' ? ' ▲' : (defTrend === 'down' ? ' ▼' : '');
    const glbArrow = glbTrend === 'up' ? ' ▲' : (glbTrend === 'down' ? ' ▼' : '');

    const atkColor = atkTrend === 'up' ? 'var(--neon-green)' : (atkTrend === 'down' ? 'var(--neon-red)' : 'var(--color-text-muted)');
    const defColor = defTrend === 'up' ? 'var(--neon-green)' : (defTrend === 'down' ? 'var(--neon-red)' : 'var(--color-text-muted)');
    const glbColor = glbTrend === 'up' ? 'var(--neon-green)' : (glbTrend === 'down' ? 'var(--neon-red)' : 'var(--color-text-muted)');

    return `
      <span class="power-badge atk" style="color:${atkColor};">ATK ${team.atk || 0}<span class="arrow ${atkTrend}">${atkArrow}</span></span>
      <span class="power-badge def" style="color:${defColor};">DEF ${team.def || 0}<span class="arrow ${defTrend}">${defArrow}</span></span>
      <span class="power-badge glb" style="color:${glbColor};">GLB ${team.glb || 0}<span class="arrow ${glbTrend}">${glbArrow}</span></span>
    `;
  }

  // TARJETA DE JUGADOR
  // ==========================================
  function showPlayerCard(playerId) {
    if (!currentData) return;
    const tournament = currentData;
    let player = null;
    let team = null;

    for (let t of tournament.teams) {
      const found = t.players.find(p => p.id === playerId);
      if (found) {
        player = found;
        team = t;
        break;
      }
    }
    if (!player && tournament.freeAgents) {
      const found = tournament.freeAgents.find(p => p.id === playerId);
      if (found) {
        player = found;
        team = null;
      }
    }
    if (!player) return;

    const stats = player.seasonStats || {};
    const career = player.careerStats || {};
    const rankDisplay = getRankDisplay(player);
    const category = getPlayerCategory(stats.pig || 0);
    const visibility = getPlayerVisibility(player, team);
    const bdorRank = getPlayerBdorRank(playerId, tournament);
    const marketRank = getPlayerMarketRank(playerId, tournament);
    const goalsRank = getPlayerStatRank(playerId, 'g', tournament);
    const assistsRank = getPlayerStatRank(playerId, 'a', tournament);
    const savesRank = getPlayerStatRank(playerId, 's', tournament);

    const isLoaned = player.status === 'loaned';
    const isFree = player.status === 'free_agent';
    const statusLabel = isLoaned ? '📤 Prestado' : isFree ? '🆓 Agente Libre' : '📋 Propio';
    const teamName = team ? team.name : 'Agente Libre';
    const teamShield = team ? team.shield : '';

    let historyHtml = '';
    if (player.transferHistory && player.transferHistory.length > 0) {
      const history = player.transferHistory.slice().reverse();
      historyHtml = `
        <h4>📜 Historial de Movimientos</h4>
        ${history.map(h => {
          const fromName = getTeamById(tournament.teams, h.fromTeamId)?.name || h.fromTeamId || 'Agente Libre';
          const toName = getTeamById(tournament.teams, h.toTeamId)?.name || h.toTeamId || 'Agente Libre';
          return `
            <div class="history-item">
              <span class="history-type">${h.type === 'transfer' ? '🔄 Traspaso' : h.type === 'loan' ? '📤 Préstamo' : h.type === 'return' ? '📥 Retorno' : '💰 Venta'}</span>
              <span class="history-detail">${sanitize(fromName)} → ${sanitize(toName)}</span>
              ${h.fee ? `<span class="history-fee">${formatCurrency(h.fee)}</span>` : ''}
              <span class="history-round">J${h.round || '?'}</span>
            </div>
          `;
        }).join('')}
      `;
    }

    const html = `
      <div class="player-card">
        <div class="card-header">
          <div class="player-name">${sanitize(player.name)} ${player.isCaptain ? '👑' : ''}</div>
          <div class="player-meta">
            <span>${sanitize(teamName)}</span>
            <span>•</span>
            <span style="color:${getRankColor(player.rocketRank)};font-weight:700;">${rankDisplay}</span>
            <span>•</span>
            <span>${category.emoji} ${category.label}</span>
            <span>•</span>
            <span class="badge-role">${player.role || 'Sin rol'}</span>
          </div>
          <div class="player-visibility">${visibility} Visibilidad</div>
          <div class="player-rankings">
            ${bdorRank ? `<span class="bdor-rank">🏅 Ranking BdO: #${bdorRank}</span>` : ''}
            ${marketRank ? `<span class="market-rank">📊 Ranking en mercado: #${marketRank}</span>` : ''}
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value">⚽ ${stats.goals || 0}</span>
            <span class="stat-label">Goles</span>
            ${goalsRank ? `<span class="stat-rank">#${goalsRank}</span>` : ''}
          </div>
          <div class="stat-item">
            <span class="stat-value">🎯 ${stats.assists || 0}</span>
            <span class="stat-label">Asistencias</span>
            ${assistsRank ? `<span class="stat-rank">#${assistsRank}</span>` : ''}
          </div>
          <div class="stat-item">
            <span class="stat-value">🧤 ${stats.saves || 0}</span>
            <span class="stat-label">Salvadas</span>
            ${savesRank ? `<span class="stat-rank">#${savesRank}</span>` : ''}
          </div>
          <div class="stat-item">
            <span class="stat-value">📊 ${(stats.pig || 0).toFixed(1)}</span>
            <span class="stat-label">PIG</span>
          </div>
        </div>

        <h4>📊 Estadísticas de Carrera</h4>
        <div class="career-grid">
          <span>Goles: <strong>${career.totalGoals || 0}</strong></span>
          <span>Asistencias: <strong>${career.totalAssists || 0}</strong></span>
          <span>Salvadas: <strong>${career.totalSaves || 0}</strong></span>
          <span>PIG total: <strong>${(career.totalPIG || 0).toFixed(1)}</strong></span>

  // ==========================================
  // CARGA DE DATOS

  async function loadAllData() {
    try {
      const resp1 = await fetch('datos.json?t=' + Date.now());
      if (!resp1.ok) throw new Error('No se pudo cargar datos.json (1ª División)');
      data1 = await resp1.json();
      if (data1.tournaments && Array.isArray(data1.tournaments) && data1.tournaments.length) {
        data1 = data1.tournaments[0];
      }
    } catch (e) {
      errorContainer.style.display = 'block';
      errorMessage.textContent = 'Error al cargar datos.json: ' + e.message;
      return;
    }

    try {
      const resp2 = await fetch('datos2.json?t=' + Date.now());
      if (resp2.ok) {
        data2 = await resp2.json();
        if (data2.tournaments && Array.isArray(data2.tournaments) && data2.tournaments.length) {
          data2 = data2.tournaments[0];
        }
      } else {
        data2 = null;
      }
    } catch (_) {
      data2 = null;
    }

    if (data1 && data2) {
      showTournamentSelector();
    } else if (data1) {
      selectTournament(1);
    } else {
      errorContainer.style.display = 'block';
      errorMessage.textContent = 'No se encontraron datos válidos.';
    }
  }

  function showTournamentSelector() {
    const selector = document.getElementById('tournament-selector');
    selector.style.display = 'flex';
    document.getElementById('selector-name1').textContent = data1.name || '1ª División';
    document.getElementById('selector-name2').textContent = data2.name || '2ª División';
    document.getElementById('selector-info1').textContent = `${data1.teams?.length || 0} equipos`;
    document.getElementById('selector-info2').textContent = `${data2.teams?.length || 0} equipos`;
    const logo1 = document.getElementById('selector-logo1');
    const logo2 = document.getElementById('selector-logo2');
    logo1.src = data1.logo || '';
    logo2.src = data2.logo || '';
    logo1.onerror = function() { this.style.display = 'none'; };

  }

    const selector = document.getElementById('tournament-selector');
    selector.style.display = 'none';

    if (division === 1) {

  function loadLogo(primary, secondary) {
    const img = document.getElementById('logoImage');
    const noLogo = document.getElementById('noLogoText');
    const names = [primary, secondary];
    for (let name of names) {
      if (!name) continue;
      const testImg = new Image();
      testImg.onload = function() {
        img.src = name;
        img.style.display = 'block';
        noLogo.style.display = 'none';
      };
      testImg.onerror = function() {
        img.style.display = 'none';
        noLogo.style.display = 'block';
      };
      testImg.src = name;
      break;
    }
  }

  // ==========================================
  // TEMAS Y DENSIDAD
  // ==========================================
  function loadCustomThemes() {
    try {
      const saved = localStorage.getItem('mtm_custom_themes');
      if (saved) customThemes = JSON.parse(saved);
    } catch (_) { customThemes = []; }
  }

  function saveCustomThemes() {
    try { localStorage.setItem('mtm_custom_themes', JSON.stringify(customThemes)); } catch (_) {}
  }

  function applyTheme(theme) {
    currentTheme = theme;
    let themeConfig = null;
    if (theme.startsWith('custom_')) {
      const id = theme.replace('custom_', '');
      themeConfig = customThemes.find(t => t.id === id);
      if (!themeConfig) { applyTheme('dominio'); return; }
    }

    try {
      if (theme === 'dominio') {
        document.documentElement.setAttribute('data-theme', 'dominio');
        document.getElementById('brandTitle').innerHTML = '<span class="liga">LIGA</span> <span class="dom">DOMINIO</span> <span class="mx">MX</span>';
        document.getElementById('brandSub').innerHTML = '<span class="comp">COMPITE</span>, <span class="domina">DOMINA</span> <span class="repite">Y REPITE</span>';
        loadLogo('logo.png', 'logo.jpg');
      } else if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('brandTitle').innerHTML = 'MTM <span>NEXUS</span>';
        document.getElementById('brandSub').textContent = 'Modo Claro';
        loadLogo('logo.png', 'logo.jpg');
      } else if (theme.startsWith('custom_') && themeConfig) {
        document.documentElement.removeAttribute('data-theme');
        const root = document.documentElement.style;
        root.setProperty('--color-bg', themeConfig.colors.bg || '#0a0a0f');
        root.setProperty('--color-surface', themeConfig.colors.surface || '#14141e');
        root.setProperty('--color-surface-hover', themeConfig.colors.surfaceHover || '#1e1e2f');
        root.setProperty('--color-text', themeConfig.colors.text || '#e2e8f0');
        root.setProperty('--color-text-muted', themeConfig.colors.textMuted || '#94a3b8');
        root.setProperty('--color-border', themeConfig.colors.border || '#2d2d44');
        root.setProperty('--neon-purple', themeConfig.colors.purple || '#a855f7');
        root.setProperty('--neon-cyan', themeConfig.colors.cyan || '#22d3ee');
        root.setProperty('--neon-pink', themeConfig.colors.pink || '#ec4899');
        root.setProperty('--neon-green', themeConfig.colors.green || '#4ade80');
        root.setProperty('--neon-yellow', themeConfig.colors.yellow || '#facc15');
        root.setProperty('--neon-red', themeConfig.colors.red || '#f87171');
        document.getElementById('brandTitle').innerHTML = themeConfig.name || 'Tema personalizado';
        document.getElementById('brandSub').textContent = themeConfig.subtitle || 'Personalizado';
        loadLogo('logo.png', 'logo.jpg');
      } else {
        applyTheme('dominio');
        return;
      }
      localStorage.setItem('mtm_theme', theme);
    } catch (_) {}
  }

  function applyDensity(density) {
    currentDensity = density;
    document.documentElement.setAttribute('data-density', density);
    try { localStorage.setItem('mtm_density', density); } catch (_) {}
  }

  function loadPreferences() {
    loadCustomThemes();
    try {
      const savedTheme = localStorage.getItem('mtm_theme');
      if (savedTheme) {
        if (savedTheme.startsWith('custom_')) {
          const id = savedTheme.replace('custom_', '');
          if (customThemes.some(t => t.id === id)) {
            applyTheme(savedTheme);
          } else {
            applyTheme('dominio');
          }
        } else {
          applyTheme(savedTheme);
        }
      } else {
        applyTheme('dominio');
      }
      const savedDensity = localStorage.getItem('mtm_density');
      if (savedDensity) applyDensity(savedDensity);
      else applyDensity('normal');
    } catch (_) {
      applyTheme('dominio');
      applyDensity('normal');
    }
  }

  function showPrintModal(htmlContent, filename, width = 800) {
    if (isIOS() || isSafari()) { showPrintModalIOS(htmlContent, filename); return; }
    if (typeof html2canvas === 'undefined') { showPrintModalIOS(htmlContent, filename); return; }

    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'fixed';
    tempDiv.style.left = '-9999px';
    tempDiv.style.top = '0';
    tempDiv.style.width = width + 'px';
    tempDiv.style.background = '#0a0a0f';
    tempDiv.style.padding = '1rem';
    tempDiv.style.color = '#e2e8f0';
    tempDiv.style.fontFamily = 'Inter, system-ui, sans-serif';
    tempDiv.style.borderRadius = '8px';
    tempDiv.innerHTML = htmlContent;
    document.body.appendChild(tempDiv);

    html2canvas(tempDiv, {
      scale: 2,
      backgroundColor: '#0a0a0f',
      useCORS: true,
      logging: false,
      windowHeight: tempDiv.scrollHeight,
      windowWidth: tempDiv.scrollWidth
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      tempDiv.remove();
      const overlay = document.createElement('div');
      overlay.className = 'print-modal-overlay';
      overlay.innerHTML = `
        <div class="print-modal">
          <h3><i class="fas fa-print"></i> Vista previa</h3>
          <div class="preview"><img src="${imgData}" style="max-width:100%;border-radius:4px;" /></div>
          <div class="actions">
            <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cancelar</button>
            <button class="btn-download" onclick="downloadImage('${imgData}', '${filename}'); this.closest('.print-modal-overlay').remove();">Descargar</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }).catch(err => {
      tempDiv.remove();
      showPrintModalIOS(htmlContent, filename);
    });
  }

  function downloadImage(dataUrl, filename) {
    const link = document.createElement('a');
    link.download = filename;
    link.href = dataUrl;
    link.click();
  }

  // ---------- TABLA GENERAL ----------
  function renderTabla(torneo) {
    if (!torneo) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay datos.</div>';
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay equipos.</div>';
    const teams = [...torneo.teams];
    teams.sort((a,b) => b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf);
    const lig = torneo.tableConfig?.liguilla ?? 8;
    const des = torneo.tableConfig?.descenso ?? 2;
    const asc = torneo.tableConfig?.ascenso ?? 2;

    let html = `<div class="table-wrap" id="tabla-general-container"><table><thead><tr>`;
    html += `<th class="th-pts">#</th><th>Equipo</th><th class="th-pts">Pts</th><th class="th-pj">PJ</th><th class="th-pg">PG</th><th class="th-pe">PE</th><th class="th-pp">PP</th><th class="th-gf">GF</th><th class="th-gc">GC</th><th class="th-dg">DG</th>`;
    html += `</tr></thead><tbody>`;
    teams.forEach((tm, i) => {
      let rowClass = '';
      if (i < asc && torneo.linkedTournamentId) rowClass = 'row-ascenso';
      else if (i < lig) rowClass = 'row-clasif';
      else if (i >= teams.length - des && des > 0) rowClass = 'row-descenso';
      const dg = (tm.gf||0) - (tm.gc||0);
      html += `<tr class="${rowClass}">`;
      html += `<td>${i+1}</td>`;
      html += `<td class="flex-center"><img src="${tm.shield||''}" class="shield-sm" alt=""> ${sanitize(tm.name)}</td>`;
      html += `<td class="td-pts"><strong>${tm.pts||0}</strong></td>`;
      html += `<td class="td-pj">${tm.pj||0}</td>`;
      html += `<td class="td-pg">${tm.pg||0}</td>`;
      html += `<td class="td-pe">${tm.pe||0}</td>`;
      html += `<td class="td-pp">${tm.pp||0}</td>`;
      html += `<td class="td-gf">${tm.gf||0}</td>`;
      html += `<td class="td-gc">${tm.gc||0}</td>`;
      html += `<td class="td-dg">${dg}</td>`;
      html += `</tr>`;
    });
    html += '</tbody></table></div>';
    let legend = '<div class="flex-center gap-1" style="font-size:0.65rem;margin-top:0.4rem;">';
    if (lig > 0) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-green);border-radius:2px;"></span> Clasificación</span>`;
    if (asc > 0 && torneo.linkedTournamentId) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-yellow);border-radius:2px;"></span> Ascenso</span>`;

  }

  // ---------- JORNADAS ----------
  function renderJornadas(torneo) {
    if (!torneo) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay datos.</div>';
    if (!torneo.rounds || !torneo.rounds.length) return '<div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i>No hay jornadas generadas.</div>';
    let html = '';
    torneo.rounds.forEach((round, idx) => {
      html += `<div class="card"><div class="card-header">Jornada ${idx+1}</div>`;

        html += '<div class="text-muted" style="font-size:0.8rem;">Sin partidos</div>';

        html += `<div class="table-wrap"><table><thead><tr><th>Local</th><th>Resultado</th><th>Visitante</th></tr></thead><tbody>`;
        round.forEach(m => {
          const h = getTeamById(torneo.teams, m.h);
          const a = getTeamById(torneo.teams, m.a);
          const hName = h ? sanitize(h.name) : '???';
          const aName = a ? sanitize(a.name) : '???';
          const hShield = h ? h.shield : '';
          const aShield = a ? a.shield : '';
          const played = m.played || false;

      }
      html += '</div>';
    });
    return html;
  }

  window.showMatchStats = function(matchId) {
    if (!currentData) return;
    let match = null;
    for (let round of (currentData.rounds || [])) {
      const found = round.find(m => m.id === matchId);
      if (found) { match = found; break; }
    }
    if (!match) {
      for (let fm of (currentData.friendlyMatches || [])) {
        if (fm.id === matchId) { match = fm; break; }
      }
    }
    if (!match || !match.played || !match.stats) {
      alert('Este partido no tiene estadísticas detalladas.');
      return;
    }

    const h = getTeamById(currentData.teams, match.h);
    const a = getTeamById(currentData.teams, match.a);
    const hName = h ? sanitize(h.name) : 'Desconocido';
    const aName = a ? sanitize(a.name) : 'Desconocido';
    const hShield = h ? h.shield : '';
    const aShield = a ? a.shield : '';

    const hStats = match.stats.filter(s => s.tId === match.h);
    const aStats = match.stats.filter(s => s.tId === match.a);

    function renderPlayerStats(team, statsArray) {
      if (!team || !statsArray.length) return '<div class="text-muted" style="font-size:0.7rem;">Sin estadísticas</div>';
      let html = `<div style="font-size:0.7rem;margin-top:0.2rem;"><table style="width:100%;font-size:0.7rem;border-collapse:collapse;"><thead><tr style="border-bottom:1px solid var(--color-border);"><th>Jugador</th><th>G</th><th>A</th><th>S</th><th>T</th></tr></thead><tbody>`;
      statsArray.forEach(st => {
        const p = team.players.find(x => x.id === st.pId);
        const name = p ? sanitize(p.name) : '?';
        html += `<tr><td>${name}</td><td>${st.g||0}</td><td>${st.a||0}</td><td>${st.s||0}</td><td>${st.t||0}</td></tr>`;
      });
      html += '</tbody></table></div>';
      return html;
    }

    const modalHtml = `
      <div class="print-modal-overlay" onclick="if(event.target===this) this.remove()">
        <div class="print-modal" style="max-width:650px;">
          <h3>📊 Estadísticas del partido</h3>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:1rem;margin-bottom:0.5rem;">
            <span class="flex-center"><img src="${hShield}" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"> ${hName}</span>
            <span style="font-weight:900;font-size:1.3rem;">${match.sH} - ${match.sA}</span>
            <span class="flex-center">${aName} <img src="${aShield}" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"></span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div><div class="card-header" style="font-size:0.7rem;">${hName}</div>${renderPlayerStats(h, hStats)}</div>
            <div><div class="card-header" style="font-size:0.7rem;">${aName}</div>${renderPlayerStats(a, aStats)}</div>
          </div>
          <div class="actions" style="margin-top:0.5rem;">
            <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cerrar</button>
            <button class="btn-download" onclick="printMatchStats('${matchId}')">Imprimir</button>
          </div>
        </div>
      </div>
    `;
    const overlay = document.createElement('div');
    overlay.innerHTML = modalHtml;
    document.body.appendChild(overlay);
  };

  window.printMatchStats = function(matchId) {
    const match = (() => {
      for (let round of (currentData.rounds || [])) {
        const found = round.find(m => m.id === matchId);
        if (found) return found;
      }
      for (let fm of (currentData.friendlyMatches || [])) {
        if (fm.id === matchId) return fm;
      }
      return null;
    })();
    if (!match) return alert('Partido no encontrado.');

    const h = getTeamById(currentData.teams, match.h);
    const a = getTeamById(currentData.teams, match.a);
    const hName = h ? sanitize(h.name) : 'Desconocido';
    const aName = a ? sanitize(a.name) : 'Desconocido';
    const hShield = h ? h.shield : '';
    const aShield = a ? a.shield : '';

    function renderStats(team, statsArray) {
      if (!team || !statsArray.length) return '<div class="text-muted">Sin estadísticas</div>';
      let html = '<table style="width:100%;font-size:0.7rem;border-collapse:collapse;margin-top:0.2rem;"><thead><tr style="border-bottom:1px solid #2d2d44;"><th>Jugador</th><th>G</th><th>A</th><th>S</th><th>T</th></tr></thead><tbody>';
      statsArray.forEach(st => {
        const p = team.players.find(x => x.id === st.pId);
        const name = p ? sanitize(p.name) : '?';
        html += `<tr><td>${name}</td><td>${st.g||0}</td><td>${st.a||0}</td><td>${st.s||0}</td><td>${st.t||0}</td></tr>`;
      });
      html += '</tbody></table>';
      return html;
    }

    const htmlContent = getPrintHeader('Estadísticas del partido') +
      `<div style="display:flex;justify-content:space-between;align-items:center;font-size:0.95rem;margin:0.4rem 0;">
        <span class="flex-center"><img src="${hShield}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ${hName}</span>
        <span style="font-weight:900;font-size:1.2rem;">${match.sH} - ${match.sA}</span>
        <span class="flex-center">${aName} <img src="${aShield}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"></span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;">
        <div><div style="font-weight:700;color:var(--neon-cyan);font-size:0.8rem;">${hName}</div>${renderStats(h, match.stats.filter(s=>s.tId===match.h))}</div>
        <div><div style="font-weight:700;color:var(--neon-pink);font-size:0.8rem;">${aName}</div>${renderStats(a, match.stats.filter(s=>s.tId===match.a))}</div>
      </div>
      <div style="margin-top:0.5rem;font-size:0.55rem;color:#94a3b8;">${currentData.name} · Generado desde MTM Nexus</div>
    `;
    showPrintModal(htmlContent, `partido_${matchId}.jpg`, 700);
    document.querySelector('.print-modal-overlay')?.remove();
  };

  // ---------- PLAYOFFS ----------
  function renderPlayoffs(torneo) {

  // ---------- STATS ----------
  function renderStats(torneo) {
    if (!torneo) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay datos.</div>';
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || {};
          allPlayers.push({
            ...p,
            id: p.id,
            teamName: team.name,
            teamShield: team.shield,
            goals: s.goals || 0,
            assists: s.assists || 0,
            saves: s.saves || 0,
            shots: s.shots || 0,
            pig: s.pig || 0,
            matchesPlayed: s.matchesPlayed || 0
          });
        }
      });
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>No hay jugadores con estadísticas.</div>';

    function makeTable(title, key, label, containerId) {
      const sorted = [...allPlayers].sort((a,b) => (b[key]||0) - (a[key]||0));
      const limit = statsLimits[key] || 10;
      const visible = sorted.slice(0, limit);
      const hasMore = limit < sorted.length && limit < MAX_STATS_LIMIT;
      let html = `<div class="card"><div class="card-header">${title}${hasMore ? `<button class="expand-btn" data-key="${key}" data-label="${label}">Ver 10 más</button>` : ''}</div><div class="table-wrap" id="${containerId}"><table><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>${label}</th></tr></thead><tbody>`;
      visible.forEach((p, i) => {
        html += `<tr><td>${i+1}</td><td class="flex-center"><img src="${p.teamShield||''}" class="shield-sm"> ${sanitize(p.name)}</td><td>${sanitize(p.teamName)}</td><td><strong>${p[key]||0}</strong></td></tr>`;
      });
      html += '</tbody></table></div></div>';
      return html;
    }

    let html = makeTable('⚽ Goleadores', 'goals', 'Goles', 'stats-goals');
    html += makeTable('🎯 Asistencias', 'assists', 'Asistencias', 'stats-assists');
    html += makeTable('🧤 Salvadas', 'saves', 'Salvadas', 'stats-saves');
    html += makeTable('💀 Tiros (Peligro)', 'shots', 'Tiros', 'stats-shots');

    html += `<div class="card"><div class="card-header">⭐ MVPs por Jornada</div>`;
    const totalJornadas = torneo.rounds ? torneo.rounds.length : 0;
    if (!totalJornadas) {
      html += '<div class="text-muted" style="font-size:0.8rem;">No hay jornadas para mostrar MVPs.</div>';
    } else {
