    // Eventos del menú
    document.querySelectorAll('.nav-item').forEach(function(el) {
      el.addEventListener('click', function() {
        var sectionId = this.dataset.section;
        if (sectionId) switchView(sectionId);
        if (window.innerWidth <= 820) sidebar.classList.remove('open');
      });
    });

    switchView('tabla');
  }

  function switchView(id) {
    document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
    var target = document.getElementById('section-' + id);
    if (target) target.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(function(el) {
      el.classList.toggle('active', el.dataset.section === id);
    });
    if (id === 'performance') {
      switchPerfTab(perfCurrentTab || 'equipos');
    }
  }

  // ==========================================
  // FUNCIONES DE IMPRESIÓN (resto - no modificadas)
  // ==========================================
  function renderTabla(torneo) {
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay equipos.</div>';
    const teams = [...torneo.teams];
    teams.sort((a,b) => b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf);
    const lig = torneo.tableConfig?.liguilla ?? 8;
    const des = torneo.tableConfig?.descenso ?? 2;
    const asc = torneo.tableConfig?.ascenso ?? 2;

    let html = `<div class="table-wrap" id="tabla-general-container"><table><thead><tr>`;
    html += `<th class="th-pts">#</th><th>Equipo</th><th class="th-pts">Pts</th><th class="th-pj">PJ</th><th class="th-pg">PG</th><th class="th-pe">PE</th><th class="th-pp">PP</th><th class="th-gf">GF</th><th class="th-gc">GC</th><th class="th-dg">DG</th>`;
    html += `</tr></thead><tbody>`;
    teams.forEach((tm, i) => {
      let rowClass = '';
      if (i < asc && torneo.linkedTournamentId) rowClass = 'row-ascenso';
      else if (i < lig) rowClass = 'row-clasif';
      else if (i >= teams.length - des && des > 0) rowClass = 'row-descenso';
      const dg = (tm.gf||0) - (tm.gc||0);
      html += `<tr class="${rowClass}">`;
      html += `<td>${i+1}</td>`;
      html += `<td class="flex-center"><img src="${tm.shield||''}" class="shield-sm" alt=""> ${tm.name}</td>`;
      html += `<td class="td-pts"><strong>${tm.pts||0}</strong></td>`;
      html += `<td class="td-pj">${tm.pj||0}</td>`;
      html += `<td class="td-pg">${tm.pg||0}</td>`;
      html += `<td class="td-pe">${tm.pe||0}</td>`;
      html += `<td class="td-pp">${tm.pp||0}</td>`;
      html += `<td class="td-gf">${tm.gf||0}</td>`;
      html += `<td class="td-gc">${tm.gc||0}</td>`;
      html += `<td class="td-dg">${dg}</td>`;
      html += `</tr>`;
    });
    html += '</tbody></table></div>';
    let legend = '<div class="flex-center gap-1" style="font-size:0.65rem;margin-top:0.4rem;">';
    if (lig > 0) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-green);border-radius:2px;"></span> Clasificación</span>`;
    if (asc > 0 && torneo.linkedTournamentId) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-yellow);border-radius:2px;"></span> Ascenso</span>`;
    if (des > 0) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-red);border-radius:2px;"></span> Descenso</span>`;
    legend += '</div>';
    return html + legend;
  }

  function renderMedia(torneo) {
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay equipos.</div>';
    const sorted = [...torneo.teams].sort((a,b) => (b.glb||0) - (a.glb||0));
    const avgGLB = torneo.teams.reduce((sum, t) => sum + t.glb, 0) / torneo.teams.length;
    const getTrend = (team) => {
      const diff = team.glb - avgGLB;
      if (diff > 10) return { symbol: '▲', cls: 'trend-up' };
      if (diff < -10) return { symbol: '▼', cls: 'trend-down' };
      return { symbol: '—', cls: 'trend-flat' };
    };
    let html = `<div class="table-wrap" id="tabla-media-container"><table><thead><tr><th>#</th><th>Equipo</th><th class="th-gf">ATK</th><th class="th-gc">DEF</th><th class="th-dg">GLB</th></tr></thead><tbody>`;
    sorted.forEach((tm, i) => {
      const atkTrend = getTrend({ glb: tm.atk });
      const defTrend = getTrend({ glb: tm.def });
      const glbTrend = getTrend({ glb: tm.glb });
      html += `<tr><td>${i+1}</td><td class="flex-center"><img src="${tm.shield||''}" class="shield-sm"> ${tm.name}</td><td><span class="power-badge atk">${tm.atk||0} <span class="${atkTrend.cls}">${atkTrend.symbol}</span></span></td><td><span class="power-badge def">${tm.def||0} <span class="${defTrend.cls}">${defTrend.symbol}</span></span></td><td><span class="power-badge glb">${tm.glb||0} <span class="${glbTrend.cls}">${glbTrend.symbol}</span></span></td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderJornadas(torneo) {
    if (!torneo.rounds || !torneo.rounds.length) return '<div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i>No hay jornadas generadas.</div>';
    let html = '';
    torneo.rounds.forEach((round, idx) => {
      html += `<div class="card"><div class="card-header">Jornada ${idx+1}</div>`;
      if (!round.length) {
        html += '<div class="text-muted" style="font-size:0.8rem;">Sin partidos</div>';
      } else {
        html += `<div class="table-wrap"><table><thead><tr><th>Local</th><th>Resultado</th><th>Visitante</th></tr></thead><tbody>`;
        round.forEach(m => {
          const h = getTeamById(torneo.teams, m.h);
          const a = getTeamById(torneo.teams, m.a);
          const hName = h ? h.name : '???';
          const aName = a ? a.name : '???';
          const hShield = h ? h.shield : '';
          const aShield = a ? a.shield : '';
          const played = m.played || false;
          const score = played ? `${m.sH} - ${m.sA}` : 'vs';
          const clickable = played ? `class="match-clickable" onclick="showMatchStats('${m.id}')"` : '';
          html += `
            <tr ${clickable}>
              <td class="flex-center"><img src="${hShield}" class="shield-sm"> ${hName}</td>
              <td style="font-weight:700;text-align:center;">${score}</td>
              <td class="flex-center" style="justify-content:flex-end;">${aName} <img src="${aShield}" class="shield-sm"></td>
            </tr>
          `;
        });
        html += '</tbody></table></div>';
      }
      html += '</div>';
    });
    return html;
  }

  window.showMatchStats = function(matchId) {
    if (!currentData) return;
    let match = null;
    for (let round of (currentData.rounds || [])) {
      const found = round.find(m => m.id === matchId);
      if (found) { match = found; break; }
    }
    if (!match) {
      for (let fm of (currentData.friendlyMatches || [])) {
        if (fm.id === matchId) { match = fm; break; }
      }
    }
    if (!match || !match.played || !match.stats) {
      alert('Este partido no tiene estadísticas detalladas.');
      return;
    }

    const h = getTeamById(currentData.teams, match.h);
    const a = getTeamById(currentData.teams, match.a);
    const hName = h ? h.name : 'Desconocido';
    const aName = a ? a.name : 'Desconocido';
    const hShield = h ? h.shield : '';
    const aShield = a ? a.shield : '';

    const hStats = match.stats.filter(s => s.tId === match.h);
    const aStats = match.stats.filter(s => s.tId === match.a);

    function renderPlayerStats(team, statsArray) {
      if (!team || !statsArray.length) return '<div class="text-muted" style="font-size:0.7rem;">Sin estadísticas</div>';
      let html = `<div style="font-size:0.7rem;margin-top:0.2rem;"><table style="width:100%;font-size:0.7rem;border-collapse:collapse;"><thead><tr style="border-bottom:1px solid var(--color-border);"><th>Jugador</th><th>G</th><th>A</th><th>S</th><th>T</th></tr></thead><tbody>`;
      statsArray.forEach(st => {
        const p = team.players.find(x => x.id === st.pId);
        const name = p ? p.name : '?';
        html += `<tr><td>${name}</td><td>${st.g||0}</td><td>${st.a||0}</td><td>${st.s||0}</td><td>${st.t||0}</td></tr>`;
      });
      html += '</tbody></table></div>';
      return html;
    }

    const modalHtml = `
      <div class="print-modal-overlay" onclick="if(event.target===this) this.remove()">
        <div class="print-modal" style="max-width:650px;">
          <h3>📊 Estadísticas del partido</h3>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:1rem;margin-bottom:0.5rem;">
            <span class="flex-center"><img src="${hShield}" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"> ${hName}</span>
            <span style="font-weight:900;font-size:1.3rem;">${match.sH} - ${match.sA}</span>
            <span class="flex-center">${aName} <img src="${aShield}" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"></span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div><div class="card-header" style="font-size:0.7rem;">${hName}</div>${renderPlayerStats(h, hStats)}</div>
            <div><div class="card-header" style="font-size:0.7rem;">${aName}</div>${renderPlayerStats(a, aStats)}</div>
          </div>
          <div class="actions" style="margin-top:0.5rem;">
            <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cerrar</button>
            <button class="btn-download" onclick="printMatchStats('${matchId}')">Imprimir</button>
          </div>
        </div>
      </div>
    `;
    const overlay = document.createElement('div');
    overlay.innerHTML = modalHtml;
    document.body.appendChild(overlay);
  };

  window.printMatchStats = function(matchId) {
    const match = (() => {
      for (let round of (currentData.rounds || [])) {
        const found = round.find(m => m.id === matchId);
        if (found) return found;
      }
      for (let fm of (currentData.friendlyMatches || [])) {
        if (fm.id === matchId) return fm;
      }
      return null;
    })();
    if (!match) return alert('Partido no encontrado.');

    const h = getTeamById(currentData.teams, match.h);
    const a = getTeamById(currentData.teams, match.a);
    const hName = h ? h.name : 'Desconocido';
    const aName = a ? a.name : 'Desconocido';
    const hShield = h ? h.shield : '';
    const aShield = a ? a.shield : '';

    function renderStats(team, statsArray) {
      if (!team || !statsArray.length) return '<div class="text-muted">Sin estadísticas</div>';
      let html = '<table style="width:100%;font-size:0.7rem;border-collapse:collapse;margin-top:0.2rem;"><thead><tr style="border-bottom:1px solid #2d2d44;"><th>Jugador</th><th>G</th><th>A</th><th>S</th><th>T</th></tr></thead><tbody>';
      statsArray.forEach(st => {
        const p = team.players.find(x => x.id === st.pId);

    const htmlContent = getPrintHeader('Estadísticas del partido') +
      `<div style="display:flex;justify-content:space-between;align-items:center;font-size:0.95rem;margin:0.4rem 0;">
        <span class="flex-center"><img src="${hShield}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ${hName}</span>
        <span style="font-weight:900;font-size:1.2rem;">${match.sH} - ${match.sA}</span>
        <span class="flex-center">${aName} <img src="${aShield}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"></span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;">
        <div><div style="font-weight:700;color:var(--neon-cyan);font-size:0.8rem;">${hName}</div>${renderStats(h, match.stats.filter(s=>s.tId===match.h))}</div>
        <div><div style="font-weight:700;color:var(--neon-pink);font-size:0.8rem;">${aName}</div>${renderStats(a, match.stats.filter(s=>s.tId===match.a))}</div>
      </div>
      <div style="margin-top:0.5rem;font-size:0.55rem;color:#94a3b8;">${currentData.name} · Generado desde MTM Nexus</div>
    `;
    showPrintModal(htmlContent, `partido_${matchId}.jpg`, 700);
    document.querySelector('.print-modal-overlay')?.remove();
  };

  function renderPlayoffs(torneo) {
    if (!torneo.playoffs || !torneo.playoffs.rounds || !torneo.playoffs.rounds.length) {
      return '<div class="empty-state"><i class="fa-solid fa-clock"></i>Próximamente</div>';

    let html = '<div style="display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;">';

      html += `<div style="display:flex;flex-direction:column;gap:0.4rem;min-width:130px;">`;
      html += `<div class="card-header" style="text-align:center;">${ri === 0 ? 'Cuartos' : ri === 1 ? 'Semis' : ri === 2 ? 'Final' : `Ronda ${ri+1}`}</div>`;
      r.forEach(m => {
        const h = getTeamById(torneo.teams, m.h);
        const a = getTeamById(torneo.teams, m.a);
        const hName = h ? h.name : 'TBD';
        const aName = a ? a.name : 'TBD';
        const hShield = h ? h.shield : '';
        const aShield = a ? a.shield : '';

        const score = played ? `${m.sH} - ${m.sA}` : 'vs';

          <div class="card" style="padding:0.4rem 0.6rem;margin:0;min-width:110px;">

              <span class="flex-center"><img src="${hShield}" class="shield-sm" style="width:1.2rem;height:1.2rem;"> ${hName}</span>
              <span style="font-weight:700;">${score}</span>
              <span class="flex-center">${aName} <img src="${aShield}" class="shield-sm" style="width:1.2rem;height:1.2rem;"></span>
            </div>

  function renderStats(torneo) {
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || {};
          allPlayers.push({
            id: p.id,
            ...p,
            teamName: team.name,
            teamShield: team.shield,
            goals: s.goals || 0,
            assists: s.assists || 0,
            saves: s.saves || 0,
            shots: s.shots || 0,
            pig: s.pig || 0,
            matchesPlayed: s.matchesPlayed || 0
          });
        }
      });
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>No hay jugadores con estadísticas.</div>';

    function makeTable(title, key, label, containerId) {
      const sorted = [...allPlayers].sort((a,b) => (b[key]||0) - (a[key]||0));
      const limit = statsLimits[key] || 10;
      const visible = sorted.slice(0, limit);
      const hasMore = limit < sorted.length && limit < MAX_STATS_LIMIT;
      let html = `<div class="card"><div class="card-header">${title}${hasMore ? `<button class="expand-btn" data-key="${key}" data-label="${label}">Ver 10 más</button>` : ''}</div><div class="table-wrap" id="${containerId}"><table><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>${label}</th></tr></thead><tbody>`;
      visible.forEach((p, i) => {
        html += `<tr onclick="showPlayerProfile('${p.id}')" style="cursor:pointer;">`;
        html += `<td>${i+1}</td><td class="flex-center"><img src="${p.teamShield||''}" class="shield-sm"> ${p.name}</td><td>${p.teamName}</td><td><strong>${p[key]||0}</strong></td>`;
        html += `</tr>`;
      });
      html += '</tbody></table></div></div>';
      return html;
    }

    let html = makeTable('⚽ Goleadores', 'goals', 'Goles', 'stats-goals');
    html += makeTable('🎯 Asistencias', 'assists', 'Asistencias', 'stats-assists');
    html += makeTable('🧤 Salvadas', 'saves', 'Salvadas', 'stats-saves');
    html += makeTable('💀 Tiros (Peligro)', 'shots', 'Tiros', 'stats-shots');

    html += `<div class="card"><div class="card-header">🔥 Poder de Equipos (con tendencia)</div><div class="table-wrap">`;
    const sortedTeams = [...torneo.teams].sort((a,b) => (b.glb||0) - (a.glb||0));
    const avgGLB = torneo.teams.reduce((sum, t) => sum + t.glb, 0) / torneo.teams.length;
    const getTrend = (team) => {
      const diff = team.glb - avgGLB;
      if (diff > 10) return { symbol: '▲', cls: 'trend-up' };
      if (diff < -10) return { symbol: '▼', cls: 'trend-down' };
      return { symbol: '—', cls: 'trend-flat' };
    };
    html += `<table><thead><tr><th>#</th><th>Equipo</th><th class="th-gf">ATK</th><th class="th-gc">DEF</th><th class="th-dg">GLB</th></tr></thead><tbody>`;
    sortedTeams.forEach((tm, i) => {
      const atkTrend = getTrend({ glb: tm.atk });
      const defTrend = getTrend({ glb: tm.def });
      const glbTrend = getTrend({ glb: tm.glb });
      html += `<tr><td>${i+1}</td><td class="flex-center"><img src="${tm.shield||''}" class="shield-sm"> ${tm.name}</td><td><span class="power-badge atk">${tm.atk||0} <span class="${atkTrend.cls}">${atkTrend.symbol}</span></span></td><td><span class="power-badge def">${tm.def||0} <span class="${defTrend.cls}">${defTrend.symbol}</span></span></td><td><span class="power-badge glb">${tm.glb||0} <span class="${glbTrend.cls}">${glbTrend.symbol}</span></span></td></tr>`;
    });
    html += '</tbody></table></div></div>';

    html += `<div class="card"><div class="card-header">⭐ MVPs por Jornada</div>`;
    const totalJornadas = torneo.rounds ? torneo.rounds.length : 0;
    if (!totalJornadas) {
      html += '<div class="text-muted" style="font-size:0.8rem;">No hay jornadas para mostrar MVPs.</div>';
    } else {
      html += `<div class="jornada-nav" id="mvp-jornada-nav">`;
      for (let i = 0; i < totalJornadas; i++) {
        html += `<button data-jornada="${i}" class="${i === currentMvpJornada ? 'active' : ''}">J${i+1}</button>`;
      }
      html += `</div><div id="mvp-content"></div>`;
    }
    html += '</div>';

    setTimeout(function() {
      document.querySelectorAll('.expand-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const key = this.dataset.key;
          if (statsLimits[key]) {
            statsLimits[key] += 10;
            if (statsLimits[key] > MAX_STATS_LIMIT) statsLimits[key] = MAX_STATS_LIMIT;
            const sec = document.getElementById('section-stats');
            if (sec) {
              const cont = sec.querySelector('.section-content');
              if (cont) cont.innerHTML = renderStats(currentData);
              setTimeout(function() {
                document.querySelectorAll('.expand-btn').forEach(function(b) {
                  b.addEventListener('click', function() {
                    const k = this.dataset.key;
                    if (statsLimits[k]) {
                      statsLimits[k] += 10;
                      if (statsLimits[k] > MAX_STATS_LIMIT) statsLimits[k] = MAX_STATS_LIMIT;
                      const sec2 = document.getElementById('section-stats');
                      if (sec2) {
                        const cont2 = sec2.querySelector('.section-content');
                        if (cont2) cont2.innerHTML = renderStats(currentData);
                      }
                    }
                  });
                });
              }, 50);
            }
          }
        });
      });

      document.querySelectorAll('#mvp-jornada-nav button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.jornada);
          currentMvpJornada = idx;
          document.querySelectorAll('#mvp-jornada-nav button').forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          document.getElementById('mvp-content').innerHTML = renderMvpForJornada(currentData, idx);
        });
      });
      if (totalJornadas > 0) {
        document.getElementById('mvp-content').innerHTML = renderMvpForJornada(currentData, currentMvpJornada);
      }
    }, 50);

    return `<div class="section-content">${html}</div>`;
  }

  function renderMvpForJornada(torneo, jornadaIdx) {
    const round = torneo.rounds && torneo.rounds[jornadaIdx];
    if (!round || !round.length) return '<div class="text-muted" style="font-size:0.8rem;">No hay partidos en esta jornada.</div>';

    const statsMap = {};
    const teamStats = {};
    torneo.teams.forEach(function(t) { teamStats[t.id] = { pts: 0, g: 0, a: 0, s: 0, pig: 0 }; });

    round.forEach(function(m) {
      if (m.stats) {
        m.stats.forEach(function(st) {
          if (!statsMap[st.pId]) statsMap[st.pId] = { g:0, a:0, s:0, t:0, pig:0, teamId: st.tId };
          statsMap[st.pId].g += st.g || 0;
          statsMap[st.pId].a += st.a || 0;
          statsMap[st.pId].s += st.s || 0;
          statsMap[st.pId].t += st.t || 0;
          var pig = (st.g||0)*2 + (st.a||0)*1.5 + (st.s||0)*1 + ((st.t||0) - (st.g||0))*0.2;
          statsMap[st.pId].pig += pig;
          if (teamStats[st.tId]) {
            teamStats[st.tId].g += st.g || 0;
            teamStats[st.tId].a += st.a || 0;
            teamStats[st.tId].s += st.s || 0;
            teamStats[st.tId].pig += pig;
          }
        });
      }
      if (m.played) {
        if (m.sH > m.sA) { if (teamStats[m.h]) teamStats[m.h].pts += 3; }
        else if (m.sA > m.sH) { if (teamStats[m.a]) teamStats[m.a].pts += 3; }
        else { if (teamStats[m.h]) teamStats[m.h].pts += 1; if (teamStats[m.a]) teamStats[m.a].pts += 1; }
      }
    });

    var mvp = null, maxPig = -1;
    Object.keys(statsMap).forEach(function(pid) {
      var st = statsMap[pid];
      if (st.pig > maxPig) { maxPig = st.pig; mvp = { id: pid, pig: st.pig }; }
    });

    var bestTeam = null, bestScore = -1;
    Object.keys(teamStats).forEach(function(tid) {
      var st = teamStats[tid];
      var score = (st.pts || 0) + (st.pig || 0)/10;
      if (score > bestScore) { bestScore = score; bestTeam = { id: tid, pts: st.pts, pig: st.pig }; }
    });

    var bestGoleador = null, bestAsistidor = null, bestMuro = null;
    var maxG=-1, maxA=-1, maxS=-1;
    Object.keys(statsMap).forEach(function(pid) {
      var st = statsMap[pid];
      if (st.g > maxG) { maxG = st.g; bestGoleador = { id: pid, g: st.g }; }
      if (st.a > maxA) { maxA = st.a; bestAsistidor = { id: pid, a: st.a }; }
      if (st.s > maxS) { maxS = st.s; bestMuro = { id: pid, s: st.s }; }
    });

    function getPlayerInfo(pid) {
      for (var i = 0; i < torneo.teams.length; i++) {
        var team = torneo.teams[i];
        var p = team.players.find(function(x) { return x.id === pid; });
        if (p) return { name: p.name, teamName: team.name, rank: p.rocketRank || 'Platino', shield: team.shield };
      }
      return null;
    }

    var html = '<div class="mvp-grid">';
    if (mvp) {
      var info = getPlayerInfo(mvp.id);
      html += '<div class="mvp-card"><div class="label">🏆 MVP</div><div class="name">' + (info ? info.name : '?') + '</div><div style="font-size:0.65rem;color:var(--color-text-muted);">' + (info ? info.teamName : '') + '</div><div class="stat">' + mvp.pig.toFixed(1) + ' PIG</div></div>';
    }
    if (bestTeam) {
      var team = getTeamById(torneo.teams, bestTeam.id);
      html += '<div class="mvp-card"><div class="label">🏅 Equipo de la Jornada</div><div class="name">' + (team ? team.name : '?') + '</div><div class="stat">' + (bestTeam.pts||0) + ' pts · ' + (bestTeam.pig||0).toFixed(1) + ' PIG</div></div>';
    }
    html += '<div class="mvp-card" style="max-width:300px;flex:2;"><div class="label">⭐ Dream Team</div>';
    if (bestGoleador) {
      var info = getPlayerInfo(bestGoleador.id);
      html += '<div style="font-size:0.65rem;"><span class="text-neon-green">⚽</span> ' + (info ? info.name : '?') + ' (' + bestGoleador.g + ' goles)</div>';
    }
    if (bestAsistidor) {
      var info = getPlayerInfo(bestAsistidor.id);
      html += '<div style="font-size:0.65rem;"><span class="text-neon-cyan">🎯</span> ' + (info ? info.name : '?') + ' (' + bestAsistidor.a + ' asistencias)</div>';
    }
    if (bestMuro) {
      var info = getPlayerInfo(bestMuro.id);
      html += '<div style="font-size:0.65rem;"><span class="text-neon-pink">🧤</span> ' + (info ? info.name : '?') + ' (' + bestMuro.s + ' salvadas)</div>';
    }
    html += '</div></div>';
    return html;
  }

  function renderBalon(torneo) {
    var allPlayers = [];
    torneo.teams.forEach(function(team) {
      team.players.forEach(function(p) {
        if (p.name && p.name.trim() !== '') {
          var s = p.seasonStats || { pig:0 };
          allPlayers.push({ id: p.id, name: p.name, teamName: team.name, teamShield: team.shield, pig: s.pig || 0 });
        }
      });
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-trophy"></i>Sin jugadores.</div>';
    var sorted = allPlayers.sort(function(a,b) { return (b.pig||0) - (a.pig||0); });

    var html = '<div class="podium">';
    var top3 = sorted.slice(0,3);
    var cls = ['first','second','third'];
    top3.forEach(function(p, i) {
      var displayName = p.name;
      if (displayName.length > 16) displayName = displayName.substring(0, 14) + '…';
      html += `<div class="podium-item ${cls[i]}" onclick="showPlayerProfile('${p.id}')">`;
      html += '<div class="circle"><img src="' + (p.teamShield || '') + '" alt="' + p.name + '" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<span class=\\\'no-img\\\'>#' + (i+1) + '</span>\';" /></div>';
      html += '<div class="pos">#' + (i+1) + '</div>';
      html += '<div class="name" title="' + p.name + '">' + displayName + '</div>';
      html += '<div class="value">' + (p.pig||0).toFixed(1) + ' PIG</div>';
      html += '<div class="sub">' + p.teamName + '</div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="table-wrap"><table><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>PIG</th></tr></thead><tbody>';
    sorted.slice(3).forEach(function(p, i) {
      html += `<tr onclick="showPlayerProfile('${p.id}')" style="cursor:pointer;">`;
      html += '<td>' + (i+4) + '</td><td class="flex-center"><img src="' + (p.teamShield||'') + '" class="shield-sm"> ' + p.name + '</td><td>' + p.teamName + '</td><td>' + (p.pig||0).toFixed(1) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ==========================================
  // RENDERIZADO DE EQUIPOS
  // ==========================================
  function renderEquipos(torneo) {
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>No hay equipos.</div>';
    var html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem;">';
    torneo.teams.forEach(function(team) {
        var titulares = team.players.filter(function(p) {
            return p.role === 'Titular 🌟' && p.name && p.name.trim() !== '';
        });
        var suplentes = team.players.filter(function(p) {
            return p.role === 'Suplente 🔄' && p.name && p.name.trim() !== '';
        });
        var reservas = team.players.filter(function(p) {
            return p.role === 'Reserva 💤' && p.name && p.name.trim() !== '';
        });
        var capitan = team.players.find(function(p) { return p.isCaptain; });

        var renderPlayerSlots = function(players, cls, label) {
            if (!players.length) return '<span class="text-muted" style="font-size:0.7rem;">Sin ' + label + '</span>';
            return players.map(function(p) {
                const stats = p.seasonStats || { goals: 0, assists: 0, saves: 0 };
                const rankColor = getRankColor(p.rocketRank);
                const captainClass = p.isCaptain ? ' captain' : '';
                return `
                    <div class="player-slot ${cls}${captainClass}" onclick="showPlayerProfile('${p.id}')" title="Ver perfil de ${p.name}">
                        <div class="slot-name">${p.name}</div>

    function renderMercadoTabla() {
      var equipo = document.getElementById('mercadoEquipo').value;
      var orden = document.getElementById('mercadoOrden').value;
      var busqueda = document.getElementById('mercadoBuscar').value.toLowerCase();

      var filtered = allPlayers;
      if (equipo === 'free') filtered = filtered.filter(function(p) { return p.isFree; });
      else if (equipo !== 'all') filtered = filtered.filter(function(p) { return p.teamId === equipo; });
      if (busqueda) filtered = filtered.filter(function(p) { return p.name.toLowerCase().includes(busqueda); });

      if (advFilters.rankMin) {
        const rankOrder = ['Bronce', 'Plata', 'Oro', 'Platino', 'Diamante', 'Campeón', 'Gran Campeón', 'SSL'];
        const minIdx = rankOrder.indexOf(advFilters.rankMin);
        if (minIdx !== -1) {
          filtered = filtered.filter(p => rankOrder.indexOf(p.rocketRank) >= minIdx);
        }
      }
      if (advFilters.rankMax) {
        const rankOrder = ['Bronce', 'Plata', 'Oro', 'Platino', 'Diamante', 'Campeón', 'Gran Campeón', 'SSL'];
        const maxIdx = rankOrder.indexOf(advFilters.rankMax);
        if (maxIdx !== -1) {
          filtered = filtered.filter(p => rankOrder.indexOf(p.rocketRank) <= maxIdx);
        }
      }
      if (advFilters.division) {
        filtered = filtered.filter(p => p.division == advFilters.division);
      }
      if (advFilters.priceMin > 0) {
        filtered = filtered.filter(p => p.marketValue >= advFilters.priceMin);
      }
      if (advFilters.priceMax < Infinity) {
        filtered = filtered.filter(p => p.marketValue <= advFilters.priceMax);
      }

      switch (orden) {
        case 'precio-desc': filtered.sort(function(a,b) { return (b.marketValue||0) - (a.marketValue||0); }); break;
        case 'precio-asc': filtered.sort(function(a,b) { return (a.marketValue||0) - (b.marketValue||0); }); break;
        case 'pig-desc': filtered.sort(function(a,b) { return (b.pig||0) - (a.pig||0); }); break;
        case 'pig-asc': filtered.sort(function(a,b) { return (a.pig||0) - (b.pig||0); }); break;
        case 'nombre': filtered.sort(function(a,b) { return a.name.localeCompare(b.name); }); break;
        case 'nombre-desc': filtered.sort(function(a,b) { return b.name.localeCompare(a.name); }); break;
        default: break;
      }

      if (!filtered.length) {
        document.getElementById('mercadoTablaContainer').innerHTML = '<div class="empty-state"><i class="fa-solid fa-search"></i>No se encontraron jugadores.</div>';
        return;
      }

      var tabla = '<div class="table-wrap"><table><thead><tr>';
      tabla += '<th>RNK</th>';
      tabla += '<th>Jugador</th>';
      tabla += '<th>Equipo</th>';
      tabla += '<th>PIG</th>';
      tabla += '<th>Rango</th>';
      tabla += '<th>Precio</th>';
      tabla += '</tr></thead><tbody>';

      filtered.forEach(function(p, index) {
        var rank = index + 1;
        var rnkClass = (rank <= 10) ? 'rnk-gold' : '';
        tabla += `<tr class="market-row-click" onclick="showPlayerProfile('${p.id}')">`;
        tabla += `<td style="text-align:center;font-weight:700;" class="${rnkClass}">${rank}</td>`;
        tabla += '<td class="flex-center"><img src="' + (p.teamShield||'') + '" class="shield-sm"> ' + p.name + (p.isCaptain ? ' 👑' : '') + (p.isFree ? ' 🆓' : '') + '</td>';
        tabla += '<td>' + p.teamName + '</td>';
        tabla += '<td>' + (p.pig||0).toFixed(1) + '</td>';
        tabla += '<td style="color:' + getRankColor(p.rocketRank) + ';font-weight:700;">' + p.rocketRankDisplay + '</td>';
        tabla += '<td>' + formatCurrency(p.marketValue||0) + '</td>';
        tabla += '</tr>';
      });
      tabla += '</tbody></table></div>';
      document.getElementById('mercadoTablaContainer').innerHTML = tabla;
    }

    setTimeout(function() {
      document.getElementById('mercadoEquipo').addEventListener('change', renderMercadoTabla);
      document.getElementById('mercadoOrden').addEventListener('change', renderMercadoTabla);
      document.getElementById('mercadoBuscar').addEventListener('input', renderMercadoTabla);
      renderMercadoTabla();
    }, 0);

    return html;
  }

  function obtenerMovimientosFiltrados(torneo, filtros) {
    if (!torneo || !torneo.economyLogs) return [];
    let movs = torneo.economyLogs.slice();

    if (filtros.round && filtros.round !== 'todas') {
      const roundNum = parseInt(filtros.round);
      movs = movs.filter(m => m.round === roundNum);
    }

    if (filtros.team && filtros.team !== 'all') {
      movs = movs.filter(m => m.teamId === filtros.team);
    }

    if (filtros.type && filtros.type !== 'todos') {
      movs = movs.filter(m => m.type === filtros.type);
    }

    switch (filtros.sort) {
      case 'reciente': movs.sort((a,b) => (b.date||0) - (a.date||0)); break;
      case 'antiguo': movs.sort((a,b) => (a.date||0) - (b.date||0)); break;
      case 'mas_caro': movs.sort((a,b) => Math.abs(b.amount||0) - Math.abs(a.amount||0)); break;
      case 'menos_caro': movs.sort((a,b) => Math.abs(a.amount||0) - Math.abs(b.amount||0)); break;
      default: movs.sort((a,b) => (b.date||0) - (a.date||0));
    }
    return movs;
  }

  function aplicarFiltrosEconomia() {
    const torneo = currentData;
    if (!torneo || !torneo.economyLogs) return;

    const round = document.getElementById('eco-filtro-jornada')?.value || 'todas';
    const team = document.getElementById('eco-filtro-equipo')?.value || 'all';
    const type = document.getElementById('eco-filtro-tipo')?.value || 'todos';
    const sort = document.getElementById('eco-filtro-orden')?.value || 'reciente';

    currentEcoFilters = { round, team, type, sort };

    const movs = obtenerMovimientosFiltrados(torneo, currentEcoFilters);

    let total = 0, ingresos = 0, gastos = 0;
    movs.forEach(m => {
      const amt = m.amount || 0;
      total += amt;
      if (amt > 0) ingresos += amt;
      else gastos += Math.abs(amt);
    });

    document.getElementById('eco-total-movs').textContent = movs.length;
    document.getElementById('eco-total-ingresos').textContent = formatCurrency(ingresos);
    document.getElementById('eco-total-gastos').textContent = formatCurrency(gastos);
    const netoEl = document.getElementById('eco-total-neto');
    netoEl.textContent = formatCurrency(total);
    netoEl.style.color = total >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';

    const tbody = document.getElementById('eco-tabla-body');
    if (!movs.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay movimientos con estos filtros.</td></tr>';
      return;
    }

    let html = '';
    movs.forEach(m => {
      const team = getTeamById(torneo.teams, m.teamId);
      const teamName = team ? team.name : 'Desconocido';
      const teamShield = team ? team.shield : '';
      const tipoInfo = getTipoInfo(m.type);
      const isIncome = (m.amount || 0) > 0;
      const sign = isIncome ? '+' : '';
      const color = isIncome ? 'var(--neon-green)' : 'var(--neon-red)';
      const dateStr = formatDate(m.date);

      html += `
        <tr>
          <td style="font-size:0.65rem;white-space:nowrap;">${dateStr}</td>
          <td class="flex-center"><img src="${teamShield}" class="shield-sm"> ${teamName}</td>
          <td>${m.description || 'Sin descripción'}</td>
          <td><span class="type-badge ${tipoInfo.cls}">${tipoInfo.icon} ${tipoInfo.label}</span></td>
          <td style="text-align:right;color:${color};font-weight:700;">${sign}${formatCurrency(m.amount)}</td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  function confirmarImpresionEconomia() {
    const torneo = currentData;
    if (!torneo || !torneo.economyLogs) { alert('No hay datos.'); return; }

    const roundMode = document.getElementById('print-eco-round').value;
    let movs = torneo.economyLogs.slice();

    if (roundMode === 'rango') {
      const from = parseInt(document.getElementById('print-eco-round-from').value);
      const to = parseInt(document.getElementById('print-eco-round-to').value);
      movs = movs.filter(m => m.round >= from && m.round <= to);
    } else if (roundMode !== 'todas') {
      const roundNum = parseInt(document.getElementById('print-eco-round-select').value);
      movs = movs.filter(m => m.round === roundNum);
    }

    const typeCheckboxes = document.querySelectorAll('#print-eco-types input[type="checkbox"]:checked');
    const selectedTypes = Array.from(typeCheckboxes).map(el => el.value);
    if (selectedTypes.length > 0 && !selectedTypes.includes('todos')) {
      movs = movs.filter(m => selectedTypes.includes(m.type));
    }

    const teamFilter = document.getElementById('print-eco-equipo').value;
    if (teamFilter !== 'all') {
      movs = movs.filter(m => m.teamId === teamFilter);
    }

    const order = document.getElementById('print-eco-order').value;
    switch (order) {
      case 'mas_caro': movs.sort((a,b) => Math.abs(b.amount||0) - Math.abs(a.amount||0)); break;
      case 'menos_caro': movs.sort((a,b) => Math.abs(a.amount||0) - Math.abs(b.amount||0)); break;
      case 'reciente': movs.sort((a,b) => (b.date||0) - (a.date||0)); break;
      case 'antiguo': movs.sort((a,b) => (a.date||0) - (b.date||0)); break;
    }

    const topSelect = document.getElementById('print-eco-top-select').value;
    let topN = parseInt(topSelect);
    if (topSelect === 'custom') {
      topN = parseInt(document.getElementById('print-eco-top-custom').value) || 10;
    }
    if (topN < 1) topN = 1;
    if (topN > 30) topN = 30;
    movs = movs.slice(0, topN);

    if (!movs.length) {
      alert('No hay movimientos que coincidan con los filtros seleccionados.');
      document.querySelector('.print-modal-overlay')?.remove();
      return;
    }

    const roundLabel = roundMode === 'todas' ? 'Todas las jornadas' :
                       roundMode === 'rango' ? `Jornadas ${document.getElementById('print-eco-round-from').value} a ${document.getElementById('print-eco-round-to').value}` :
                       `Jornada ${document.getElementById('print-eco-round-select').value}`;

    const typeLabels = selectedTypes.length ? selectedTypes.map(t => getTipoInfo(t).label).join(', ') : 'Todos';
    const teamLabel = teamFilter === 'all' ? 'Todos los equipos' : getTeamById(torneo.teams, teamFilter)?.name || '?';
    const orderLabel = { 'mas_caro': 'Más caros', 'menos_caro': 'Menos caros', 'reciente': 'Más recientes', 'antiguo': 'Menos recientes' }[order] || 'Más recientes';

    let htmlContent = getPrintHeader(`Movimientos Económicos - ${roundLabel}`);

    htmlContent += `
      <div style="display:flex;gap:1rem;flex-wrap:wrap;font-size:0.7rem;color:#94a3b8;margin-bottom:0.5rem;border-bottom:1px solid #2d2d44;padding-bottom:0.5rem;">
        <span><strong>Filtros:</strong> ${roundLabel} · ${teamLabel} · ${typeLabels} · ${orderLabel} · Top ${movs.length} mostrados</span>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:0.7rem;">
        <thead><tr style="background:#1e1e2f;"><th style="padding:0.3rem 0.5rem;text-align:left;">Fecha</th><th style="padding:0.3rem 0.5rem;text-align:left;">Equipo</th><th style="padding:0.3rem 0.5rem;text-align:left;">Descripción</th><th style="padding:0.3rem 0.5rem;text-align:left;">Tipo</th><th style="padding:0.3rem 0.5rem;text-align:right;">Monto</th></tr></thead>
        <tbody>
    `;

    let totalPrint = 0;
    movs.forEach(m => {
      const team = getTeamById(torneo.teams, m.teamId);
      const teamName = team ? team.name : 'Desconocido';
      const teamShield = team ? team.shield : '';
      const tipoInfo = getTipoInfo(m.type);
      const isIncome = (m.amount || 0) > 0;
      const sign = isIncome ? '+' : '';
      const color = isIncome ? '#4ade80' : '#f87171';
      const dateStr = formatDate(m.date);
      totalPrint += (m.amount || 0);

      htmlContent += `
        <tr style="border-bottom:1px solid #2d2d44;">
          <td style="padding:0.2rem 0.5rem;font-size:0.6rem;">${dateStr}</td>
          <td style="padding:0.2rem 0.5rem;display:flex;align-items:center;gap:0.4rem;"><img src="${teamShield}" style="width:1.4rem;height:1.4rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ${teamName}</td>
          <td style="padding:0.2rem 0.5rem;">${m.description || 'Sin descripción'}</td>
          <td style="padding:0.2rem 0.5rem;"><span style="background:rgba(255,255,255,0.05);padding:0.1rem 0.4rem;border-radius:12px;border:1px solid #2d2d44;">${tipoInfo.icon} ${tipoInfo.label}</span></td>
          <td style="padding:0.2rem 0.5rem;text-align:right;color:${color};font-weight:700;">${sign}${formatCurrency(m.amount)}</td>
        </tr>
      `;
    });

    const colorTotal = totalPrint >= 0 ? '#4ade80' : '#f87171';
    htmlContent += `
        <tr style="border-top:2px solid #2d2d44;font-weight:700;">
          <td colspan="4" style="padding:0.3rem 0.5rem;text-align:right;">TOTAL NETO:</td>
          <td style="padding:0.3rem 0.5rem;text-align:right;color:${colorTotal};">${formatCurrency(totalPrint)}</td>
        </tr>
      </tbody></table>
      <div style="margin-top:0.5rem;font-size:0.55rem;color:#94a3b8;">${torneo.name} · Generado desde MTM Nexus</div>
    `;

    document.querySelector('.print-modal-overlay')?.remove();
    showPrintModal(htmlContent, `movimientos_economicos.jpg`, 900);
  }

  function renderSanciones(torneo) {
    if (!torneo.sanctionsLog || !torneo.sanctionsLog.length) return '<div class="empty-state"><i class="fa-solid fa-gavel"></i>No hay sanciones registradas.</div>';
    var logs = torneo.sanctionsLog.filter(function(s) { return s.active !== false; }).slice().reverse();
    if (!logs.length) return '<div class="empty-state"><i class="fa-solid fa-check-circle" style="color:var(--neon-green);"></i>No hay sanciones activas.</div>';
    var html = '<div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Equipo</th><th>Tipo</th><th>Motivo</th><th>Jornadas</th></tr></thead><tbody>';
    logs.forEach(function(s) {
      var team = torneo.teams.find(function(t) { return t.id === s.teamId; });
      var teamName = team ? team.name : 'Desconocido';
      var teamShield = team ? team.shield : '';
      var typeLabel = s.type === 'yellow' ? '🟨 Amonestación' : s.type === 'red' ? '🟥 Expulsión' : s.type === 'suspension' ? '🚫 Suspensión' : '💰 Multa';
      var rounds = s.roundEnd ? 'J' + s.roundStart + ' - J' + s.roundEnd : 'Desde J' + s.roundStart;
      html += '<tr><td><strong>' + s.playerName + '</strong></td><td class="flex-center"><img src="' + teamShield + '" class="shield-sm"> ' + teamName + '</td><td>' + typeLabel + '</td><td>' + s.reason + '</td><td>' + rounds + '</td></tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderSeleccion(torneo) {
    var national = null;

      national = torneo.nationalTeams.find(function(nt) { return nt.type === 'main'; });
      if (!national) national = torneo.nationalTeams[0];
    }
    if (!national || !national.players || !national.players.length) return '<div class="empty-state"><i class="fa-solid fa-flag"></i>No hay selección nacional configurada.</div>';

    var html = '<div class="card"><div class="flex-center" style="justify-content:space-between;"><span style="font-family:Montserrat,sans-serif;font-weight:900;font-size:1.2rem;">' + national.name + '</span><span style="font-size:0.65rem;color:var(--color-text-muted);">' + (national.type === 'main' ? '🇲🇽 Selección Nacional' : '🔵 Sub Selección') + '</span></div><div style="display:flex;flex-wrap:wrap;gap:0.8rem;margin-top:0.4rem;justify-content:center;">';
    national.players.forEach(function(p) {
      var rankColor = getRankColor(p.rocketRank || 'Platino');

      html += `<div class="national-player-card" onclick="showPlayerProfile('${p.id}')" style="cursor:pointer;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:0.5rem;text-align:center;min-width:90px;flex:1 0 auto;max-width:140px;transition:all 0.2s;">`;
      html += '<div style="font-size:0.55rem;color:var(--color-text-muted);">' + (p.role||'Jugador') + '</div>';
      html += '<img src="' + (p.shield||'') + '" style="width:2.5rem;height:2.5rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;margin:0.1rem auto;">';
      html += '<div style="font-weight:700;font-size:0.8rem;">' + p.name + '</div>';
      html += '<div style="font-size:0.55rem;color:' + rankColor + ';">' + rankDisplay + '</div>';
      html += '<div style="font-size:0.6rem;color:var(--neon-yellow);">G' + (p.stats?.goals||0) + ' A' + (p.stats?.assists||0) + ' S' + (p.stats?.saves||0) + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
    var power = { atk: national.atk||0, def: national.def||0, glb: national.glb||0 };
    html += '<div class="card" style="margin-top:0.3rem;"><div class="flex-center" style="gap:0.8rem;flex-wrap:wrap;"><span><span class="power-badge atk">ATK ' + power.atk + '</span></span><span><span class="power-badge def">DEF ' + power.def + '</span></span><span><span class="power-badge glb">GLB ' + power.glb + '</span></span><span style="font-size:0.65rem;color:var(--color-text-muted);">Partidos: ' + (national.matchesPlayed||0) + '</span></div></div>';
    return html;
  }

  function renderAmistosos(torneo) {
    if (!torneo.friendlyMatches || !torneo.friendlyMatches.length) return '<div class="empty-state"><i class="fa-solid fa-handshake-slash"></i>No hay partidos amistosos.</div>';
    var html = '';
    torneo.friendlyMatches.forEach(function(fm) {
      var h = getTeamById(torneo.teams, fm.h);
      var a = getTeamById(torneo.teams, fm.a);
      var hName = h ? h.name : 'Desconocido';
      var aName = a ? a.name : 'Desconocido';
      var hShield = h ? h.shield : '';
      var aShield = a ? a.shield : '';
      var played = fm.played || false;
      var score = played ? fm.sH + ' - ' + fm.sA : 'vs';
      var clickable = played ? 'class="match-clickable" onclick="showMatchStats(\'' + fm.id + '\')"' : '';
      html += '<div class="card"><div class="flex-center" style="justify-content:space-between;">';
      html += '<span class="flex-center"><img src="' + hShield + '" class="shield-sm"> ' + hName + '</span>';
      html += '<span style="font-weight:700;font-size:1.1rem;">' + score + '</span>';
      html += '<span class="flex-center">' + aName + ' <img src="' + aShield + '" class="shield-sm"></span>';
      html += '</div>';
      if (played) html += '<div style="font-size:0.6rem;color:var(--color-text-muted);text-align:center;margin-top:0.2rem;">📊 Haz clic para ver estadísticas</div>';
      html += '</div>';
    });
    return html;
  }

  function renderSalon(torneo) {
    if (!torneo.seasons || !torneo.seasons.length) return '<div class="empty-state"><i class="fa-solid fa-medal"></i>No hay temporadas guardadas.</div>';
    var html = '';
    torneo.seasons.slice().reverse().forEach(function(season, idx) {
      var realIdx = torneo.seasons.length - idx;
      html += '<div class="card"><div class="card-header">Temporada ' + realIdx + ' - ' + new Date(season.date).toLocaleDateString('es-ES') + '</div>';
      var champ = season.champion ? season.teams.find(function(t) { return t.id === season.champion; }) : null;
      if (champ) {
        html += '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.3rem;"><span style="font-size:1.3rem;">🏆</span><img src="' + (champ.shield||'') + '" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"><strong>' + champ.name + '</strong> <span style="font-size:0.65rem;color:var(--color-text-muted);">' + (champ.pts||0) + ' pts</span></div>';
      }
      var dt = season.dreamTeam || {};
      if (dt.goleador || dt.asistidor || dt.portero) {
        html += '<div style="font-size:0.65rem;display:flex;flex-wrap:wrap;gap:0.3rem 1rem;margin:0.2rem 0;">';
        if (dt.goleador) html += '<span><span class="text-neon-green">⚽</span> ' + dt.goleador.name + ' (' + dt.goleador.g + ' goles)</span>';
        if (dt.asistidor) html += '<span><span class="text-neon-cyan">🎯</span> ' + dt.asistidor.name + ' (' + dt.asistidor.a + ' asistencias)</span>';
        if (dt.portero) html += '<span><span class="text-neon-pink">🧤</span> ' + dt.portero.name + ' (' + dt.portero.s + ' salvadas)</span>';
        html += '</div>';
      }
      if (season.topPlayers && season.topPlayers.length) {
        html += '<div style="font-size:0.65rem;color:var(--color-text-muted);margin-top:0.2rem;">Top PIG: ' + season.topPlayers.slice(0,3).map(function(p) { return p.name + ' (' + (p.imp||0).toFixed(1) + ')'; }).join(' · ') + '</div>';
      }
      html += '</div>';
    });
    return html;
  }

      document.getElementById('print-stats-jornada-container').style.display = isMvp ? 'block' : 'none';
    });

    window.confirmPrintStats = function() {
      var type = document.getElementById('print-stats-type').value;
      var topN = parseInt(document.getElementById('print-stats-top').value) || 10;
      var jornadaIdx = parseInt(document.getElementById('print-stats-jornada')?.value || 0);

      if (type === 'mvp') {
        var content = renderMvpForJornada(currentData, jornadaIdx);
        var html = getPrintHeader('MVPs - Jornada ' + (jornadaIdx+1)) + content + '<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">' + currentData.name + ' · Generado desde MTM Nexus</div>';
        showPrintModal(html, 'mvps_jornada_' + (jornadaIdx+1) + '.jpg', 700);
        modal.remove();
        return;
      }

      var allPlayers = [];
      currentData.teams.forEach(function(team) {
        team.players.forEach(function(p) {
          if (p.name && p.name.trim() !== '') {
            var s = p.seasonStats || {};
            allPlayers.push({ name: p.name, teamName: team.name, teamShield: team.shield, key: s[type] || 0 });
          }
        });
      });
      var labelMap = { goals:'Goles', assists:'Asistencias', saves:'Salvadas', shots:'Tiros' };
      var sorted = allPlayers.sort(function(a,b) { return (b.key||0) - (a.key||0); });
      var top = sorted.slice(0, topN);
      var html = getPrintHeader(labelMap[type] + ' - Top ' + topN) + '<table style="width:100%;border-collapse:collapse;font-size:0.7rem;margin-top:0.2rem;"><thead><tr style="background:#1e1e2f;"><th style="padding:0.3rem 0.5rem;">#</th><th style="padding:0.3rem 0.5rem;text-align:left;">Jugador</th><th style="padding:0.3rem 0.5rem;text-align:left;">Equipo</th><th style="padding:0.3rem 0.5rem;text-align:right;">' + labelMap[type] + '</th></tr></thead><tbody>';
      top.forEach(function(p, i) {
        html += '<tr style="border-bottom:1px solid #2d2d44;"><td style="padding:0.2rem 0.5rem;">' + (i+1) + '</td><td style="padding:0.2rem 0.5rem;display:flex;align-items:center;gap:0.4rem;"><img src="' + (p.teamShield||'') + '" style="width:1.4rem;height:1.4rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ' + p.name + '</td><td style="padding:0.2rem 0.5rem;">' + p.teamName + '</td><td style="padding:0.2rem 0.5rem;text-align:right;font-weight:700;">' + (p.key||0) + '</td></tr>';
      });
      html += '</tbody></table>';
      html += '<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">' + currentData.name + ' · Generado desde MTM Nexus</div>';
      showPrintModal(html, 'stats_' + type + '_top' + topN + '.jpg', 700);
      modal.remove();
    };
  }

  function printBalon() {
    var topOptions = [3,5,10,15].map(function(n) { return '<option value="' + n + '">Top ' + n + '</option>'; }).join('');
    var modal = document.createElement('div');
    modal.className = 'print-modal-overlay';
    modal.innerHTML = '<div class="print-modal" style="max-width:400px;"><h3>Balón de Oro</h3><div style="margin:0.4rem 0;"><label style="font-size:0.7rem;color:#94a3b8;">Top N</label><select id="print-balon-top" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">' + topOptions + '</select></div><div class="actions"><button class="btn-cancel" onclick="this.closest(\'.print-modal-overlay\').remove()">Cancelar</button><button class="btn-download" onclick="confirmPrintBalon()">Descargar</button></div></div>';
    document.body.appendChild(modal);

    window.confirmPrintBalon = function() {
      var topN = parseInt(document.getElementById('print-balon-top').value) || 3;
      var allPlayers = [];
      currentData.teams.forEach(function(team) {
        team.players.forEach(function(p) {
          if (p.name && p.name.trim() !== '') {
            var s = p.seasonStats || { pig:0 };
            allPlayers.push({ name: p.name, teamName: team.name, teamShield: team.shield, pig: s.pig || 0 });
          }
        });
      });
      var sorted = allPlayers.sort(function(a,b) { return (b.pig||0) - (a.pig||0); });
      var top = sorted.slice(0, topN);

      var html = getPrintHeader('Balón de Oro - Top ' + topN);
      if (topN >= 3) {
        html += '<div style="display:flex;justify-content:center;align-items:flex-end;gap:1.2rem;margin:0.4rem 0;padding:0.2rem;">';
        [0,1,2].forEach(function(i) {
          if (top[i]) {
            var p = top[i];
            var displayName = p.name.length > 14 ? p.name.substring(0,12) + '…' : p.name;
            var isFirst = i === 0;
            var circleSize = isFirst ? '3.5rem' : (i === 1 ? '3rem' : '2.5rem');
            var marginTop = isFirst ? '0' : (i === 1 ? '0.5rem' : '1.2rem');
            html += '<div style="text-align:center;order:' + (isFirst ? 2 : (i === 1 ? 1 : 3)) + ';margin-top:' + marginTop + ';">';
            html += '<div style="font-size:0.6rem;color:#94a3b8;">#' + (i+1) + '</div>';
            html += '<div style="width:' + circleSize + ';height:' + circleSize + ';border-radius:50%;background:#000;border:2px solid ' + (i===0?'#facc15':i===1?'#94a3b8':'#b45309') + ';margin:0.1rem auto;overflow:hidden;display:flex;align-items:center;justify-content:center;">';
            html += '<img src="' + (p.teamShield||'') + '" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display=\'none\';this.parentElement.textContent=\'#' + (i+1) + '\';this.parentElement.style.color=\'#fff\';this.parentElement.style.fontSize=\'1rem\';" />';
            html += '</div>';
            html += '<div style="font-weight:700;font-size:0.8rem;color:#e2e8f0;">' + displayName + '</div>';
            html += '<div style="font-size:0.7rem;color:var(--neon-yellow);">' + (p.pig||0).toFixed(1) + ' PIG</div>';
            html += '<div style="font-size:0.5rem;color:#94a3b8;">' + p.teamName + '</div>';
            html += '</div>';
          }
        });
        html += '</div>';
      }
      var rest = top.slice(3);
      if (rest.length) {
        html += '<table style="width:100%;border-collapse:collapse;font-size:0.7rem;margin-top:0.2rem;"><thead><tr style="background:#1e1e2f;"><th style="padding:0.3rem 0.5rem;">#</th><th style="padding:0.3rem 0.5rem;text-align:left;">Jugador</th><th style="padding:0.3rem 0.5rem;text-align:left;">Equipo</th><th style="padding:0.3rem 0.5rem;text-align:right;">PIG</th></tr></thead><tbody>';
        rest.forEach(function(p, i) {
          html += '<tr style="border-bottom:1px solid #2d2d44;"><td style="padding:0.2rem 0.5rem;">' + (i+4) + '</td><td style="padding:0.2rem 0.5rem;display:flex;align-items:center;gap:0.4rem;"><img src="' + (p.teamShield||'') + '" style="width:1.4rem;height:1.4rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ' + p.name + '</td><td style="padding:0.2rem 0.5rem;">' + p.teamName + '</td><td style="padding:0.2rem 0.5rem;text-align:right;font-weight:700;">' + (p.pig||0).toFixed(1) + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      html += '<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">' + currentData.name + ' · Generado desde MTM Nexus</div>';
      showPrintModal(html, 'balon_oro_top' + topN + '.jpg', 700);
      modal.remove();
    };
  }

  function printEquipos() {
    var teams = currentData.teams || [];
    var options = teams.map(function(t) { return '<option value="' + t.id + '">' + t.name + '</option>'; }).join('');
    var modal = document.createElement('div');
    modal.className = 'print-modal-overlay';
    modal.innerHTML = '<div class="print-modal" style="max-width:400px;"><h3>Imprimir Equipos</h3><div style="margin:0.4rem 0;"><label style="font-size:0.7rem;color:#94a3b8;">Equipo</label><select id="print-equipo-select" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;"><option value="all">Todos</option>' + options + '</select></div><div class="actions"><button class="btn-cancel" onclick="this.closest(\'.print-modal-overlay\').remove()">Cancelar</button><button class="btn-download" onclick="confirmPrintEquipos()">Descargar</button></div></div>';
    document.body.appendChild(modal);

    window.confirmPrintEquipos = function() {
      var equipoId = document.getElementById('print-equipo-select').value;
      var html = getPrintHeader(equipoId === 'all' ? 'Todos los equipos' : (getTeamById(currentData.teams, equipoId)?.name || 'Equipo'));
      var teamsToPrint = equipoId === 'all' ? currentData.teams : [getTeamById(currentData.teams, equipoId)].filter(Boolean);
      if (!teamsToPrint.length) return alert('Equipo no encontrado.');
      teamsToPrint.forEach(function(team) {
        var titulares = team.players.filter(function(p) { return p.role === 'Titular 🌟' && p.name && p.name.trim() !== ''; });
        var suplentes = team.players.filter(function(p) { return p.role === 'Suplente 🔄' && p.name && p.name.trim() !== ''; });
        var reservas = team.players.filter(function(p) { return p.role === 'Reserva 💤' && p.name && p.name.trim() !== ''; });
        var capitan = team.players.find(function(p) { return p.isCaptain; });
        html += '<div style="margin:0.3rem 0;padding:0.4rem;border:1px solid #2d2d44;border-radius:8px;"><div style="display:flex;align-items:center;gap:0.5rem;"><img src="' + (team.shield||'') + '" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"><div><strong>' + team.name + '</strong> <span style="font-size:0.6rem;color:#94a3b8;">GLB ' + (team.glb||0) + ' · ATK ' + (team.atk||0) + ' · DEF ' + (team.def||0) + '</span>' + (capitan ? ' · Capitán: ' + capitan.name : '') + '</div></div>';
        html += '<div style="font-size:0.6rem;margin-top:0.2rem;"><span style="color:var(--neon-cyan);">Titulares:</span> ' + (titulares.map(function(p) { return p.name; }).join(', ') || 'Ninguno') + '</div>';
        html += '<div style="font-size:0.6rem;"><span style="color:var(--neon-pink);">Suplentes:</span> ' + (suplentes.map(function(p) { return p.name; }).join(', ') || 'Ninguno') + '</div>';
        html += '<div style="font-size:0.6rem;"><span style="color:#94a3b8;">Reservas:</span> ' + (reservas.map(function(p) { return p.name; }).join(', ') || 'Ninguno') + '</div>';
        html += '</div>';
      });
      html += '<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">' + currentData.name + ' · Generado desde MTM Nexus</div>';
      showPrintModal(html, 'equipos_' + equipoId + '.jpg', 700);
      modal.remove();
    };
  }

  function printMercado() {
    var modal = document.createElement('div');
    modal.className = 'print-modal-overlay';
    modal.innerHTML = '<div class="print-modal" style="max-width:450px;"><h3>Imprimir Mercado</h3><div style="margin:0.4rem 0;"><label style="font-size:0.7rem;color:#94a3b8;">Tipo</label><select id="print-mercado-tipo" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;"><option value="caros">Jugadores más caros</option><option value="equipo">Jugadores de equipo</option></select></div><div id="print-mercado-top-container"><label style="font-size:0.7rem;color:#94a3b8;">Top N</label><select id="print-mercado-top" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">' + [3,5,10,15,20].map(function(n) { return '<option value="' + n + '">Top ' + n + '</option>'; }).join('') + '<option value="custom">Personalizado</option></select><input id="print-mercado-top-custom" type="number" min="1" max="20" placeholder="Cantidad" style="display:none;width:100%;padding:0.3rem;margin-top:0.3rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;"></div><div id="print-mercado-equipo-container" style="display:none;"><label style="font-size:0.7rem;color:#94a3b8;">Equipo</label><select id="print-mercado-equipo" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">' + currentData.teams.map(function(t) { return '<option value="' + t.id + '">' + t.name + '</option>'; }).join('') + '</select><label style="font-size:0.7rem;color:#94a3b8;margin-top:0.3rem;display:block;">Orden</label><select id="print-mercado-orden" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;"><option value="precio-desc">Más caro a más barato</option><option value="precio-asc">Más barato a más caro</option></select></div><div class="actions"><button class="btn-cancel" onclick="this.closest(\'.print-modal-overlay\').remove()">Cancelar</button><button class="btn-download" onclick="confirmPrintMercado()">Descargar</button></div></div>';
    document.body.appendChild(modal);

    document.getElementById('print-mercado-tipo').addEventListener('change', function() {
      var isCaros = this.value === 'caros';
      document.getElementById('print-mercado-top-container').style.display = isCaros ? 'block' : 'none';
      document.getElementById('print-mercado-equipo-container').style.display = isCaros ? 'none' : 'block';
    });
    document.getElementById('print-mercado-top').addEventListener('change', function() {
      document.getElementById('print-mercado-top-custom').style.display = this.value === 'custom' ? 'block' : 'none';
    });

    window.confirmPrintMercado = function() {
      var tipo = document.getElementById('print-mercado-tipo').value;
      var topN = parseInt(document.getElementById('print-mercado-top').value);
      if (document.getElementById('print-mercado-top').value === 'custom') {
        topN = parseInt(document.getElementById('print-mercado-top-custom').value) || 10;
        if (topN < 1) topN = 1;
        if (topN > 20) topN = 20;
      }
      var allPlayers = [];
      currentData.teams.forEach(function(team) {
        team.players.forEach(function(p) {
          if (p.name && p.name.trim() !== '') {
            var s = p.seasonStats || { pig:0 };
            allPlayers.push({ name: p.name, teamId: team.id, teamName: team.name, teamShield: team.shield, pig: s.pig || 0, marketValue: p.marketValue || 0 });
          }
        });
      });
      (currentData.freeAgents || []).forEach(function(p) {
        if (p.name && p.name.trim() !== '') {
          var s = p.seasonStats || { pig:0 };
          allPlayers.push({ name: p.name, teamId: null, teamName: 'Agente Libre', teamShield: '', pig: s.pig || 0, marketValue: p.marketValue || 0 });
        }
      });
      var filtered = [], title = '';
      if (tipo === 'caros') {
        filtered = allPlayers.sort(function(a,b) { return (b.marketValue||0) - (a.marketValue||0); }).slice(0, topN);
        title = 'Jugadores más caros - Top ' + topN;
      } else {
        var equipoId = document.getElementById('print-mercado-equipo').value;
        var orden = document.getElementById('print-mercado-orden').value;
        filtered = allPlayers.filter(function(p) { return String(p.teamId) === String(equipoId); });
        if (orden === 'precio-desc') filtered.sort(function(a,b) { return (b.marketValue||0) - (a.marketValue||0); });
        else filtered.sort(function(a,b) { return (a.marketValue||0) - (b.marketValue||0); });
        var team = getTeamById(currentData.teams, equipoId);
        title = 'Jugadores de ' + (team ? team.name : '?');
      }
      if (!filtered.length) { alert('No hay jugadores para mostrar.'); modal.remove(); return; }
      var html = getPrintHeader(title) + '<table style="width:100%;border-collapse:collapse;font-size:0.7rem;margin-top:0.2rem;"><thead><tr style="background:#1e1e2f;"><th style="padding:0.3rem 0.5rem;">#</th><th style="padding:0.3rem 0.5rem;text-align:left;">Jugador</th><th style="padding:0.3rem 0.5rem;text-align:left;">Equipo</th><th style="padding:0.3rem 0.5rem;text-align:right;">Precio</th></tr></thead><tbody>';
      filtered.forEach(function(p, index) {
        var rank = index + 1;
        html += '<tr style="border-bottom:1px solid #2d2d44;">';
        html += '<td style="padding:0.2rem 0.5rem;text-align:center;font-weight:700;">' + rank + '</td>';
        html += '<td style="padding:0.2rem 0.5rem;display:flex;align-items:center;gap:0.4rem;"><img src="' + (p.teamShield||'') + '" style="width:1.4rem;height:1.4rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ' + p.name + '</td>';
        html += '<td style="padding:0.2rem 0.5rem;">' + p.teamName + '</td>';
        html += '<td style="padding:0.2rem 0.5rem;text-align:right;font-weight:700;">' + formatCurrency(p.marketValue||0) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
      html += '<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">' + currentData.name + ' · Generado desde MTM Nexus</div>';
      showPrintModal(html, 'mercado_' + tipo + '.jpg', 700);
      modal.remove();
    };
  }

  function printSanciones() {
    var container = document.querySelector('#section-sanciones .table-wrap');

    var clone = container.cloneNode(true);
    var html = getPrintHeader('Sanciones') + clone.outerHTML + '<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">' + currentData.name + ' · Generado desde MTM Nexus</div>';
    showPrintModal(html, 'sanciones.jpg', 900);
  }

  function printSeleccion() {
    var container = document.querySelector('#section-seleccion .card');
    if (!container) return alert('No hay selección para imprimir.');
    var clone = container.cloneNode(true);
    var html = getPrintHeader('Selección Nacional') + clone.outerHTML + '<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">' + currentData.name + ' · Generado desde MTM Nexus</div>';

    showPrintModal(html, 'amistosos.jpg', 800);
  }

  function printSalon() {
    var container = document.querySelector('#section-salon');
    if (!container) return alert('No hay salón para imprimir.');
    var clone = container.cloneNode(true);
    var btn = clone.querySelector('.print-btn');
    if (btn) btn.remove();
    var title = clone.querySelector('.section-title');
    if (title) title.innerHTML = '<span style="font-family:Montserrat,sans-serif;color:var(--neon-purple);font-weight:900;font-size:1.1rem;">Salón de la Fama</span>';
    var html = getPrintHeader('Salón de la Fama') + clone.innerHTML + '<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">' + currentData.name + ' · Generado desde MTM Nexus</div>';
    showPrintModal(html, 'salon_fama.jpg', 800);
  }

  // ==========================================
  // EVENTOS DEL SIDEBAR
  // ==========================================
  hamburgerBtn.addEventListener('click', function() {
    sidebar.classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    if (window.innerWidth <= 820) {
      if (!sidebar.contains(e.target) && e.target !== hamburgerBtn && !hamburgerBtn.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    }
  });

  // ==========================================
  // INICIO
  // ==========================================
  loadAllData();
</script>
