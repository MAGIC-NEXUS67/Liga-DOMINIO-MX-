<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>MTM · Visualizador de Torneo</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,900&family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ========================================
       VARIABLES GLOBALES (tema por defecto)
       ======================================== */
    :root {
      --color-bg: #0a0a0f;
      --color-surface: #14141e;
      --color-surface-hover: #1e1e2f;
      --color-text: #e2e8f0;
      --color-text-muted: #94a3b8;
      --color-border: #2d2d44;
      --neon-purple: #a855f7;
      --neon-cyan: #22d3ee;
      --neon-pink: #ec4899;
      --neon-green: #4ade80;
      --neon-yellow: #facc15;
      --neon-red: #f87171;
      --radius: 12px;
      --font-size-base: 14px;
      --spacing-base: 0.8rem;
      --density-scale: 1;
    }

    /* Tema DOMINIO MX */
    [data-theme="dominio"] {
      --color-bg: #0a0a0a;
      --color-surface: #111111;
      --color-surface-hover: #1a1a1a;
      --color-text: #e8e8e8;
      --color-text-muted: #888888;
      --color-border: #2a2a2a;
      --neon-purple: #00a84d;
      --neon-cyan: #00c853;
      --neon-pink: #d32f2f;
      --neon-green: #2e7d32;
      --neon-yellow: #ffc107;
      --neon-red: #d32f2f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: var(--font-size-base);
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

    /* ========================================
       LAYOUT PRINCIPAL
       ======================================== */
    .app {
      display: flex;
      min-height: 100vh;
      background: var(--color-bg);
    }

    /* SIDEBAR (PC) */
    .sidebar {
      width: 220px;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(8px);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease, background 0.3s;
      z-index: 100;
    }
    [data-theme="dominio"] .sidebar {
      background: rgba(0, 0, 0, 0.97);
    }

    .sidebar-brand {
      padding: 1.2rem 1rem 0.8rem;
      border-bottom: 1px solid var(--color-border);
      text-align: center;
      transition: border-color 0.3s;
    }
    .sidebar-brand h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.5px;
      transition: color 0.3s;
    }
    .sidebar-brand h1 .mtm { color: var(--neon-purple); }
    .sidebar-brand h1 .mtm span { color: var(--neon-purple); }
    [data-theme="dominio"] .sidebar-brand h1 .mtm { color: #00a84d; }
    [data-theme="dominio"] .sidebar-brand h1 .mtm .dom { color: #ffffff; }
    [data-theme="dominio"] .sidebar-brand h1 .mtm .mx { color: #d32f2f; }

    .sidebar-brand small {
      display: block;
      font-size: 0.6rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
      transition: color 0.3s;
    }
    [data-theme="dominio"] .sidebar-brand small {
      color: #66bb6a;
    }

    .sidebar-nav {
      flex: 1;
      padding: 0.5rem 0.3rem;
      overflow-y: auto;
    }
    .sidebar-nav .nav-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      margin-bottom: 2px;
    }
    .sidebar-nav .nav-item:hover {
      background: var(--color-surface-hover);
      color: #fff;
    }
    .sidebar-nav .nav-item.active {
      background: var(--color-surface-hover);
      border-left-color: var(--neon-purple);
      color: #fff;
    }
    .sidebar-nav .nav-item i {
      width: 1.2rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .sidebar-nav .nav-divider {
      border-top: 1px solid var(--color-border);
      margin: 0.6rem 0.5rem;
      padding: 0.4rem 0 0.2rem;
    }
    .sidebar-nav .nav-divider span {
      font-size: 0.55rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 700;
      padding: 0 0.5rem;
    }

    /* Footer del sidebar con botón de ajustes */
    .sidebar-footer {
      padding: 0.8rem 0.6rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: center;
      transition: border-color 0.3s;
    }
    .sidebar-footer .settings-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.4rem 1rem;
      color: var(--color-text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      justify-content: center;
    }
    .sidebar-footer .settings-btn:hover {
      background: var(--color-surface-hover);
      color: #fff;
      border-color: var(--neon-purple);
    }
    .sidebar-footer .settings-btn i {
      font-size: 0.9rem;
    }
    [data-theme="dominio"] .sidebar-footer .settings-btn:hover {
      border-color: #00a84d;
      color: #00a84d;
    }

    /* CONTENIDO PRINCIPAL */
    .main {
      flex: 1;
      padding: 1.2rem 2rem 2rem;
      overflow-y: auto;
      max-height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      transition: padding 0.3s;
    }

    /* ========================================
       DENSIDADES
       ======================================== */
    [data-density="compact"] {
      --font-size-base: 12px;
      --spacing-base: 0.5rem;
    }
    [data-density="compact"] .main { padding: 0.6rem 1rem 1.5rem; }
    [data-density="compact"] .card { padding: 0.5rem; }
    [data-density="compact"] .section-title { font-size: 1rem; }
    [data-density="compact"] table { font-size: 0.65rem; }

    [data-density="spacious"] {
      --font-size-base: 16px;
      --spacing-base: 1.2rem;
    }
    [data-density="spacious"] .main { padding: 2rem 3rem 3rem; }
    [data-density="spacious"] .card { padding: 1.5rem; }
    [data-density="spacious"] .section-title { font-size: 1.8rem; }
    [data-density="spacious"] table { font-size: 0.9rem; }
    [data-density="spacious"] thead th { padding: 0.8rem 1rem; }
    [data-density="spacious"] tbody td { padding: 0.8rem 1rem; }

    /* ========================================
       BOTÓN HAMBURGUESA (móvil)
       ======================================== */
    .hamburger {
      display: none;
      position: fixed;
      top: 0.8rem;
      left: 0.8rem;
      z-index: 200;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.5rem 0.7rem;
      color: var(--color-text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .hamburger:hover { background: var(--color-surface-hover); }

    /* ========================================
       SECCIONES
       ======================================== */
    .section {
      display: none;
      animation: fadeSlide 0.3s ease;
    }
    .section.active { display: block; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.3px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      transition: color 0.3s;
    }
    .section-title span { color: var(--neon-purple); }
    .section-title .print-btn {
      margin-left: auto;
      font-size: 0.7rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.3rem 0.8rem;
      color: var(--color-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: 0.2s;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }
    .section-title .print-btn:hover {
      background: var(--neon-purple);
      color: #000;
      border-color: var(--neon-purple);
    }

    /* CARDS */
    .card {
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.8rem 1rem;
      margin-bottom: 0.8rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: border-color 0.2s, background 0.3s;
    }
    .card:hover { border-color: var(--neon-purple); }

    .card-header {
      font-weight: 700;
      color: var(--color-text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header .expand-btn {
      font-size: 0.6rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      padding: 0.1rem 0.6rem;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: 0.2s;
    }
    .card-header .expand-btn:hover {
      background: var(--neon-purple);
      color: #000;
    }

    /* TABLAS */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      background: rgba(0,0,0,0.2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    thead {
      background: rgba(30, 30, 47, 0.6);
      border-bottom: 1px solid var(--color-border);
    }
    thead th {
      padding: 0.6rem 0.8rem;
      text-align: left;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      font-size: 0.65rem;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid rgba(45, 45, 68, 0.25);
      transition: background 0.15s;
    }
    tbody tr:hover { background: var(--color-surface-hover); }
    tbody td {
      padding: 0.5rem 0.8rem;
      vertical-align: middle;
    }

    /* POWER BADGES */
    .power-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 0.05rem 0.5rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
      margin-right: 0.2rem;
    }
    .power-badge.atk { color: var(--neon-cyan); background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.25); }
    .power-badge.def { color: var(--neon-pink); background: rgba(236,72,153,0.12); border: 1px solid rgba(236,72,153,0.25); }
    .power-badge.glb { color: var(--neon-yellow); background: rgba(250,204,21,0.12); border: 1px solid rgba(250,204,21,0.25); }

    .row-clasif { border-left: 4px solid var(--neon-green); }
    .row-descenso { border-left: 4px solid var(--neon-red); }
    .row-ascenso { border-left: 4px solid var(--neon-yellow); }

    /* JUGADORES */
    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.6rem;
      padding: 0.2rem 0;
    }
    .player-tag {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 0.1rem 0.6rem;
      font-size: 0.75rem;
      border: 1px solid var(--color-border);
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      white-space: nowrap;
    }
    .player-tag.captain { border-color: var(--neon-yellow); color: var(--neon-yellow); }
    .player-tag.titular { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .player-tag.suplente { border-color: var(--neon-pink); color: var(--neon-pink); }
    .player-tag.reserva { border-color: var(--color-border); color: var(--color-text-muted); }

    /* FILTROS */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      align-items: center;
    }
    .filters select, .filters input {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.35rem 0.7rem;
      color: var(--color-text);
      font-size: 0.75rem;
      outline: none;
    }
    .filters select:focus, .filters input:focus { border-color: var(--neon-purple); }

    /* PÓDIUM mejorado */
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 1.5rem;
      padding: 1rem 0;
      min-height: 150px;
    }
    .podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--color-surface);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 0.6rem 1.2rem;
      min-width: 120px;
      max-width: 160px;
      border-top: 3px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-right: 1px solid var(--color-border);
      transition: 0.2s;
    }
    .podium-item.first {
      height: 120px;
      border-color: var(--neon-yellow);
      background: rgba(250,204,21,0.08);
      min-width: 140px;
    }
    .podium-item.second {
      height: 95px;
      border-color: #94a3b8;
      background: rgba(148,163,184,0.06);
    }
    .podium-item.third {
      height: 70px;
      border-color: #b45309;
      background: rgba(180,83,9,0.06);
    }
    .podium-item .pos {
      font-weight: 900;
      font-size: 0.7rem;
      color: var(--color-text-muted);
    }
    .podium-item .shield {
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      background: #000;
      border: 1px solid var(--color-border);
      object-fit: contain;
      margin: 0.2rem 0;
    }
    .podium-item .name {
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      color: #fff;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }
    .podium-item .name-wrap {
      white-space: normal;
      word-break: break-word;
      line-height: 1.2;
    }
    .podium-item .value {
      font-weight: 900;
      font-size: 1rem;
      color: var(--neon-yellow);
      margin-top: auto;
    }
    .podium-item .sub {
      font-size: 0.6rem;
      color: var(--color-text-muted);
    }

    /* MVPs */
    .mvp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
    }
    .mvp-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.6rem 1rem;
      min-width: 130px;
      flex: 1 0 auto;
      max-width: 200px;
      text-align: center;
    }
    .mvp-card .label {
      font-size: 0.55rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .mvp-card .name {
      font-weight: 700;
      font-size: 0.85rem;
    }
    .mvp-card .stat {
      font-size: 0.7rem;
      color: var(--neon-yellow);
    }

    .jornada-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.6rem;
    }
    .jornada-nav button {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      padding: 0.2rem 0.7rem;
      font-size: 0.65rem;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: 0.2s;
    }
    .jornada-nav button:hover {
      background: var(--color-surface-hover);
      color: #fff;
    }
    .jornada-nav button.active {
      background: var(--neon-purple);
      color: #000;
      border-color: var(--neon-purple);
    }

    .shield-sm {
      width: 1.6rem;
      height: 1.6rem;
      object-fit: contain;
      background: #000;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    /* MODAL DE IMPRESIÓN / AJUSTES */
    .print-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }
    .print-modal {
      background: var(--color-surface);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      max-width: 95vw;
      max-height: 90vh;
      width: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: background 0.3s;
    }
    .print-modal h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      color: var(--neon-purple);
    }
    .print-modal .preview {
      background: #0a0a0f;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      padding: 0.5rem;
      overflow: auto;
      max-height: 55vh;
      min-height: 200px;
    }
    .print-modal .preview img {
      max-width: 100%;
      border-radius: 4px;
    }
    .print-modal .actions {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
    }
    .print-modal .actions button {
      padding: 0.4rem 1.2rem;
      border-radius: var(--radius);
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.8rem;
    }
    .print-modal .actions .btn-cancel {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text);
    }
    .print-modal .actions .btn-cancel:hover {
      background: var(--color-surface-hover);
    }
    .print-modal .actions .btn-download {
      background: var(--neon-purple);
      color: #000;
    }
    .print-modal .actions .btn-download:hover {
      opacity: 0.85;
    }

    /* MODAL DE AJUSTES */
    .settings-modal {
      max-width: 600px;
    }
    .settings-modal .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .settings-modal .tabs button {
      background: transparent;
      border: none;
      padding: 0.4rem 1rem;
      color: var(--color-text-muted);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: 0.2s;
    }
    .settings-modal .tabs button:hover {
      background: var(--color-surface-hover);
      color: #fff;
    }
    .settings-modal .tabs button.active {
      background: var(--neon-purple);
      color: #000;
    }
    .settings-modal .tab-content {
      display: none;
    }
    .settings-modal .tab-content.active {
      display: block;
    }
    .settings-modal .tab-content label {
      display: block;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      margin-bottom: 0.3rem;
      font-weight: 700;
    }
    .settings-modal .tab-content .option-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }
    .settings-modal .tab-content .option-group button {
      padding: 0.3rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.75rem;
    }
    .settings-modal .tab-content .option-group button:hover {
      background: var(--color-surface-hover);
    }
    .settings-modal .tab-content .option-group button.active {
      background: var(--neon-purple);
      color: #000;
      border-color: var(--neon-purple);
    }
    .settings-modal .theme-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1rem;
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 0.5rem;
    }
    .settings-modal .theme-card:hover {
      border-color: var(--neon-purple);
    }
    .settings-modal .theme-card.active {
      border-color: var(--neon-purple);
      background: rgba(168,85,247,0.08);
    }
    .settings-modal .theme-card .preview {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid var(--color-border);
    }
    .settings-modal .theme-card .info .name {
      font-weight: 700;
      font-size: 0.9rem;
    }
    .settings-modal .theme-card .info .desc {
      font-size: 0.7rem;
      color: var(--color-text-muted);
    }

    /* RESPONSIVE */
    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        transform: translateX(-100%);
        width: 260px;
        height: 100vh;
        box-shadow: 4px 0 20px rgba(0,0,0,0.6);
        border-right: 1px solid var(--color-border);
      }
      .sidebar.open { transform: translateX(0); }
      .hamburger { display: block; }
      .main {
        padding: 0.8rem 0.8rem 1.5rem;
        margin-top: 3rem;
        max-width: 100%;
      }
      .section-title { font-size: 1.1rem; }
      table { font-size: 0.7rem; }
      thead th, tbody td { padding: 0.35rem 0.5rem; }
      .podium-item { min-width: 80px; padding: 0.4rem 0.6rem; }
      .podium-item.first { min-width: 100px; height: 95px; }
      .podium-item.second { height: 75px; }
      .podium-item.third { height: 55px; }
      .podium-item .name { font-size: 0.7rem; max-width: 80px; }
      .podium-item .shield { width: 2rem; height: 2rem; }
      [data-density="spacious"] .main { padding: 0.8rem; }
      [data-density="spacious"] table { font-size: 0.7rem; }
      [data-density="spacious"] .section-title { font-size: 1.1rem; }
      .settings-modal { max-width: 100%; }
    }

    @media (max-width: 480px) {
      .main { padding: 0.5rem 0.5rem 1rem; }
      .card { padding: 0.5rem; }
      .filters select, .filters input { font-size: 0.6rem; padding: 0.2rem 0.4rem; }
      .podium-item { min-width: 60px; padding: 0.2rem 0.4rem; }
      .podium-item.first { min-width: 75px; height: 80px; }
      .podium-item.second { height: 60px; }
      .podium-item.third { height: 45px; }
      .podium-item .name { font-size: 0.6rem; max-width: 60px; }
      .player-tag { font-size: 0.6rem; }
    }

    /* UTILIDADES */
    .text-muted { color: var(--color-text-muted); }
    .text-neon-cyan { color: var(--neon-cyan); }
    .text-neon-pink { color: var(--neon-pink); }
    .text-neon-green { color: var(--neon-green); }
    .text-neon-yellow { color: var(--neon-yellow); }
    .text-neon-red { color: var(--neon-red); }
    .text-neon-purple { color: var(--neon-purple); }

    .flex-center { display: flex; align-items: center; gap: 0.4rem; }
    .gap-1 { gap: 0.3rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .fw-700 { font-weight: 700; }

    .empty-state {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }
    .empty-state i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
      opacity: 0.5;
    }

    .match-clickable {
      cursor: pointer;
      transition: background 0.15s;
    }
    .match-clickable:hover {
      background: var(--color-surface-hover);
    }

    /* Imagen de vista previa en impresión */
    .print-preview-img {
      max-width: 100%;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1 class="mtm" id="brandTitle">MTM <span>NEXUS</span></h1>
      <small id="brandSub">Visualizador de Torneo</small>
    </div>
    <nav class="sidebar-nav" id="mainNav"></nav>
    <div class="sidebar-footer">
      <button class="settings-btn" onclick="openSettings()">
        <i class="fas fa-cog"></i> Ajustes
      </button>
    </div>
  </aside>

  <!-- BOTÓN HAMBURGUESA -->
  <button class="hamburger" id="hamburgerBtn" aria-label="Menú">
    <i class="fas fa-bars"></i>
  </button>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main" id="mainContent">
    <div id="sectionsContainer"></div>
  </main>

</div>

<script>
  // ==========================================
  // CONFIGURACIÓN DE MENÚS
  // ==========================================
  const MENU_ITEMS = [
    { id: 'tabla', label: 'Tabla General', icon: 'fa-table' },
    { id: 'media', label: 'Tabla de Media', icon: 'fa-chart-simple' },
    { id: 'jornadas', label: 'Jornadas', icon: 'fa-calendar-day' },
    { id: 'playoffs', label: 'PlayOffs', icon: 'fa-sitemap' },
    { id: 'stats', label: 'Stats', icon: 'fa-chart-bar' },
    { id: 'balon', label: 'Balón de Oro', icon: 'fa-trophy' },
    { id: 'equipos', label: 'Equipos', icon: 'fa-users' },
    { id: 'mercado', label: 'Mercado', icon: 'fa-store' },
    { id: 'economia', label: 'Mov. Económicos', icon: 'fa-coins' },
    { id: 'sanciones', label: 'Sanciones', icon: 'fa-gavel' },
    { id: 'seleccion', label: 'Selección Nacional', icon: 'fa-flag' },
    { id: 'amistosos', label: 'Partidos Amistosos', icon: 'fa-handshake' },
    { id: 'salon', label: 'Salón de la Fama', icon: 'fa-medal' }
  ];

  let data = null;
  let currentSection = 'tabla';
  const statsLimits = { goals: 10, assists: 10, saves: 10, shots: 10 };
  const MAX_STATS_LIMIT = 50;
  let currentMvpJornada = 0;

  const sidebar = document.getElementById('sidebar');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mainNav = document.getElementById('mainNav');
  const sectionsContainer = document.getElementById('sectionsContainer');

  // ==========================================
  // UTILIDADES
  // ==========================================
  function formatCurrency(amount) {
    if (amount >= 1e6) return '$' + (amount / 1e6).toFixed(1) + 'M';
    if (amount >= 1e3) return '$' + (amount / 1e3).toFixed(0) + 'K';
    return '$' + amount.toFixed(0);
  }

  function getRankColor(rank) {
    const colors = {
      'Bronce': '#cd7f32', 'Plata': '#c0c0c0', 'Oro': '#ffd700',
      'Platino': '#e5e4e2', 'Diamante': '#b9f2ff', 'Campeón': '#ff6b6b',
      'Gran Campeón': '#ff4757', 'SSL': '#ff4757'
    };
    return colors[rank] || '#fff';
  }

  function getTeamById(teams, id) {
    return teams.find(t => t.id === id);
  }

  // ==========================================
  // TEMAS Y DENSIDAD
  // ==========================================
  let currentTheme = 'mtm';
  let currentDensity = 'normal';

  function applyTheme(theme) {
    currentTheme = theme;
    if (theme === 'dominio') {
      document.documentElement.setAttribute('data-theme', 'dominio');
      document.getElementById('brandTitle').innerHTML = 'Liga <span class="dom">DOMINIO</span> <span class="mx">MX</span>';
      document.getElementById('brandSub').textContent = 'COMPITE, DOMINA Y REPITE';
    } else {
      document.documentElement.removeAttribute('data-theme');
      document.getElementById('brandTitle').innerHTML = 'MTM <span>NEXUS</span>';
      document.getElementById('brandSub').textContent = 'Visualizador de Torneo';
    }
    localStorage.setItem('mtm_theme', theme);
  }

  function applyDensity(density) {
    currentDensity = density;
    document.documentElement.setAttribute('data-density', density);
    localStorage.setItem('mtm_density', density);
  }

  // Cargar preferencias guardadas
  function loadPreferences() {
    const savedTheme = localStorage.getItem('mtm_theme');
    if (savedTheme) applyTheme(savedTheme);
    const savedDensity = localStorage.getItem('mtm_density');
    if (savedDensity) applyDensity(savedDensity);
  }

  // ==========================================
  // AJUSTES (modal)
  // ==========================================
  function openSettings() {
    const overlay = document.createElement('div');
    overlay.className = 'print-modal-overlay';
    overlay.innerHTML = `
      <div class="print-modal settings-modal">
        <h3><i class="fas fa-cog"></i> Ajustes</h3>
        <div class="tabs">
          <button class="active" data-tab="personalizacion">Personalización</button>
          <button data-tab="temas">Temas</button>
        </div>
        <div id="settings-personalizacion" class="tab-content active">
          <label>Densidad (solo PC)</label>
          <div class="option-group">
            <button data-density="compact" class="${currentDensity === 'compact' ? 'active' : ''}">Compacto</button>
            <button data-density="normal" class="${currentDensity === 'normal' ? 'active' : ''}">Normal</button>
            <button data-density="spacious" class="${currentDensity === 'spacious' ? 'active' : ''}">Espacioso</button>
          </div>
          <p style="font-size:0.7rem;color:var(--color-text-muted);">Ajusta el espaciado y tamaño de los elementos en pantalla.</p>
        </div>
        <div id="settings-temas" class="tab-content">
          <label>Selecciona un tema</label>
          <div class="theme-card ${currentTheme === 'mtm' ? 'active' : ''}" data-theme="mtm">
            <div class="preview" style="background:linear-gradient(135deg,#0a0a0f,#14141e);border-color:#a855f7;"></div>
            <div class="info">
              <div class="name">MTM Visualizador de Torneo</div>
              <div class="desc">Morado / Neón · Estilo cyberpunk</div>
            </div>
          </div>
          <div class="theme-card ${currentTheme === 'dominio' ? 'active' : ''}" data-theme="dominio">
            <div class="preview" style="background:linear-gradient(135deg,#0a0a0a,#1a1a1a);border-color:#00a84d;"></div>
            <div class="info">
              <div class="name">Liga DOMINIO MX</div>
              <div class="desc">Verde · Blanco · Rojo · Fondo negro intenso</div>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cerrar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    // Tabs
    overlay.querySelectorAll('.tabs button').forEach(btn => {
      btn.addEventListener('click', function() {
        overlay.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const tab = this.dataset.tab;
        overlay.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById('settings-' + tab).classList.add('active');
      });
    });

    // Densidad
    overlay.querySelectorAll('[data-density]').forEach(btn => {
      btn.addEventListener('click', function() {
        overlay.querySelectorAll('[data-density]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        applyDensity(this.dataset.density);
      });
    });

    // Temas
    overlay.querySelectorAll('.theme-card').forEach(card => {
      card.addEventListener('click', function() {
        overlay.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        applyTheme(this.dataset.theme);
      });
    });
  }

  // ==========================================
  // FUNCIONES DE IMPRESIÓN CON VISTA PREVIA
  // ==========================================
  function showPrintModal(htmlContent, filename, width = 800, compact = true) {
    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'fixed';
    tempDiv.style.left = '-9999px';
    tempDiv.style.top = '0';
    tempDiv.style.width = width + 'px';
    tempDiv.style.background = '#0a0a0f';
    tempDiv.style.padding = '1rem';
    tempDiv.style.color = '#e2e8f0';
    tempDiv.style.fontFamily = 'Inter, system-ui, sans-serif';
    tempDiv.style.borderRadius = '8px';
    tempDiv.innerHTML = htmlContent;
    document.body.appendChild(tempDiv);

    html2canvas(tempDiv, {
      scale: 2,
      backgroundColor: '#0a0a0f',
      useCORS: true,
      logging: false,
      windowHeight: tempDiv.scrollHeight,
      windowWidth: tempDiv.scrollWidth
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      tempDiv.remove();

      const overlay = document.createElement('div');
      overlay.className = 'print-modal-overlay';
      overlay.innerHTML = `
        <div class="print-modal">
          <h3><i class="fas fa-print"></i> Vista previa</h3>
          <div class="preview">
            <img src="${imgData}" class="print-preview-img" alt="Vista previa" />
          </div>
          <div class="actions">
            <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cancelar</button>
            <button class="btn-download" onclick="downloadImage('${imgData}', '${filename}'); this.closest('.print-modal-overlay').remove();">Descargar</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }).catch(err => {
      tempDiv.remove();
      alert('Error al generar vista previa: ' + err.message);
    });
  }

  function downloadImage(dataUrl, filename) {
    const link = document.createElement('a');
    link.download = filename;
    link.href = dataUrl;
    link.click();
  }

  // ==========================================
  // RENDERIZADO DE SECCIONES
  // ==========================================

  // ---------- TABLA GENERAL ----------
  function renderTabla(torneo) {
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay equipos.</div>';
    const teams = [...torneo.teams];
    teams.sort((a,b) => b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf);
    const lig = torneo.tableConfig?.liguilla ?? 8;
    const des = torneo.tableConfig?.descenso ?? 2;
    const asc = torneo.tableConfig?.ascenso ?? 2;

    let html = `<div class="table-wrap" id="tabla-general-container"><table><thead><tr><th>#</th><th>Equipo</th><th>Pts</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th></tr></thead><tbody>`;
    teams.forEach((tm, i) => {
      let rowClass = '';
      if (i < asc && torneo.linkedTournamentId) rowClass = 'row-ascenso';
      else if (i < lig) rowClass = 'row-clasif';
      else if (i >= teams.length - des && des > 0) rowClass = 'row-descenso';
      const dg = (tm.gf||0) - (tm.gc||0);
      html += `<tr class="${rowClass}"><td>${i+1}</td><td class="flex-center"><img src="${tm.shield||''}" class="shield-sm" alt=""> ${tm.name}</td><td><strong>${tm.pts||0}</strong></td><td>${tm.pj||0}</td><td>${tm.pg||0}</td><td>${tm.pe||0}</td><td>${tm.pp||0}</td><td>${tm.gf||0}</td><td>${tm.gc||0}</td><td>${dg}</td></tr>`;
    });
    html += '</tbody></table></div>';
    let legend = '<div class="flex-center gap-1" style="font-size:0.65rem;margin-top:0.4rem;">';
    if (lig > 0) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-green);border-radius:2px;"></span> Clasificación</span>`;
    if (asc > 0 && torneo.linkedTournamentId) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-yellow);border-radius:2px;"></span> Ascenso</span>`;
    if (des > 0) legend += `<span class="flex-center"><span style="display:inline-block;width:10px;height:10px;background:var(--neon-red);border-radius:2px;"></span> Descenso</span>`;
    legend += '</div>';
    return html + legend;
  }

  // ---------- TABLA DE MEDIA ----------
  function renderMedia(torneo) {
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>No hay equipos.</div>';
    const sorted = [...torneo.teams].sort((a,b) => (b.glb||0) - (a.glb||0));
    let html = `<div class="table-wrap" id="tabla-media-container"><table><thead><tr><th>#</th><th>Equipo</th><th>ATK</th><th>DEF</th><th>GLB</th></tr></thead><tbody>`;
    sorted.forEach((tm, i) => {
      html += `<tr><td>${i+1}</td><td class="flex-center"><img src="${tm.shield||''}" class="shield-sm"> ${tm.name}</td><td><span class="power-badge atk">${tm.atk||0}</span></td><td><span class="power-badge def">${tm.def||0}</span></td><td><span class="power-badge glb">${tm.glb||0}</span></td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------- JORNADAS ----------
  function renderJornadas(torneo) {
    if (!torneo.rounds || !torneo.rounds.length) return '<div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i>No hay jornadas generadas.</div>';
    let html = '';
    torneo.rounds.forEach((round, idx) => {
      html += `<div class="card"><div class="card-header">Jornada ${idx+1}</div>`;
      if (!round.length) {
        html += '<div class="text-muted" style="font-size:0.8rem;">Sin partidos</div>';
      } else {
        html += `<div class="table-wrap"><table><thead><tr><th>Local</th><th>Resultado</th><th>Visitante</th></tr></thead><tbody>`;
        round.forEach(m => {
          const h = getTeamById(torneo.teams, m.h);
          const a = getTeamById(torneo.teams, m.a);
          const hName = h ? h.name : '???';
          const aName = a ? a.name : '???';
          const hShield = h ? h.shield : '';
          const aShield = a ? a.shield : '';
          const played = m.played || false;
          const score = played ? `${m.sH} - ${m.sA}` : 'vs';
          const clickable = played ? `class="match-clickable" onclick="showMatchStats('${m.id}')"` : '';
          html += `
            <tr ${clickable}>
              <td class="flex-center"><img src="${hShield}" class="shield-sm"> ${hName}</td>
              <td style="font-weight:700;text-align:center;">${score}</td>
              <td class="flex-center" style="justify-content:flex-end;">${aName} <img src="${aShield}" class="shield-sm"></td>
            </tr>
          `;
        });
        html += '</tbody></table></div>';
      }
      html += '</div>';
    });
    return html;
  }

  // ---------- MOSTRAR STATS DE PARTIDO ----------
  window.showMatchStats = function(matchId) {
    if (!data) return;
    let match = null;
    for (let round of (data.rounds || [])) {
      const found = round.find(m => m.id === matchId);
      if (found) { match = found; break; }
    }
    if (!match) {
      for (let fm of (data.friendlyMatches || [])) {
        if (fm.id === matchId) { match = fm; break; }
      }
    }
    if (!match || !match.played || !match.stats) {
      alert('Este partido no tiene estadísticas detalladas.');
      return;
    }

    const h = getTeamById(data.teams, match.h);
    const a = getTeamById(data.teams, match.a);
    const hName = h ? h.name : 'Desconocido';
    const aName = a ? a.name : 'Desconocido';
    const hShield = h ? h.shield : '';
    const aShield = a ? a.shield : '';

    const hStats = match.stats.filter(s => s.tId === match.h);
    const aStats = match.stats.filter(s => s.tId === match.a);

    function renderPlayerStats(team, statsArray) {
      if (!team || !statsArray.length) return '<div class="text-muted" style="font-size:0.7rem;">Sin estadísticas</div>';
      let html = `<div style="font-size:0.7rem;margin-top:0.2rem;"><table style="width:100%;font-size:0.7rem;border-collapse:collapse;"><thead><tr style="border-bottom:1px solid var(--color-border);"><th>Jugador</th><th>G</th><th>A</th><th>S</th><th>T</th></tr></thead><tbody>`;
      statsArray.forEach(st => {
        const p = team.players.find(x => x.id === st.pId);
        const name = p ? p.name : '?';
        html += `<tr><td>${name}</td><td>${st.g||0}</td><td>${st.a||0}</td><td>${st.s||0}</td><td>${st.t||0}</td></tr>`;
      });
      html += '</tbody></table></div>';
      return html;
    }

    const modalHtml = `
      <div class="print-modal-overlay" onclick="if(event.target===this) this.remove()">
        <div class="print-modal" style="max-width:650px;">
          <h3>📊 Estadísticas del partido</h3>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:1rem;margin-bottom:0.5rem;">
            <span class="flex-center"><img src="${hShield}" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"> ${hName}</span>
            <span style="font-weight:900;font-size:1.3rem;">${match.sH} - ${match.sA}</span>
            <span class="flex-center">${aName} <img src="${aShield}" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"></span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div><div class="card-header" style="font-size:0.7rem;">${hName}</div>${renderPlayerStats(h, hStats)}</div>
            <div><div class="card-header" style="font-size:0.7rem;">${aName}</div>${renderPlayerStats(a, aStats)}</div>
          </div>
          <div class="actions" style="margin-top:0.5rem;">
            <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cerrar</button>
            <button class="btn-download" onclick="printMatchStats('${matchId}')">Imprimir</button>
          </div>
        </div>
      </div>
    `;
    const overlay = document.createElement('div');
    overlay.innerHTML = modalHtml;
    document.body.appendChild(overlay);
  };

  window.printMatchStats = function(matchId) {
    const match = (() => {
      for (let round of (data.rounds || [])) {
        const found = round.find(m => m.id === matchId);
        if (found) return found;
      }
      for (let fm of (data.friendlyMatches || [])) {
        if (fm.id === matchId) return fm;
      }
      return null;
    })();
    if (!match) return alert('Partido no encontrado.');

    const h = getTeamById(data.teams, match.h);
    const a = getTeamById(data.teams, match.a);
    const hName = h ? h.name : 'Desconocido';
    const aName = a ? a.name : 'Desconocido';
    const hShield = h ? h.shield : '';
    const aShield = a ? a.shield : '';

    function renderStats(team, statsArray) {
      if (!team || !statsArray.length) return '<div class="text-muted">Sin estadísticas</div>';
      let html = '<table style="width:100%;font-size:0.7rem;border-collapse:collapse;margin-top:0.2rem;"><thead><tr style="border-bottom:1px solid #2d2d44;"><th>Jugador</th><th>G</th><th>A</th><th>S</th><th>T</th></tr></thead><tbody>';
      statsArray.forEach(st => {
        const p = team.players.find(x => x.id === st.pId);
        const name = p ? p.name : '?';
        html += `<tr><td>${name}</td><td>${st.g||0}</td><td>${st.a||0}</td><td>${st.s||0}</td><td>${st.t||0}</td></tr>`;
      });
      html += '</tbody></table>';
      return html;
    }

    const htmlContent = `
      <h2 style="font-family:Montserrat,sans-serif;color:var(--neon-purple);font-size:1.2rem;">Estadísticas del partido</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.95rem;margin:0.4rem 0;">
        <span class="flex-center"><img src="${hShield}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ${hName}</span>
        <span style="font-weight:900;font-size:1.2rem;">${match.sH} - ${match.sA}</span>
        <span class="flex-center">${aName} <img src="${aShield}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"></span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;">
        <div><div style="font-weight:700;color:var(--neon-cyan);font-size:0.8rem;">${hName}</div>${renderStats(h, match.stats.filter(s=>s.tId===match.h))}</div>
        <div><div style="font-weight:700;color:var(--neon-pink);font-size:0.8rem;">${aName}</div>${renderStats(a, match.stats.filter(s=>s.tId===match.a))}</div>
      </div>
      <div style="margin-top:0.5rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>
    `;
    showPrintModal(htmlContent, `partido_${matchId}.jpg`, 700);
    document.querySelector('.print-modal-overlay')?.remove();
  };

  // ---------- PLAYOFFS ----------
  function renderPlayoffs(torneo) {
    if (!torneo.playoffs || !torneo.playoffs.rounds || !torneo.playoffs.rounds.length) {
      return '<div class="empty-state"><i class="fa-solid fa-clock"></i>Próximamente</div>';
    }
    const rounds = torneo.playoffs.rounds;
    let html = '<div style="display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;">';
    rounds.forEach((r, ri) => {
      html += `<div style="display:flex;flex-direction:column;gap:0.4rem;min-width:130px;">`;
      html += `<div class="card-header" style="text-align:center;">${ri === 0 ? 'Cuartos' : ri === 1 ? 'Semis' : ri === 2 ? 'Final' : `Ronda ${ri+1}`}</div>`;
      r.forEach(m => {
        const h = getTeamById(torneo.teams, m.h);
        const a = getTeamById(torneo.teams, m.a);
        const hName = h ? h.name : 'TBD';
        const aName = a ? a.name : 'TBD';
        const hShield = h ? h.shield : '';
        const aShield = a ? a.shield : '';
        const played = m.played || false;
        const score = played ? `${m.sH} - ${m.sA}` : 'vs';
        html += `
          <div class="card" style="padding:0.4rem 0.6rem;margin:0;min-width:110px;">
            <div class="flex-center" style="justify-content:space-between;font-size:0.7rem;">
              <span class="flex-center"><img src="${hShield}" class="shield-sm" style="width:1.2rem;height:1.2rem;"> ${hName}</span>
              <span style="font-weight:700;">${score}</span>
              <span class="flex-center">${aName} <img src="${aShield}" class="shield-sm" style="width:1.2rem;height:1.2rem;"></span>
            </div>
          </div>
        `;
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ---------- STATS ----------
  function renderStats(torneo) {
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || {};
          allPlayers.push({
            ...p,
            teamName: team.name,
            teamShield: team.shield,
            goals: s.goals || 0,
            assists: s.assists || 0,
            saves: s.saves || 0,
            shots: s.shots || 0,
            pig: s.pig || 0,
            matchesPlayed: s.matchesPlayed || 0
          });
        }
      });
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>No hay jugadores con estadísticas.</div>';

    function makeTable(title, key, label, containerId) {
      const sorted = [...allPlayers].sort((a,b) => (b[key]||0) - (a[key]||0));
      const limit = statsLimits[key] || 10;
      const visible = sorted.slice(0, limit);
      const hasMore = limit < sorted.length && limit < MAX_STATS_LIMIT;
      let html = `<div class="card"><div class="card-header">${title}${hasMore ? `<button class="expand-btn" data-key="${key}" data-label="${label}">Ver 10 más</button>` : ''}</div><div class="table-wrap" id="${containerId}"><table><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>${label}</th></tr></thead><tbody>`;
      visible.forEach((p, i) => {
        html += `<tr><td>${i+1}</td><td class="flex-center"><img src="${p.teamShield||''}" class="shield-sm"> ${p.name}</td><td>${p.teamName}</td><td><strong>${p[key]||0}</strong></td></tr>`;
      });
      html += '</tbody></table></div></div>';
      return html;
    }

    let html = makeTable('⚽ Goleadores', 'goals', 'Goles', 'stats-goals');
    html += makeTable('🎯 Asistencias', 'assists', 'Asistencias', 'stats-assists');
    html += makeTable('🧤 Salvadas', 'saves', 'Salvadas', 'stats-saves');
    html += makeTable('💀 Tiros (Peligro)', 'shots', 'Tiros', 'stats-shots');

    html += `<div class="card"><div class="card-header">⭐ MVPs por Jornada</div>`;
    const totalJornadas = torneo.rounds ? torneo.rounds.length : 0;
    if (!totalJornadas) {
      html += '<div class="text-muted" style="font-size:0.8rem;">No hay jornadas para mostrar MVPs.</div>';
    } else {
      html += `<div class="jornada-nav" id="mvp-jornada-nav">`;
      for (let i = 0; i < totalJornadas; i++) {
        html += `<button data-jornada="${i}" class="${i === currentMvpJornada ? 'active' : ''}">J${i+1}</button>`;
      }
      html += `</div><div id="mvp-content"></div>`;
    }
    html += '</div>';

    setTimeout(() => {
      document.querySelectorAll('.expand-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const key = this.dataset.key;
          if (statsLimits[key]) {
            statsLimits[key] += 10;
            if (statsLimits[key] > MAX_STATS_LIMIT) statsLimits[key] = MAX_STATS_LIMIT;
            const sec = document.getElementById('section-stats');
            if (sec) {
              const cont = sec.querySelector('.section-content');
              if (cont) cont.innerHTML = renderStats(data);
              setTimeout(() => {
                document.querySelectorAll('.expand-btn').forEach(b => {
                  b.addEventListener('click', function() {
                    const k = this.dataset.key;
                    if (statsLimits[k]) {
                      statsLimits[k] += 10;
                      if (statsLimits[k] > MAX_STATS_LIMIT) statsLimits[k] = MAX_STATS_LIMIT;
                      const sec2 = document.getElementById('section-stats');
                      if (sec2) {
                        const cont2 = sec2.querySelector('.section-content');
                        if (cont2) cont2.innerHTML = renderStats(data);
                      }
                    }
                  });
                });
              }, 50);
            }
          }
        });
      });

      document.querySelectorAll('#mvp-jornada-nav button').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.jornada);
          currentMvpJornada = idx;
          document.querySelectorAll('#mvp-jornada-nav button').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('mvp-content').innerHTML = renderMvpForJornada(data, idx);
        });
      });
      if (totalJornadas > 0) {
        document.getElementById('mvp-content').innerHTML = renderMvpForJornada(data, currentMvpJornada);
      }
    }, 50);

    return `<div class="section-content">${html}</div>`;
  }

  function renderMvpForJornada(torneo, jornadaIdx) {
    const round = torneo.rounds && torneo.rounds[jornadaIdx];
    if (!round || !round.length) return '<div class="text-muted" style="font-size:0.8rem;">No hay partidos en esta jornada.</div>';

    const statsMap = {};
    const teamStats = {};
    torneo.teams.forEach(t => { teamStats[t.id] = { pts: 0, g: 0, a: 0, s: 0, pig: 0 }; });

    round.forEach(m => {
      if (m.stats) {
        m.stats.forEach(st => {
          if (!statsMap[st.pId]) statsMap[st.pId] = { g:0, a:0, s:0, t:0, pig:0, teamId: st.tId };
          statsMap[st.pId].g += st.g || 0;
          statsMap[st.pId].a += st.a || 0;
          statsMap[st.pId].s += st.s || 0;
          statsMap[st.pId].t += st.t || 0;
          const pig = (st.g||0)*2 + (st.a||0)*1.5 + (st.s||0)*1 + ((st.t||0) - (st.g||0))*0.2;
          statsMap[st.pId].pig += pig;
          if (teamStats[st.tId]) {
            teamStats[st.tId].g += st.g || 0;
            teamStats[st.tId].a += st.a || 0;
            teamStats[st.tId].s += st.s || 0;
            teamStats[st.tId].pig += pig;
          }
        });
      }
      if (m.played) {
        if (m.sH > m.sA) { if (teamStats[m.h]) teamStats[m.h].pts += 3; }
        else if (m.sA > m.sH) { if (teamStats[m.a]) teamStats[m.a].pts += 3; }
        else { if (teamStats[m.h]) teamStats[m.h].pts += 1; if (teamStats[m.a]) teamStats[m.a].pts += 1; }
      }
    });

    let mvp = null, maxPig = -1;
    Object.entries(statsMap).forEach(([pid, st]) => {
      if (st.pig > maxPig) { maxPig = st.pig; mvp = { id: pid, ...st }; }
    });

    let bestTeam = null, bestScore = -1;
    Object.entries(teamStats).forEach(([tid, st]) => {
      const score = (st.pts || 0) + (st.pig || 0)/10;
      if (score > bestScore) { bestScore = score; bestTeam = { id: tid, ...st }; }
    });

    let bestGoleador = null, bestAsistidor = null, bestMuro = null;
    let maxG=-1, maxA=-1, maxS=-1;
    Object.entries(statsMap).forEach(([pid, st]) => {
      if (st.g > maxG) { maxG = st.g; bestGoleador = { id: pid, ...st }; }
      if (st.a > maxA) { maxA = st.a; bestAsistidor = { id: pid, ...st }; }
      if (st.s > maxS) { maxS = st.s; bestMuro = { id: pid, ...st }; }
    });

    function getPlayerInfo(pid) {
      for (let team of torneo.teams) {
        const p = team.players.find(x => x.id === pid);
        if (p) return { name: p.name, teamName: team.name, rank: p.rocketRank || 'Platino', shield: team.shield };
      }
      return null;
    }

    let html = '<div class="mvp-grid">';
    if (mvp) {
      const info = getPlayerInfo(mvp.id);
      html += `<div class="mvp-card"><div class="label">🏆 MVP</div><div class="name">${info ? info.name : '?'}</div><div style="font-size:0.65rem;color:var(--color-text-muted);">${info ? info.teamName : ''}</div><div class="stat">${mvp.pig.toFixed(1)} PIG</div></div>`;
    }
    if (bestTeam) {
      const team = getTeamById(torneo.teams, bestTeam.id);
      html += `<div class="mvp-card"><div class="label">🏅 Equipo de la Jornada</div><div class="name">${team ? team.name : '?'}</div><div class="stat">${bestTeam.pts||0} pts · ${(bestTeam.pig||0).toFixed(1)} PIG</div></div>`;
    }
    html += `<div class="mvp-card" style="max-width:300px;flex:2;"><div class="label">⭐ Dream Team</div>`;
    if (bestGoleador) {
      const info = getPlayerInfo(bestGoleador.id);
      html += `<div style="font-size:0.65rem;"><span class="text-neon-green">⚽</span> ${info ? info.name : '?'} (${bestGoleador.g} goles)</div>`;
    }
    if (bestAsistidor) {
      const info = getPlayerInfo(bestAsistidor.id);
      html += `<div style="font-size:0.65rem;"><span class="text-neon-cyan">🎯</span> ${info ? info.name : '?'} (${bestAsistidor.a} asistencias)</div>`;
    }
    if (bestMuro) {
      const info = getPlayerInfo(bestMuro.id);
      html += `<div style="font-size:0.65rem;"><span class="text-neon-pink">🧤</span> ${info ? info.name : '?'} (${bestMuro.s} salvadas)</div>`;
    }
    html += '</div></div>';
    return html;
  }

  // ---------- BALÓN DE ORO (pódium mejorado) ----------
  function renderBalon(torneo) {
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || { pig:0 };
          allPlayers.push({ ...p, teamName: team.name, teamShield: team.shield, pig: s.pig || 0 });
        }
      });
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-trophy"></i>Sin jugadores.</div>';
    const sorted = [...allPlayers].sort((a,b) => (b.pig||0) - (a.pig||0));

    let html = '<div class="podium">';
    const top3 = sorted.slice(0,3);
    const cls = ['first','second','third'];
    top3.forEach((p, i) => {
      // Acortar nombre si es muy largo
      let displayName = p.name;
      if (displayName.length > 18) displayName = displayName.substring(0, 16) + '…';
      html += `
        <div class="podium-item ${cls[i]}">
          <div class="pos">#${i+1}</div>
          <img src="${p.teamShield||''}" class="shield" style="width:2.8rem;height:2.8rem;">
          <div class="name" title="${p.name}">${displayName}</div>
          <div class="value">${(p.pig||0).toFixed(1)}</div>
          <div class="sub">${p.teamName}</div>
        </div>
      `;
    });
    html += '</div>';

    html += `<div class="table-wrap"><table><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>PIG</th></tr></thead><tbody>`;
    sorted.slice(3).forEach((p, i) => {
      html += `<tr><td>${i+4}</td><td class="flex-center"><img src="${p.teamShield||''}" class="shield-sm"> ${p.name}</td><td>${p.teamName}</td><td>${(p.pig||0).toFixed(1)}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------- EQUIPOS ----------
  function renderEquipos(torneo) {
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>No hay equipos.</div>';
    let html = '';
    torneo.teams.forEach(team => {
      const titulares = team.players.filter(p => p.role === 'Titular 🌟' && p.name && p.name.trim() !== '');
      const suplentes = team.players.filter(p => p.role === 'Suplente 🔄' && p.name && p.name.trim() !== '');
      const reservas = team.players.filter(p => p.role === 'Reserva 💤' && p.name && p.name.trim() !== '');
      const capitan = team.players.find(p => p.isCaptain);
      html += `
        <div class="card">
          <div class="flex-center" style="justify-content:space-between;flex-wrap:wrap;">
            <div class="flex-center"><img src="${team.shield||''}" style="width:2.5rem;height:2.5rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"><div><strong style="font-size:1rem;">${team.name}</strong><div style="font-size:0.65rem;color:var(--color-text-muted);">GLB ${team.glb||0} · ATK ${team.atk||0} · DEF ${team.def||0} · Presupuesto ${formatCurrency(team.budget||0)}${capitan ? ` · Capitán: ${capitan.name}` : ''}</div></div></div>
          </div>
          <div style="margin-top:0.4rem;">
            <div style="font-size:0.6rem;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;">Titulares</div>
            <div class="player-list">${titulares.map(p => `<span class="player-tag titular ${p.isCaptain?'captain':''}">${p.isCaptain?'👑 ':''}${p.name}</span>`).join('') || '<span class="text-muted" style="font-size:0.65rem;">Ninguno</span>'}</div>
            <div style="font-size:0.6rem;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:0.2rem;">Suplentes</div>
            <div class="player-list">${suplentes.map(p => `<span class="player-tag suplente">${p.name}</span>`).join('') || '<span class="text-muted" style="font-size:0.65rem;">Ninguno</span>'}</div>
            <div style="font-size:0.6rem;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:0.2rem;">Reservas (FB)</div>
            <div class="player-list">${reservas.map(p => `<span class="player-tag reserva">${p.name}</span>`).join('') || '<span class="text-muted" style="font-size:0.65rem;">Ninguno</span>'}</div>
          </div>
        </div>
      `;
    });
    return html;
  }

  // ---------- MERCADO ----------
  function renderMercado(torneo) {
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || { pig:0 };
          allPlayers.push({
            ...p,
            teamId: team.id,
            teamName: team.name,
            teamShield: team.shield,
            pig: s.pig || 0,
            marketValue: p.marketValue || 0,
            rocketRank: p.rocketRank || 'Platino',
            division: p.division || 2,
            isFree: false
          });
        }
      });
    });
    (torneo.freeAgents || []).forEach(p => {
      if (p.name && p.name.trim() !== '') {
        const s = p.seasonStats || { pig:0 };
        allPlayers.push({
          ...p,
          teamId: null,
          teamName: 'Agente Libre',
          teamShield: '',
          pig: s.pig || 0,
          marketValue: p.marketValue || 0,
          rocketRank: p.rocketRank || 'Platino',
          division: p.division || 2,
          isFree: true
        });
      }
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-store-slash"></i>No hay jugadores en el mercado.</div>';

    const teamsOpts = torneo.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    const freeOpt = `<option value="free">Agentes Libres</option>`;

    let html = `
      <div class="filters">
        <select id="mercadoEquipo"><option value="all">Todos los equipos</option>${teamsOpts}${freeOpt}</select>
        <select id="mercadoOrden">
          <option value="precio-desc">Precio ↓</option>
          <option value="precio-asc">Precio ↑</option>
          <option value="pig-desc">PIG ↓</option>
          <option value="pig-asc">PIG ↑</option>
          <option value="nombre">Nombre A-Z</option>
          <option value="nombre-desc">Nombre Z-A</option>
        </select>
        <input id="mercadoBuscar" type="text" placeholder="Buscar jugador..." style="flex:1;min-width:120px;">
      </div>
      <div id="mercadoTablaContainer"></div>
    `;

    function renderMercadoTabla() {
      const equipo = document.getElementById('mercadoEquipo').value;
      const orden = document.getElementById('mercadoOrden').value;
      const busqueda = document.getElementById('mercadoBuscar').value.toLowerCase();

      let filtered = allPlayers;
      if (equipo === 'free') filtered = filtered.filter(p => p.isFree);
      else if (equipo !== 'all') filtered = filtered.filter(p => p.teamId === equipo);
      if (busqueda) filtered = filtered.filter(p => p.name.toLowerCase().includes(busqueda));

      switch (orden) {
        case 'precio-desc': filtered.sort((a,b) => (b.marketValue||0) - (a.marketValue||0)); break;
        case 'precio-asc': filtered.sort((a,b) => (a.marketValue||0) - (b.marketValue||0)); break;
        case 'pig-desc': filtered.sort((a,b) => (b.pig||0) - (a.pig||0)); break;
        case 'pig-asc': filtered.sort((a,b) => (a.pig||0) - (b.pig||0)); break;
        case 'nombre': filtered.sort((a,b) => a.name.localeCompare(b.name)); break;
        case 'nombre-desc': filtered.sort((a,b) => b.name.localeCompare(a.name)); break;
        default: break;
      }

      if (!filtered.length) {
        document.getElementById('mercadoTablaContainer').innerHTML = '<div class="empty-state"><i class="fa-solid fa-search"></i>No se encontraron jugadores.</div>';
        return;
      }

      let tabla = `<div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Equipo</th><th>PIG</th><th>Rango</th><th>Precio</th></tr></thead><tbody>`;
      filtered.forEach(p => {
        const rankDisplay = p.rocketRank + (p.rocketRank !== 'SSL' ? ` Div${p.division}` : '');
        tabla += `
          <tr>
            <td class="flex-center"><img src="${p.teamShield||''}" class="shield-sm"> ${p.name} ${p.isCaptain ? '👑' : ''} ${p.isFree ? '🆓' : ''}</td>
            <td>${p.teamName}</td>
            <td>${(p.pig||0).toFixed(1)}</td>
            <td style="color:${getRankColor(p.rocketRank)};font-weight:700;">${rankDisplay}</td>
            <td>${formatCurrency(p.marketValue||0)}</td>
          </tr>
        `;
      });
      tabla += '</tbody></table></div>';
      document.getElementById('mercadoTablaContainer').innerHTML = tabla;
    }

    setTimeout(() => {
      document.getElementById('mercadoEquipo').addEventListener('change', renderMercadoTabla);
      document.getElementById('mercadoOrden').addEventListener('change', renderMercadoTabla);
      document.getElementById('mercadoBuscar').addEventListener('input', renderMercadoTabla);
      renderMercadoTabla();
    }, 0);

    return html;
  }

  // ---------- ECONOMÍA ----------
  function renderEconomia(torneo) {
    if (!torneo.economyLogs || !torneo.economyLogs.length) return '<div class="empty-state"><i class="fa-solid fa-coins"></i>No hay movimientos económicos registrados.</div>';
    const logs = [...torneo.economyLogs].reverse();
    let html = `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Descripción</th><th>Monto</th></tr></thead><tbody>`;
    logs.forEach(log => {
      const team = torneo.teams.find(t => t.id === log.teamId);
      const teamName = team ? team.name : 'Desconocido';
      const teamShield = team ? team.shield : '';
      const isIncome = log.amount > 0;
      const sign = isIncome ? '+' : '';
      const color = isIncome ? 'var(--neon-green)' : 'var(--neon-red)';
      const date = new Date(log.date).toLocaleDateString('es-ES');
      html += `<tr><td style="font-size:0.65rem;">${date}</td><td class="flex-center"><img src="${teamShield}" class="shield-sm"> ${teamName}</td><td>${log.description}</td><td style="color:${color};font-weight:700;">${sign}${formatCurrency(log.amount)}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------- SANCIONES ----------
  function renderSanciones(torneo) {
    if (!torneo.sanctionsLog || !torneo.sanctionsLog.length) return '<div class="empty-state"><i class="fa-solid fa-gavel"></i>No hay sanciones registradas.</div>';
    const logs = [...torneo.sanctionsLog].filter(s => s.active !== false).reverse();
    if (!logs.length) return '<div class="empty-state"><i class="fa-solid fa-check-circle" style="color:var(--neon-green);"></i>No hay sanciones activas.</div>';
    let html = `<div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Equipo</th><th>Tipo</th><th>Motivo</th><th>Jornadas</th></tr></thead><tbody>`;
    logs.forEach(s => {
      const team = torneo.teams.find(t => t.id === s.teamId);
      const teamName = team ? team.name : 'Desconocido';
      const teamShield = team ? team.shield : '';
      const typeLabel = s.type === 'yellow' ? '🟨 Amonestación' : s.type === 'red' ? '🟥 Expulsión' : s.type === 'suspension' ? '🚫 Suspensión' : '💰 Multa';
      const rounds = s.roundEnd ? `J${s.roundStart} - J${s.roundEnd}` : `Desde J${s.roundStart}`;
      html += `<tr><td><strong>${s.playerName}</strong></td><td class="flex-center"><img src="${teamShield}" class="shield-sm"> ${teamName}</td><td>${typeLabel}</td><td>${s.reason}</td><td>${rounds}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------- SELECCIÓN NACIONAL ----------
  function renderSeleccion(torneo) {
    let national = null;
    if (torneo.nationalTeams) {
      national = torneo.nationalTeams.find(nt => nt.type === 'main');
      if (!national) national = torneo.nationalTeams[0];
    }
    if (!national || !national.players || !national.players.length) return '<div class="empty-state"><i class="fa-solid fa-flag"></i>No hay selección nacional configurada.</div>';

    let html = `<div class="card"><div class="flex-center" style="justify-content:space-between;"><span style="font-family:Montserrat,sans-serif;font-weight:900;font-size:1.2rem;">${national.name}</span><span style="font-size:0.65rem;color:var(--color-text-muted);">${national.type === 'main' ? '🇲🇽 Selección Nacional' : '🔵 Sub Selección'}</span></div><div style="display:flex;flex-wrap:wrap;gap:0.8rem;margin-top:0.4rem;justify-content:center;">`;
    national.players.forEach(p => {
      const rankColor = getRankColor(p.rocketRank || 'Platino');
      html += `
        <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:0.5rem;text-align:center;min-width:90px;flex:1 0 auto;max-width:140px;">
          <div style="font-size:0.55rem;color:var(--color-text-muted);">${p.role||'Jugador'}</div>
          <img src="${p.shield||''}" style="width:2.5rem;height:2.5rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;margin:0.1rem auto;">
          <div style="font-weight:700;font-size:0.8rem;">${p.name}</div>
          <div style="font-size:0.55rem;color:${rankColor};">${p.rocketRank||'Platino'} ${p.division && p.rocketRank !== 'SSL' ? `Div${p.division}` : ''}</div>
          <div style="font-size:0.6rem;color:var(--neon-yellow);">G${p.stats?.goals||0} A${p.stats?.assists||0} S${p.stats?.saves||0}</div>
        </div>
      `;
    });
    html += '</div></div>';
    const power = { atk: national.atk||0, def: national.def||0, glb: national.glb||0 };
    html += `<div class="card" style="margin-top:0.3rem;"><div class="flex-center" style="gap:0.8rem;flex-wrap:wrap;"><span><span class="power-badge atk">ATK ${power.atk}</span></span><span><span class="power-badge def">DEF ${power.def}</span></span><span><span class="power-badge glb">GLB ${power.glb}</span></span><span style="font-size:0.65rem;color:var(--color-text-muted);">Partidos: ${national.matchesPlayed||0}</span></div></div>`;
    return html;
  }

  // ---------- PARTIDOS AMISTOSOS ----------
  function renderAmistosos(torneo) {
    if (!torneo.friendlyMatches || !torneo.friendlyMatches.length) return '<div class="empty-state"><i class="fa-solid fa-handshake-slash"></i>No hay partidos amistosos.</div>';
    let html = '';
    torneo.friendlyMatches.forEach(fm => {
      const h = getTeamById(torneo.teams, fm.h);
      const a = getTeamById(torneo.teams, fm.a);
      const hName = h ? h.name : 'Desconocido';
      const aName = a ? a.name : 'Desconocido';
      const hShield = h ? h.shield : '';
      const aShield = a ? a.shield : '';
      const played = fm.played || false;
      const score = played ? `${fm.sH} - ${fm.sA}` : 'vs';
      const clickable = played ? `class="match-clickable" onclick="showMatchStats('${fm.id}')"` : '';
      html += `
        <div class="card">
          <div class="flex-center" style="justify-content:space-between;">
            <span class="flex-center"><img src="${hShield}" class="shield-sm"> ${hName}</span>
            <span style="font-weight:700;font-size:1.1rem;">${score}</span>
            <span class="flex-center">${aName} <img src="${aShield}" class="shield-sm"></span>
          </div>
          ${played ? `<div style="font-size:0.6rem;color:var(--color-text-muted);text-align:center;margin-top:0.2rem;">📊 Haz clic para ver estadísticas</div>` : ''}
        </div>
      `;
    });
    return html;
  }

  // ---------- SALÓN DE LA FAMA ----------
  function renderSalon(torneo) {
    if (!torneo.seasons || !torneo.seasons.length) return '<div class="empty-state"><i class="fa-solid fa-medal"></i>No hay temporadas guardadas.</div>';
    let html = '';
    torneo.seasons.slice().reverse().forEach((season, idx) => {
      const realIdx = torneo.seasons.length - idx;
      html += `<div class="card"><div class="card-header">Temporada ${realIdx} - ${new Date(season.date).toLocaleDateString('es-ES')}</div>`;
      const champ = season.champion ? season.teams.find(t => t.id === season.champion) : null;
      if (champ) {
        html += `<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.3rem;"><span style="font-size:1.3rem;">🏆</span><img src="${champ.shield||''}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"><strong>${champ.name}</strong> <span style="font-size:0.65rem;color:var(--color-text-muted);">${champ.pts||0} pts</span></div>`;
      }
      const dt = season.dreamTeam || {};
      if (dt.goleador || dt.asistidor || dt.portero) {
        html += `<div style="font-size:0.65rem;display:flex;flex-wrap:wrap;gap:0.3rem 1rem;margin:0.2rem 0;">`;
        if (dt.goleador) html += `<span><span class="text-neon-green">⚽</span> ${dt.goleador.name} (${dt.goleador.g} goles)</span>`;
        if (dt.asistidor) html += `<span><span class="text-neon-cyan">🎯</span> ${dt.asistidor.name} (${dt.asistidor.a} asistencias)</span>`;
        if (dt.portero) html += `<span><span class="text-neon-pink">🧤</span> ${dt.portero.name} (${dt.portero.s} salvadas)</span>`;
        html += '</div>';
      }
      if (season.topPlayers && season.topPlayers.length) {
        html += `<div style="font-size:0.65rem;color:var(--color-text-muted);margin-top:0.2rem;">Top PIG: ${season.topPlayers.slice(0,3).map(p => `${p.name} (${(p.imp||0).toFixed(1)})`).join(' · ')}</div>`;
      }
      html += '</div>';
    });
    return html;
  }

  // ==========================================
  // CONSTRUCCIÓN DE LA INTERFAZ
  // ==========================================
  function buildUI(torneo) {
    let navHtml = '';
    MENU_ITEMS.forEach(item => {
      navHtml += `<div class="nav-item" data-section="${item.id}"><i class="fas ${item.icon}"></i> ${item.label}</div>`;
    });
    mainNav.innerHTML = navHtml;

    let sectionsHtml = '';
    MENU_ITEMS.forEach(item => {
      let content = '', printBtn = '';
      switch (item.id) {
        case 'tabla': content = renderTabla(torneo); printBtn = `<button class="print-btn" onclick="printTablaGeneral()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'media': content = renderMedia(torneo); printBtn = `<button class="print-btn" onclick="printTablaMedia()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'jornadas': content = renderJornadas(torneo); printBtn = `<button class="print-btn" onclick="printJornada()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'playoffs': content = renderPlayoffs(torneo); printBtn = ''; break;
        case 'stats': content = renderStats(torneo); printBtn = `<button class="print-btn" onclick="printStats()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'balon': content = renderBalon(torneo); printBtn = `<button class="print-btn" onclick="printBalon()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'equipos': content = renderEquipos(torneo); printBtn = `<button class="print-btn" onclick="printEquipos()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'mercado': content = renderMercado(torneo); printBtn = `<button class="print-btn" onclick="printMercado()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'economia': content = renderEconomia(torneo); printBtn = `<button class="print-btn" onclick="printEconomia()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'sanciones': content = renderSanciones(torneo); printBtn = `<button class="print-btn" onclick="printSanciones()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'seleccion': content = renderSeleccion(torneo); printBtn = `<button class="print-btn" onclick="printSeleccion()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'amistosos': content = renderAmistosos(torneo); printBtn = `<button class="print-btn" onclick="printAmistosos()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        case 'salon': content = renderSalon(torneo); printBtn = `<button class="print-btn" onclick="printSalon()"><i class="fas fa-print"></i> Imprimir</button>`; break;
        default: content = '<div class="empty-state">Sección no implementada</div>';
      }
      sectionsHtml += `
        <div class="section" id="section-${item.id}">
          <div class="section-title"><i class="fas ${item.icon}"></i> ${item.label} ${printBtn}</div>
          ${content}
        </div>
      `;
    });
    sectionsContainer.innerHTML = sectionsHtml;

    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', function() {
        const sectionId = this.dataset.section;
        switchSection(sectionId);
        if (window.innerWidth <= 820) sidebar.classList.remove('open');
      });
    });
    switchSection('tabla');
  }

  function switchSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    const target = document.getElementById('section-' + id);
    if (target) target.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.section === id);
    });
    currentSection = id;
  }

  // ==========================================
  // FUNCIONES DE IMPRESIÓN (con vista previa y compacto)
  // ==========================================

  function printTablaGeneral() {
    const container = document.querySelector('#section-tabla .table-wrap');
    if (!container) return alert('No hay tabla para imprimir.');
    const clone = container.cloneNode(true);
    const html = `<h2 style="font-family:Montserrat,sans-serif;color:var(--neon-purple);font-size:1.1rem;">Tabla General</h2>${clone.outerHTML}<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
    showPrintModal(html, 'tabla_general.jpg', 900);
  }

  function printTablaMedia() {
    const container = document.querySelector('#section-media .table-wrap');
    if (!container) return alert('No hay tabla para imprimir.');
    const clone = container.cloneNode(true);
    const html = `<h2 style="font-family:Montserrat,sans-serif;color:var(--neon-purple);font-size:1.1rem;">Tabla de Media</h2>${clone.outerHTML}<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
    showPrintModal(html, 'tabla_media.jpg', 900);
  }

  function printJornada() {
    if (!data.rounds || !data.rounds.length) return alert('No hay jornadas.');
    const options = data.rounds.map((_, i) => `<option value="${i}">Jornada ${i+1}</option>`).join('');
    const modal = document.createElement('div');
    modal.className = 'print-modal-overlay';
    modal.innerHTML = `
      <div class="print-modal" style="max-width:400px;">
        <h3>Seleccionar Jornada</h3>
        <select id="print-jornada-select" style="width:100%;padding:0.4rem;margin:0.4rem 0;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">${options}</select>
        <div class="actions">
          <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cancelar</button>
          <button class="btn-download" onclick="confirmPrintJornada()">Descargar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    window.confirmPrintJornada = function() {
      const idx = parseInt(document.getElementById('print-jornada-select').value);
      const round = data.rounds[idx];
      if (!round) return alert('Jornada no encontrada.');
      let html = `<h2 style="font-family:Montserrat,sans-serif;color:var(--neon-purple);font-size:1.1rem;">Jornada ${idx+1}</h2><div style="margin-top:0.2rem;"><table style="width:100%;border-collapse:collapse;font-size:0.7rem;">`;
