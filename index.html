  function renderStats(torneo) {
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || {};
          allPlayers.push({
            ...p,
            teamName: team.name,
            teamShield: team.shield,
            goals: s.goals || 0,
            assists: s.assists || 0,
            saves: s.saves || 0,
            shots: s.shots || 0,
            pig: s.pig || 0,
            matchesPlayed: s.matchesPlayed || 0
          });
        }
      });
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>No hay jugadores con estadísticas.</div>';

    function makeTable(title, key, label, containerId) {
      const sorted = [...allPlayers].sort((a,b) => (b[key]||0) - (a[key]||0));
      const limit = statsLimits[key] || 10;
      const visible = sorted.slice(0, limit);
      const hasMore = limit < sorted.length && limit < MAX_STATS_LIMIT;
      let html = `<div class="card"><div class="card-header">${title}${hasMore ? `<button class="expand-btn" data-key="${key}" data-label="${label}">Ver 10 más</button>` : ''}</div><div class="table-wrap" id="${containerId}"><table><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>${label}</th></tr></thead><tbody>`;
      visible.forEach((p, i) => {
        html += `<tr><td>${i+1}</td><td class="flex-center"><img src="${p.teamShield||''}" class="shield-sm"> ${p.name}</td><td>${p.teamName}</td><td><strong>${p[key]||0}</strong></td></tr>`;
      });
      html += '</tbody></table></div></div>';
      return html;
    }

    let html = makeTable('⚽ Goleadores', 'goals', 'Goles', 'stats-goals');
    html += makeTable('🎯 Asistencias', 'assists', 'Asistencias', 'stats-assists');
    html += makeTable('🧤 Salvadas', 'saves', 'Salvadas', 'stats-saves');
    html += makeTable('💀 Tiros (Peligro)', 'shots', 'Tiros', 'stats-shots');

    html += `<div class="card"><div class="card-header">⭐ MVPs por Jornada</div>`;
    const totalJornadas = torneo.rounds ? torneo.rounds.length : 0;
    if (!totalJornadas) {
      html += '<div class="text-muted" style="font-size:0.8rem;">No hay jornadas para mostrar MVPs.</div>';
    } else {
      html += `<div class="jornada-nav" id="mvp-jornada-nav">`;
      for (let i = 0; i < totalJornadas; i++) {
        html += `<button data-jornada="${i}" class="${i === currentMvpJornada ? 'active' : ''}">J${i+1}</button>`;
      }
      html += `</div><div id="mvp-content"></div>`;
    }
    html += '</div>';

    setTimeout(() => {
      document.querySelectorAll('.expand-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const key = this.dataset.key;
          if (statsLimits[key]) {
            statsLimits[key] += 10;
            if (statsLimits[key] > MAX_STATS_LIMIT) statsLimits[key] = MAX_STATS_LIMIT;
            const sec = document.getElementById('section-stats');
            if (sec) {
              const cont = sec.querySelector('.section-content');
              if (cont) cont.innerHTML = renderStats(data);
              setTimeout(() => {
                document.querySelectorAll('.expand-btn').forEach(b => {
                  b.addEventListener('click', function() {
                    const k = this.dataset.key;
                    if (statsLimits[k]) {
                      statsLimits[k] += 10;
                      if (statsLimits[k] > MAX_STATS_LIMIT) statsLimits[k] = MAX_STATS_LIMIT;
                      const sec2 = document.getElementById('section-stats');
                      if (sec2) {
                        const cont2 = sec2.querySelector('.section-content');
                        if (cont2) cont2.innerHTML = renderStats(data);
                      }
                    }
                  });
                });
              }, 50);
            }
          }
        });
      });

      document.querySelectorAll('#mvp-jornada-nav button').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.jornada);
          currentMvpJornada = idx;
          document.querySelectorAll('#mvp-jornada-nav button').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('mvp-content').innerHTML = renderMvpForJornada(data, idx);
        });
      });
      if (totalJornadas > 0) {
        document.getElementById('mvp-content').innerHTML = renderMvpForJornada(data, currentMvpJornada);
      }
    }, 50);

    return `<div class="section-content">${html}</div>`;
  }

  function renderMvpForJornada(torneo, jornadaIdx) {
    const round = torneo.rounds && torneo.rounds[jornadaIdx];
    if (!round || !round.length) return '<div class="text-muted" style="font-size:0.8rem;">No hay partidos en esta jornada.</div>';

    const statsMap = {};
    const teamStats = {};
    torneo.teams.forEach(t => { teamStats[t.id] = { pts: 0, g: 0, a: 0, s: 0, pig: 0 }; });

    round.forEach(m => {
      if (m.stats) {
        m.stats.forEach(st => {
          if (!statsMap[st.pId]) statsMap[st.pId] = { g:0, a:0, s:0, t:0, pig:0, teamId: st.tId };
          statsMap[st.pId].g += st.g || 0;
          statsMap[st.pId].a += st.a || 0;
          statsMap[st.pId].s += st.s || 0;
          statsMap[st.pId].t += st.t || 0;
          const pig = (st.g||0)*2 + (st.a||0)*1.5 + (st.s||0)*1 + ((st.t||0) - (st.g||0))*0.2;
          statsMap[st.pId].pig += pig;
          if (teamStats[st.tId]) {
            teamStats[st.tId].g += st.g || 0;
            teamStats[st.tId].a += st.a || 0;
            teamStats[st.tId].s += st.s || 0;
            teamStats[st.tId].pig += pig;
          }
        });
      }
      if (m.played) {
        if (m.sH > m.sA) { if (teamStats[m.h]) teamStats[m.h].pts += 3; }
        else if (m.sA > m.sH) { if (teamStats[m.a]) teamStats[m.a].pts += 3; }
        else { if (teamStats[m.h]) teamStats[m.h].pts += 1; if (teamStats[m.a]) teamStats[m.a].pts += 1; }
      }
    });

    let mvp = null, maxPig = -1;
    Object.entries(statsMap).forEach(([pid, st]) => {
      if (st.pig > maxPig) { maxPig = st.pig; mvp = { id: pid, ...st }; }
    });

    let bestTeam = null, bestScore = -1;
    Object.entries(teamStats).forEach(([tid, st]) => {
      const score = (st.pts || 0) + (st.pig || 0)/10;
      if (score > bestScore) { bestScore = score; bestTeam = { id: tid, ...st }; }
    });

    let bestGoleador = null, bestAsistidor = null, bestMuro = null;
    let maxG=-1, maxA=-1, maxS=-1;
    Object.entries(statsMap).forEach(([pid, st]) => {
      if (st.g > maxG) { maxG = st.g; bestGoleador = { id: pid, ...st }; }
      if (st.a > maxA) { maxA = st.a; bestAsistidor = { id: pid, ...st }; }
      if (st.s > maxS) { maxS = st.s; bestMuro = { id: pid, ...st }; }
    });

    function getPlayerInfo(pid) {
      for (let team of torneo.teams) {
        const p = team.players.find(x => x.id === pid);
        if (p) return { name: p.name, teamName: team.name, rank: p.rocketRank || 'Platino', shield: team.shield };
      }
      return null;
    }

    let html = '<div class="mvp-grid">';
    if (mvp) {
      const info = getPlayerInfo(mvp.id);
      html += `<div class="mvp-card"><div class="label">🏆 MVP</div><div class="name">${info ? info.name : '?'}</div><div style="font-size:0.65rem;color:var(--color-text-muted);">${info ? info.teamName : ''}</div><div class="stat">${mvp.pig.toFixed(1)} PIG</div></div>`;
    }
    if (bestTeam) {
      const team = getTeamById(torneo.teams, bestTeam.id);
      html += `<div class="mvp-card"><div class="label">🏅 Equipo de la Jornada</div><div class="name">${team ? team.name : '?'}</div><div class="stat">${bestTeam.pts||0} pts · ${(bestTeam.pig||0).toFixed(1)} PIG</div></div>`;
    }
    html += `<div class="mvp-card" style="max-width:300px;flex:2;"><div class="label">⭐ Dream Team</div>`;
    if (bestGoleador) {
      const info = getPlayerInfo(bestGoleador.id);
      html += `<div style="font-size:0.65rem;"><span class="text-neon-green">⚽</span> ${info ? info.name : '?'} (${bestGoleador.g} goles)</div>`;
    }
    if (bestAsistidor) {
      const info = getPlayerInfo(bestAsistidor.id);
      html += `<div style="font-size:0.65rem;"><span class="text-neon-cyan">🎯</span> ${info ? info.name : '?'} (${bestAsistidor.a} asistencias)</div>`;
    }
    if (bestMuro) {
      const info = getPlayerInfo(bestMuro.id);
      html += `<div style="font-size:0.65rem;"><span class="text-neon-pink">🧤</span> ${info ? info.name : '?'} (${bestMuro.s} salvadas)</div>`;
    }
    html += '</div></div>';
    return html;
  }

  // ---------- BALÓN DE ORO ----------
  function renderBalon(torneo) {
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || { pig:0 };
          allPlayers.push({ ...p, teamName: team.name, teamShield: team.shield, pig: s.pig || 0 });
        }
      });
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-trophy"></i>Sin jugadores.</div>';
    const sorted = [...allPlayers].sort((a,b) => (b.pig||0) - (a.pig||0));

    let html = '<div class="podium">';
    const top3 = sorted.slice(0,3);
    const cls = ['first','second','third'];
    top3.forEach((p, i) => {
      let displayName = p.name;
      if (displayName.length > 16) displayName = displayName.substring(0, 14) + '…';
      html += `
        <div class="podium-item ${cls[i]}">
          <div class="circle">
            <img src="${p.teamShield || ''}" alt="${p.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=\\'no-img\\'>#${i+1}</span>';" />
          </div>
          <div class="pos">#${i+1}</div>
          <div class="name" title="${p.name}">${displayName}</div>
          <div class="value">${(p.pig||0).toFixed(1)} PIG</div>
          <div class="sub">${p.teamName}</div>
        </div>
      `;
    });
    html += '</div>';

    html += `<div class="table-wrap"><table><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>PIG</th></tr></thead><tbody>`;
    sorted.slice(3).forEach((p, i) => {
      html += `<tr><td>${i+4}</td><td class="flex-center"><img src="${p.teamShield||''}" class="shield-sm"> ${p.name}</td><td>${p.teamName}</td><td>${(p.pig||0).toFixed(1)}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------- EQUIPOS ----------
  function renderEquipos(torneo) {
    if (!torneo.teams || !torneo.teams.length) return '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>No hay equipos.</div>';
    let html = '';
    torneo.teams.forEach(team => {
      const titulares = team.players.filter(p => p.role === 'Titular 🌟' && p.name && p.name.trim() !== '');
      const suplentes = team.players.filter(p => p.role === 'Suplente 🔄' && p.name && p.name.trim() !== '');
      const reservas = team.players.filter(p => p.role === 'Reserva 💤' && p.name && p.name.trim() !== '');
      const capitan = team.players.find(p => p.isCaptain);
      html += `
        <div class="card">
          <div class="flex-center" style="justify-content:space-between;flex-wrap:wrap;">
            <div class="flex-center"><img src="${team.shield||''}" style="width:2.5rem;height:2.5rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"><div><strong style="font-size:1rem;">${team.name}</strong><div style="font-size:0.65rem;color:var(--color-text-muted);">GLB ${team.glb||0} · ATK ${team.atk||0} · DEF ${team.def||0} · Presupuesto ${formatCurrency(team.budget||0)}${capitan ? ` · Capitán: ${capitan.name}` : ''}</div></div></div>
          </div>
          <div style="margin-top:0.4rem;">
            <div style="font-size:0.6rem;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;">Titulares</div>
            <div class="player-list">${titulares.map(p => `<span class="player-tag titular ${p.isCaptain?'captain':''}">${p.isCaptain?'👑 ':''}${p.name}</span>`).join('') || '<span class="text-muted" style="font-size:0.65rem;">Ninguno</span>'}</div>
            <div style="font-size:0.6rem;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:0.2rem;">Suplentes</div>
            <div class="player-list">${suplentes.map(p => `<span class="player-tag suplente">${p.name}</span>`).join('') || '<span class="text-muted" style="font-size:0.65rem;">Ninguno</span>'}</div>
            <div style="font-size:0.6rem;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:0.2rem;">Reservas (FB)</div>
            <div class="player-list">${reservas.map(p => `<span class="player-tag reserva">${p.name}</span>`).join('') || '<span class="text-muted" style="font-size:0.65rem;">Ninguno</span>'}</div>
          </div>
        </div>
      `;
    });
    return html;
  }

  // ---------- MERCADO (vista principal) ----------
  function renderMercado(torneo) {
    const allPlayers = [];
    torneo.teams.forEach(team => {
      team.players.forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || { pig:0 };
          // Mostrar rango con lvl
          const rankDisplay = p.rocketRank + (p.rocketRank !== 'SSL' ? ' lvl' + p.division : '');
          allPlayers.push({
            ...p,
            teamId: team.id,
            teamName: team.name,
            teamShield: team.shield,
            pig: s.pig || 0,
            marketValue: p.marketValue || 0,
            rocketRankDisplay: rankDisplay,
            isFree: false
          });
        }
      });
    });
    (torneo.freeAgents || []).forEach(p => {
      if (p.name && p.name.trim() !== '') {
        const s = p.seasonStats || { pig:0 };
        const rankDisplay = p.rocketRank + (p.rocketRank !== 'SSL' ? ' lvl' + p.division : '');
        allPlayers.push({
          ...p,
          teamId: null,
          teamName: 'Agente Libre',
          teamShield: '',
          pig: s.pig || 0,
          marketValue: p.marketValue || 0,
          rocketRankDisplay: rankDisplay,
          isFree: true
        });
      }
    });
    if (!allPlayers.length) return '<div class="empty-state"><i class="fa-solid fa-store-slash"></i>No hay jugadores en el mercado.</div>';

    const teamsOpts = torneo.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    const freeOpt = `<option value="free">Agentes Libres</option>`;

    let html = `
      <div class="filters">
        <select id="mercadoEquipo"><option value="all">Todos los equipos</option>${teamsOpts}${freeOpt}</select>
        <select id="mercadoOrden">
          <option value="precio-desc">Precio ↓</option>
          <option value="precio-asc">Precio ↑</option>
          <option value="pig-desc">PIG ↓</option>
          <option value="pig-asc">PIG ↑</option>
          <option value="nombre">Nombre A-Z</option>
          <option value="nombre-desc">Nombre Z-A</option>
        </select>
        <input id="mercadoBuscar" type="text" placeholder="Buscar jugador..." style="flex:1;min-width:120px;">
      </div>
      <div id="mercadoTablaContainer"></div>
    `;

    function renderMercadoTabla() {
      const equipo = document.getElementById('mercadoEquipo').value;
      const orden = document.getElementById('mercadoOrden').value;
      const busqueda = document.getElementById('mercadoBuscar').value.toLowerCase();

      let filtered = allPlayers;
      if (equipo === 'free') filtered = filtered.filter(p => p.isFree);
      else if (equipo !== 'all') filtered = filtered.filter(p => p.teamId === equipo);
      if (busqueda) filtered = filtered.filter(p => p.name.toLowerCase().includes(busqueda));

      switch (orden) {
        case 'precio-desc': filtered.sort((a,b) => (b.marketValue||0) - (a.marketValue||0)); break;
        case 'precio-asc': filtered.sort((a,b) => (a.marketValue||0) - (b.marketValue||0)); break;
        case 'pig-desc': filtered.sort((a,b) => (b.pig||0) - (a.pig||0)); break;
        case 'pig-asc': filtered.sort((a,b) => (a.pig||0) - (b.pig||0)); break;
        case 'nombre': filtered.sort((a,b) => a.name.localeCompare(b.name)); break;
        case 'nombre-desc': filtered.sort((a,b) => b.name.localeCompare(a.name)); break;
        default: break;
      }

      if (!filtered.length) {
        document.getElementById('mercadoTablaContainer').innerHTML = '<div class="empty-state"><i class="fa-solid fa-search"></i>No se encontraron jugadores.</div>';
        return;
      }

      let tabla = `<div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Equipo</th><th>PIG</th><th>Rango</th><th>Precio</th></tr></thead><tbody>`;
      filtered.forEach(p => {
        tabla += `
          <tr>
            <td class="flex-center"><img src="${p.teamShield||''}" class="shield-sm"> ${p.name} ${p.isCaptain ? '👑' : ''} ${p.isFree ? '🆓' : ''}</td>
            <td>${p.teamName}</td>
            <td>${(p.pig||0).toFixed(1)}</td>
            <td style="color:${getRankColor(p.rocketRank)};font-weight:700;">${p.rocketRankDisplay}</td>
            <td>${formatCurrency(p.marketValue||0)}</td>
          </tr>
        `;
      });
      tabla += '</tbody></table></div>';
      document.getElementById('mercadoTablaContainer').innerHTML = tabla;
    }

    setTimeout(() => {
      document.getElementById('mercadoEquipo').addEventListener('change', renderMercadoTabla);
      document.getElementById('mercadoOrden').addEventListener('change', renderMercadoTabla);
      document.getElementById('mercadoBuscar').addEventListener('input', renderMercadoTabla);
      renderMercadoTabla();
    }, 0);

    return html;
  }

  // ---------- VISTA PRECIOS (submenú) ----------
  function renderPrecios() {
    // Tabla base
    const BASE_PRICES = {
      'Bronce': { 1: 300, 2: 500, 3: 700 },
      'Plata': { 1: 800, 2: 1200, 3: 2000 },
      'Oro': { 1: 2500, 2: 3500, 3: 5000 },
      'Platino': { 1: 6000, 2: 8000, 3: 10000 },
      'Diamante': { 1: 15000, 2: 18000, 3: 22000 },
      'Campeón': { 1: 25000, 2: 40000, 3: 60000 },
      'Gran Campeón': { 1: 90000, 2: 120000, 3: 160000 },
      'SSL': { 1: 250000, 2: 250000, 3: 250000 }
    };
    const RANGOS = ['Bronce', 'Plata', 'Oro', 'Platino', 'Diamante', 'Campeón', 'Gran Campeón', 'SSL'];
    const LVLS = [1, 2, 3];

    let html = `
      <div class="section-title"><i class="fas fa-tag"></i> Precios agentes libres</div>
      <div class="card">
        <div class="card-header">💰 Precios base (sin rol)</div>
        <div class="table-wrap">
          <table class="price-table">
            <thead><tr><th>Rango</th><th>lvl 1</th><th>lvl 2</th><th>lvl 3</th></tr></thead>
            <tbody>
              ${RANGOS.map(rango => {
                const row = BASE_PRICES[rango];
                return `<tr><td class="rango-header">${rango}</td><td>${formatCurrency(row[1])}</td><td>${formatCurrency(row[2])}</td><td>${formatCurrency(row[3])}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

    // Tablas por rango con multiplicadores
    const ROLES = [
      { key: 'Capitán', mult: 1.8 },
      { key: 'Titular', mult: 1.4 },
      { key: 'Suplente', mult: 0.9 },
      { key: 'Reserva', mult: 0.6 }
    ];

    RANGOS.forEach(rango => {
      const row = BASE_PRICES[rango];
      if (!row) return;
      html += `<div class="card"><div class="card-header">${rango}</div><div class="table-wrap"><table class="price-table"><thead><tr><th>lvl</th><th>Base</th>`;
      ROLES.forEach(r => {
        html += `<th>${r.key} (x${r.mult})</th>`;
      });
      html += `</tr></thead><tbody>`;
      LVLS.forEach(lvl => {
        const base = row[lvl];
        html += `<tr><td><strong>${lvl}</strong></td><td>${formatCurrency(base)}</td>`;
        ROLES.forEach(r => {
          const price = Math.round(base * r.mult);
          html += `<td>${formatCurrency(price)}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div></div>`;
    });

    return html;
  }

  // ---------- ECONOMÍA ----------
  function renderEconomia(torneo) {
    if (!torneo.economyLogs || !torneo.economyLogs.length) return '<div class="empty-state"><i class="fa-solid fa-coins"></i>No hay movimientos económicos registrados.</div>';
    const logs = [...torneo.economyLogs].reverse();
    let html = `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Descripción</th><th>Monto</th></tr></thead><tbody>`;
    logs.forEach(log => {
      const team = torneo.teams.find(t => t.id === log.teamId);
      const teamName = team ? team.name : 'Desconocido';
      const teamShield = team ? team.shield : '';
      const isIncome = log.amount > 0;
      const sign = isIncome ? '+' : '';
      const color = isIncome ? 'var(--neon-green)' : 'var(--neon-red)';
      const date = new Date(log.date).toLocaleDateString('es-ES');
      html += `<tr><td style="font-size:0.65rem;">${date}</td><td class="flex-center"><img src="${teamShield}" class="shield-sm"> ${teamName}</td><td>${log.description}</td><td style="color:${color};font-weight:700;">${sign}${formatCurrency(log.amount)}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------- SANCIONES ----------
  function renderSanciones(torneo) {
    if (!torneo.sanctionsLog || !torneo.sanctionsLog.length) return '<div class="empty-state"><i class="fa-solid fa-gavel"></i>No hay sanciones registradas.</div>';
    const logs = [...torneo.sanctionsLog].filter(s => s.active !== false).reverse();
    if (!logs.length) return '<div class="empty-state"><i class="fa-solid fa-check-circle" style="color:var(--neon-green);"></i>No hay sanciones activas.</div>';
    let html = `<div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Equipo</th><th>Tipo</th><th>Motivo</th><th>Jornadas</th></tr></thead><tbody>`;
    logs.forEach(s => {
      const team = torneo.teams.find(t => t.id === s.teamId);
      const teamName = team ? team.name : 'Desconocido';
      const teamShield = team ? team.shield : '';
      const typeLabel = s.type === 'yellow' ? '🟨 Amonestación' : s.type === 'red' ? '🟥 Expulsión' : s.type === 'suspension' ? '🚫 Suspensión' : '💰 Multa';
      const rounds = s.roundEnd ? `J${s.roundStart} - J${s.roundEnd}` : `Desde J${s.roundStart}`;
      html += `<tr><td><strong>${s.playerName}</strong></td><td class="flex-center"><img src="${teamShield}" class="shield-sm"> ${teamName}</td><td>${typeLabel}</td><td>${s.reason}</td><td>${rounds}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------- SELECCIÓN NACIONAL ----------
  function renderSeleccion(torneo) {
    let national = null;
    if (torneo.nationalTeams) {
      national = torneo.nationalTeams.find(nt => nt.type === 'main');
      if (!national) national = torneo.nationalTeams[0];
    }
    if (!national || !national.players || !national.players.length) return '<div class="empty-state"><i class="fa-solid fa-flag"></i>No hay selección nacional configurada.</div>';

    let html = `<div class="card"><div class="flex-center" style="justify-content:space-between;"><span style="font-family:Montserrat,sans-serif;font-weight:900;font-size:1.2rem;">${national.name}</span><span style="font-size:0.65rem;color:var(--color-text-muted);">${national.type === 'main' ? '🇲🇽 Selección Nacional' : '🔵 Sub Selección'}</span></div><div style="display:flex;flex-wrap:wrap;gap:0.8rem;margin-top:0.4rem;justify-content:center;">`;
    national.players.forEach(p => {
      const rankColor = getRankColor(p.rocketRank || 'Platino');
      const rankDisplay = p.rocketRank + (p.rocketRank !== 'SSL' ? ' lvl' + p.division : '');
      html += `
        <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:0.5rem;text-align:center;min-width:90px;flex:1 0 auto;max-width:140px;">
          <div style="font-size:0.55rem;color:var(--color-text-muted);">${p.role||'Jugador'}</div>
          <img src="${p.shield||''}" style="width:2.5rem;height:2.5rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;margin:0.1rem auto;">
          <div style="font-weight:700;font-size:0.8rem;">${p.name}</div>
          <div style="font-size:0.55rem;color:${rankColor};">${rankDisplay}</div>
          <div style="font-size:0.6rem;color:var(--neon-yellow);">G${p.stats?.goals||0} A${p.stats?.assists||0} S${p.stats?.saves||0}</div>
        </div>
      `;
    });
    html += '</div></div>';
    const power = { atk: national.atk||0, def: national.def||0, glb: national.glb||0 };
    html += `<div class="card" style="margin-top:0.3rem;"><div class="flex-center" style="gap:0.8rem;flex-wrap:wrap;"><span><span class="power-badge atk">ATK ${power.atk}</span></span><span><span class="power-badge def">DEF ${power.def}</span></span><span><span class="power-badge glb">GLB ${power.glb}</span></span><span style="font-size:0.65rem;color:var(--color-text-muted);">Partidos: ${national.matchesPlayed||0}</span></div></div>`;
    return html;
  }

  // ---------- PARTIDOS AMISTOSOS ----------
  function renderAmistosos(torneo) {
    if (!torneo.friendlyMatches || !torneo.friendlyMatches.length) return '<div class="empty-state"><i class="fa-solid fa-handshake-slash"></i>No hay partidos amistosos.</div>';
    let html = '';
    torneo.friendlyMatches.forEach(fm => {
      const h = getTeamById(torneo.teams, fm.h);
      const a = getTeamById(torneo.teams, fm.a);
      const hName = h ? h.name : 'Desconocido';
      const aName = a ? a.name : 'Desconocido';
      const hShield = h ? h.shield : '';
      const aShield = a ? a.shield : '';
      const played = fm.played || false;
      const score = played ? `${fm.sH} - ${fm.sA}` : 'vs';
      const clickable = played ? `class="match-clickable" onclick="showMatchStats('${fm.id}')"` : '';
      html += `
        <div class="card">
          <div class="flex-center" style="justify-content:space-between;">
            <span class="flex-center"><img src="${hShield}" class="shield-sm"> ${hName}</span>
            <span style="font-weight:700;font-size:1.1rem;">${score}</span>
            <span class="flex-center">${aName} <img src="${aShield}" class="shield-sm"></span>
          </div>
          ${played ? `<div style="font-size:0.6rem;color:var(--color-text-muted);text-align:center;margin-top:0.2rem;">📊 Haz clic para ver estadísticas</div>` : ''}
        </div>
      `;
    });
    return html;
  }

  // ---------- SALÓN DE LA FAMA ----------
  function renderSalon(torneo) {
    if (!torneo.seasons || !torneo.seasons.length) return '<div class="empty-state"><i class="fa-solid fa-medal"></i>No hay temporadas guardadas.</div>';
    let html = '';
    torneo.seasons.slice().reverse().forEach((season, idx) => {
      const realIdx = torneo.seasons.length - idx;
      html += `<div class="card"><div class="card-header">Temporada ${realIdx} - ${new Date(season.date).toLocaleDateString('es-ES')}</div>`;
      const champ = season.champion ? season.teams.find(t => t.id === season.champion) : null;
      if (champ) {
        html += `<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.3rem;"><span style="font-size:1.3rem;">🏆</span><img src="${champ.shield||''}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#000;border:1px solid var(--color-border);object-fit:contain;"><strong>${champ.name}</strong> <span style="font-size:0.65rem;color:var(--color-text-muted);">${champ.pts||0} pts</span></div>`;
      }
      const dt = season.dreamTeam || {};
      if (dt.goleador || dt.asistidor || dt.portero) {
        html += `<div style="font-size:0.65rem;display:flex;flex-wrap:wrap;gap:0.3rem 1rem;margin:0.2rem 0;">`;
        if (dt.goleador) html += `<span><span class="text-neon-green">⚽</span> ${dt.goleador.name} (${dt.goleador.g} goles)</span>`;
        if (dt.asistidor) html += `<span><span class="text-neon-cyan">🎯</span> ${dt.asistidor.name} (${dt.asistidor.a} asistencias)</span>`;
        if (dt.portero) html += `<span><span class="text-neon-pink">🧤</span> ${dt.portero.name} (${dt.portero.s} salvadas)</span>`;
        html += '</div>';
      }
      if (season.topPlayers && season.topPlayers.length) {
        html += `<div style="font-size:0.65rem;color:var(--color-text-muted);margin-top:0.2rem;">Top PIG: ${season.topPlayers.slice(0,3).map(p => `${p.name} (${(p.imp||0).toFixed(1)})`).join(' · ')}</div>`;
      }
      html += '</div>';
    });
    return html;
  }

  // ==========================================
  // CONSTRUCCIÓN DE LA INTERFAZ (con submenús)
  // ==========================================
  function buildUI(torneo) {
    // Generar menú con soporte para submenús
    let navHtml = '';
    MENU_ITEMS.forEach(item => {
      if (item.children && item.children.length) {
        // Elemento padre con hijos
        navHtml += `
          <div class="nav-parent" id="nav-parent-${item.id}">
            <button class="nav-toggle" onclick="toggleParent('${item.id}')">
              <i class="fas ${item.icon}"></i> ${item.label}
              <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </button>
            <div class="nav-children">
              ${item.children.map(child => `
                <div class="nav-item" data-section="${child.id}" onclick="switchView('${child.id}')">
                  <i class="fas ${child.icon}"></i> ${child.label}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        // Elemento normal
        navHtml += `
          <div class="nav-item" data-section="${item.id}" onclick="switchView('${item.id}')">
            <i class="fas ${item.icon}"></i> ${item.label}
          </div>
        `;
      }
    });
    mainNav.innerHTML = navHtml;

    // Generar secciones
    let sectionsHtml = '';
    MENU_ITEMS.forEach(item => {
      let content = '', printBtn = '';
      // Manejar hijos como secciones independientes
      const ids = [item.id];
      if (item.children) ids.push(...item.children.map(c => c.id));
      ids.forEach(id => {
        let contentFn = null;
        let title = '';
        let icon = '';
        let printFn = null;
        switch (id) {
          case 'tabla': contentFn = renderTabla; title = 'Tabla General'; icon = 'fa-table'; printFn = printTablaGeneral; break;
          case 'media': contentFn = renderMedia; title = 'Tabla de Media'; icon = 'fa-chart-simple'; printFn = printTablaMedia; break;
          case 'jornadas': contentFn = renderJornadas; title = 'Jornadas'; icon = 'fa-calendar-day'; printFn = printJornada; break;
          case 'playoffs': contentFn = renderPlayoffs; title = 'PlayOffs'; icon = 'fa-sitemap'; printFn = null; break;
          case 'stats': contentFn = renderStats; title = 'Stats'; icon = 'fa-chart-bar'; printFn = printStats; break;
          case 'balon': contentFn = renderBalon; title = 'Balón de Oro'; icon = 'fa-trophy'; printFn = printBalon; break;
          case 'equipos': contentFn = renderEquipos; title = 'Equipos'; icon = 'fa-users'; printFn = printEquipos; break;
          case 'mercado': contentFn = renderMercado; title = 'Mercado'; icon = 'fa-store'; printFn = printMercado; break;
          case 'precios': contentFn = renderPrecios; title = 'Precios agentes libres'; icon = 'fa-tag'; printFn = null; break;
          case 'economia': contentFn = renderEconomia; title = 'Mov. Económicos'; icon = 'fa-coins'; printFn = printEconomia; break;
          case 'sanciones': contentFn = renderSanciones; title = 'Sanciones'; icon = 'fa-gavel'; printFn = printSanciones; break;
          case 'seleccion': contentFn = renderSeleccion; title = 'Selección Nacional'; icon = 'fa-flag'; printFn = printSeleccion; break;
          case 'amistosos': contentFn = renderAmistosos; title = 'Partidos Amistosos'; icon = 'fa-handshake'; printFn = printAmistosos; break;
          case 'salon': contentFn = renderSalon; title = 'Salón de la Fama'; icon = 'fa-medal'; printFn = printSalon; break;
          default: contentFn = () => '<div class="empty-state">Sección no implementada</div>';
        }
        if (contentFn) {
          const contentData = contentFn(torneo);
          const printBtnHtml = printFn ? `<button class="print-btn" onclick="window['${printFn.name}']()"><i class="fas fa-print"></i> Imprimir</button>` : '';
          sectionsHtml += `
            <div class="section" id="section-${id}">
              <div class="section-title"><i class="fas ${icon}"></i> ${title} ${printBtnHtml}</div>
              ${contentData}
            </div>
          `;
        }
      });
    });
    sectionsContainer.innerHTML = sectionsHtml;

    // Eventos de navegación para ítems normales
    document.querySelectorAll('.nav-item:not(.nav-parent .nav-item)').forEach(el => {
      el.addEventListener('click', function() {
        const sectionId = this.dataset.section;
        if (sectionId) switchView(sectionId);
        if (window.innerWidth <= 820) sidebar.classList.remove('open');
      });
    });

    // Para los hijos del submenú, ya tienen onclick directo en el HTML, pero también debemos manejar el cierre en móvil
    document.querySelectorAll('.nav-parent .nav-item').forEach(el => {
      el.addEventListener('click', function() {
        if (window.innerWidth <= 820) {
          // No cerramos el sidebar para que pueda navegar entre mercado y precios
        }
      });
    });

    // Activar vista por defecto
    switchView('tabla');
  }

  function toggleParent(id) {
    const parent = document.getElementById('nav-parent-' + id);
    if (!parent) return;
    parent.classList.toggle('open');
    // Si es "mercado" y la vista actual no es mercado ni precios, cambiar a mercado
    if (id === 'mercado') {
      const current = currentSection;
      if (current !== 'mercado' && current !== 'precios') {
        switchView('mercado');
      } else {
        // Si ya estamos en mercado o precios, solo toggle
      }
    }
  }

  function switchView(id) {
    // Ocultar todas las secciones
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    const target = document.getElementById('section-' + id);
    if (target) target.classList.add('active');
    // Actualizar navegación
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.section === id);
    });
    // Para el padre, marcar como activo si es mercado o precios
    const parentMercado = document.getElementById('nav-parent-mercado');
    if (parentMercado) {
      const isMercadoOrPrecios = (id === 'mercado' || id === 'precios');
      parentMercado.classList.toggle('active', isMercadoOrPrecios);
      if (isMercadoOrPrecios) {
        parentMercado.classList.add('open');
      }
    }
    currentSection = id;
  }

  // ==========================================
  // FUNCIONES DE IMPRESIÓN (con cabecera)

      `<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
    showPrintModal(html, 'tabla_general.jpg', 900);

      `<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;

  function printStats() {
    const statOptions = `<option value="goals">Goleadores</option><option value="assists">Asistencias</option><option value="saves">Salvadas</option><option value="shots">Tiros</option><option value="mvp">MVPs</option>`;
    const topOptions = [3,5,10,15,20].map(n => `<option value="${n}">Top ${n}</option>`).join('');
    const modal = document.createElement('div');
    modal.className = 'print-modal-overlay';
    modal.innerHTML = `
      <div class="print-modal" style="max-width:450px;">
        <h3>Imprimir Stats</h3>
        <div style="margin:0.4rem 0;"><label style="font-size:0.7rem;color:#94a3b8;">Estadística</label><select id="print-stats-type" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">${statOptions}</select></div>
        <div id="print-stats-top-container"><label style="font-size:0.7rem;color:#94a3b8;">Top N</label><select id="print-stats-top" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">${topOptions}</select></div>
        <div id="print-stats-jornada-container" style="display:none;"><label style="font-size:0.7rem;color:#94a3b8;">Jornada</label><select id="print-stats-jornada" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">${data.rounds ? data.rounds.map((_,i)=>`<option value="${i}">Jornada ${i+1}</option>`).join('') : ''}</select></div>
        <div class="actions">
          <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cancelar</button>
          <button class="btn-download" onclick="confirmPrintStats()">Descargar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    document.getElementById('print-stats-type').addEventListener('change', function() {
      const isMvp = this.value === 'mvp';
      document.getElementById('print-stats-top-container').style.display = isMvp ? 'none' : 'block';
      document.getElementById('print-stats-jornada-container').style.display = isMvp ? 'block' : 'none';
    });

    window.confirmPrintStats = function() {
      const type = document.getElementById('print-stats-type').value;
      const topN = parseInt(document.getElementById('print-stats-top').value) || 10;
      const jornadaIdx = parseInt(document.getElementById('print-stats-jornada')?.value || 0);

      if (type === 'mvp') {
        const content = renderMvpForJornada(data, jornadaIdx);
        const html = getPrintHeader(`MVPs - Jornada ${jornadaIdx+1}`) + content +
          `<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
        showPrintModal(html, `mvps_jornada_${jornadaIdx+1}.jpg`, 700);
        modal.remove();
        return;
      }

      const allPlayers = [];
      data.teams.forEach(team => {
        team.players.forEach(p => {
          if (p.name && p.name.trim() !== '') {
            const s = p.seasonStats || {};
            allPlayers.push({ ...p, teamName: team.name, teamShield: team.shield, goals: s.goals||0, assists: s.assists||0, saves: s.saves||0, shots: s.shots||0, pig: s.pig||0 });
          }
        });
      });
      const keyMap = { goals:'goals', assists:'assists', saves:'saves', shots:'shots' };
      const labelMap = { goals:'Goles', assists:'Asistencias', saves:'Salvadas', shots:'Tiros' };
      const key = keyMap[type];
      if (!key) return alert('Tipo no válido.');
      const sorted = [...allPlayers].sort((a,b) => (b[key]||0) - (a[key]||0));
      const top = sorted.slice(0, topN);
      let html = getPrintHeader(`${labelMap[type]} - Top ${topN}`) +
        `<table style="width:100%;border-collapse:collapse;font-size:0.7rem;margin-top:0.2rem;"><thead><tr style="background:#1e1e2f;"><th style="padding:0.3rem 0.5rem;">#</th><th style="padding:0.3rem 0.5rem;text-align:left;">Jugador</th><th style="padding:0.3rem 0.5rem;text-align:left;">Equipo</th><th style="padding:0.3rem 0.5rem;text-align:right;">${labelMap[type]}</th></tr></thead><tbody>`;
      top.forEach((p, i) => {
        html += `<tr style="border-bottom:1px solid #2d2d44;"><td style="padding:0.2rem 0.5rem;">${i+1}</td><td style="padding:0.2rem 0.5rem;display:flex;align-items:center;gap:0.4rem;"><img src="${p.teamShield||''}" style="width:1.4rem;height:1.4rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ${p.name}</td><td style="padding:0.2rem 0.5rem;">${p.teamName}</td><td style="padding:0.2rem 0.5rem;text-align:right;font-weight:700;">${p[key]||0}</td></tr>`;
      });
      html += '</tbody></table>';
      html += `<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
      showPrintModal(html, `stats_${type}_top${topN}.jpg`, 700);
      modal.remove();
    };
  }

  function printBalon() {
    const topOptions = [3,5,10,15].map(n => `<option value="${n}">Top ${n}</option>`).join('');
    const modal = document.createElement('div');
    modal.className = 'print-modal-overlay';
    modal.innerHTML = `
      <div class="print-modal" style="max-width:400px;">
        <h3>Balón de Oro</h3>
        <div style="margin:0.4rem 0;"><label style="font-size:0.7rem;color:#94a3b8;">Top N</label><select id="print-balon-top" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">${topOptions}</select></div>
        <div class="actions">
          <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cancelar</button>
          <button class="btn-download" onclick="confirmPrintBalon()">Descargar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    window.confirmPrintBalon = function() {
      const topN = parseInt(document.getElementById('print-balon-top').value) || 3;
      const allPlayers = [];
      data.teams.forEach(team => {
        team.players.forEach(p => {
          if (p.name && p.name.trim() !== '') {
            const s = p.seasonStats || { pig:0 };
            allPlayers.push({ ...p, teamName: team.name, teamShield: team.shield, pig: s.pig || 0 });
          }
        });
      });
      const sorted = [...allPlayers].sort((a,b) => (b.pig||0) - (a.pig||0));
      const top = sorted.slice(0, topN);

      let html = getPrintHeader(`Balón de Oro - Top ${topN}`);
      if (topN >= 3) {
        html += `<div style="display:flex;justify-content:center;align-items:flex-end;gap:1.2rem;margin:0.4rem 0;padding:0.2rem;">`;
        const podiumClasses = ['first','second','third'];
        [0,1,2].forEach(i => {
          if (top[i]) {
            const p = top[i];
            let displayName = p.name;
            if (displayName.length > 14) displayName = displayName.substring(0, 12) + '…';
            const isFirst = i === 0;
            const circleSize = isFirst ? '3.5rem' : (i === 1 ? '3rem' : '2.5rem');
            const marginTop = isFirst ? '0' : (i === 1 ? '0.5rem' : '1.2rem');
            html += `
              <div style="text-align:center;order:${isFirst ? 2 : (i === 1 ? 1 : 3)};margin-top:${marginTop};">
                <div style="font-size:0.6rem;color:#94a3b8;">#${i+1}</div>
                <div style="width:${circleSize};height:${circleSize};border-radius:50%;background:#000;border:2px solid ${i===0?'#facc15':i===1?'#94a3b8':'#b45309'};margin:0.1rem auto;overflow:hidden;display:flex;align-items:center;justify-content:center;">
                  <img src="${p.teamShield||''}" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none';this.parentElement.textContent='#${i+1}';this.parentElement.style.color='#fff';this.parentElement.style.fontSize='1rem';" />
                </div>
                <div style="font-weight:700;font-size:0.8rem;color:#e2e8f0;">${displayName}</div>
                <div style="font-size:0.7rem;color:var(--neon-yellow);">${(p.pig||0).toFixed(1)} PIG</div>
                <div style="font-size:0.5rem;color:#94a3b8;">${p.teamName}</div>
              </div>
            `;
          }
        });
        html += '</div>';
      }
      const rest = top.slice(3);
      if (rest.length) {
        html += `<table style="width:100%;border-collapse:collapse;font-size:0.7rem;margin-top:0.2rem;"><thead><tr style="background:#1e1e2f;"><th style="padding:0.3rem 0.5rem;">#</th><th style="padding:0.3rem 0.5rem;text-align:left;">Jugador</th><th style="padding:0.3rem 0.5rem;text-align:left;">Equipo</th><th style="padding:0.3rem 0.5rem;text-align:right;">PIG</th></tr></thead><tbody>`;
        rest.forEach((p, i) => {
          html += `<tr style="border-bottom:1px solid #2d2d44;"><td style="padding:0.2rem 0.5rem;">${i+4}</td><td style="padding:0.2rem 0.5rem;display:flex;align-items:center;gap:0.4rem;"><img src="${p.teamShield||''}" style="width:1.4rem;height:1.4rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ${p.name}</td><td style="padding:0.2rem 0.5rem;">${p.teamName}</td><td style="padding:0.2rem 0.5rem;text-align:right;font-weight:700;">${(p.pig||0).toFixed(1)}</td></tr>`;
        });
        html += '</tbody></table>';
      }
      html += `<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
      showPrintModal(html, `balon_oro_top${topN}.jpg`, 700);
      modal.remove();
    };
  }

  function printEquipos() {
    const teams = data.teams || [];
    const options = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    const modal = document.createElement('div');
    modal.className = 'print-modal-overlay';
    modal.innerHTML = `
      <div class="print-modal" style="max-width:400px;">
        <h3>Imprimir Equipos</h3>
        <div style="margin:0.4rem 0;"><label style="font-size:0.7rem;color:#94a3b8;">Equipo</label><select id="print-equipo-select" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;"><option value="all">Todos</option>${options}</select></div>
        <div class="actions">
          <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cancelar</button>
          <button class="btn-download" onclick="confirmPrintEquipos()">Descargar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    window.confirmPrintEquipos = function() {
      const equipoId = document.getElementById('print-equipo-select').value;
      let html = getPrintHeader(`${equipoId === 'all' ? 'Todos los equipos' : getTeamById(data.teams, equipoId)?.name || 'Equipo'}`);
      const teamsToPrint = equipoId === 'all' ? data.teams : [getTeamById(data.teams, equipoId)].filter(Boolean);
      if (!teamsToPrint.length) return alert('Equipo no encontrado.');
      teamsToPrint.forEach(team => {
        const titulares = team.players.filter(p => p.role === 'Titular 🌟' && p.name && p.name.trim() !== '');
        const suplentes = team.players.filter(p => p.role === 'Suplente 🔄' && p.name && p.name.trim() !== '');
        const reservas = team.players.filter(p => p.role === 'Reserva 💤' && p.name && p.name.trim() !== '');
        const capitan = team.players.find(p => p.isCaptain);
        html += `<div style="margin:0.3rem 0;padding:0.4rem;border:1px solid #2d2d44;border-radius:8px;"><div style="display:flex;align-items:center;gap:0.5rem;"><img src="${team.shield||''}" style="width:2rem;height:2rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"><div><strong>${team.name}</strong> <span style="font-size:0.6rem;color:#94a3b8;">GLB ${team.glb||0} · ATK ${team.atk||0} · DEF ${team.def||0}</span>${capitan ? ` · Capitán: ${capitan.name}` : ''}</div></div>`;
        html += `<div style="font-size:0.6rem;margin-top:0.2rem;"><span style="color:var(--neon-cyan);">Titulares:</span> ${titulares.map(p => p.name).join(', ') || 'Ninguno'}</div>`;
        html += `<div style="font-size:0.6rem;"><span style="color:var(--neon-pink);">Suplentes:</span> ${suplentes.map(p => p.name).join(', ') || 'Ninguno'}</div>`;
        html += `<div style="font-size:0.6rem;"><span style="color:#94a3b8;">Reservas:</span> ${reservas.map(p => p.name).join(', ') || 'Ninguno'}</div>`;
        html += '</div>';
      });
      html += `<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
      showPrintModal(html, `equipos_${equipoId}.jpg`, 700);
      modal.remove();
    };
  }

  function printMercado() {
    const modal = document.createElement('div');
    modal.className = 'print-modal-overlay';
    modal.innerHTML = `
      <div class="print-modal" style="max-width:450px;">
        <h3>Imprimir Mercado</h3>
        <div style="margin:0.4rem 0;"><label style="font-size:0.7rem;color:#94a3b8;">Tipo</label><select id="print-mercado-tipo" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;"><option value="caros">Jugadores más caros</option><option value="equipo">Jugadores de equipo</option></select></div>
        <div id="print-mercado-top-container"><label style="font-size:0.7rem;color:#94a3b8;">Top N</label><select id="print-mercado-top" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">${[3,5,10,15,20].map(n => `<option value="${n}">Top ${n}</option>`).join('')}<option value="custom">Personalizado</option></select><input id="print-mercado-top-custom" type="number" min="1" max="20" placeholder="Cantidad" style="display:none;width:100%;padding:0.3rem;margin-top:0.3rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;"></div>
        <div id="print-mercado-equipo-container" style="display:none;"><label style="font-size:0.7rem;color:#94a3b8;">Equipo</label><select id="print-mercado-equipo" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;">${data.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}</select><label style="font-size:0.7rem;color:#94a3b8;margin-top:0.3rem;display:block;">Orden</label><select id="print-mercado-orden" style="width:100%;padding:0.4rem;background:#0a0a0f;color:#fff;border:1px solid var(--color-border);border-radius:8px;"><option value="precio-desc">Más caro a más barato</option><option value="precio-asc">Más barato a más caro</option></select></div>
        <div class="actions">
          <button class="btn-cancel" onclick="this.closest('.print-modal-overlay').remove()">Cancelar</button>
          <button class="btn-download" onclick="confirmPrintMercado()">Descargar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    document.getElementById('print-mercado-tipo').addEventListener('change', function() {
      const isCaros = this.value === 'caros';
      document.getElementById('print-mercado-top-container').style.display = isCaros ? 'block' : 'none';
      document.getElementById('print-mercado-equipo-container').style.display = isCaros ? 'none' : 'block';
    });
    document.getElementById('print-mercado-top').addEventListener('change', function() {
      document.getElementById('print-mercado-top-custom').style.display = this.value === 'custom' ? 'block' : 'none';
    });

    window.confirmPrintMercado = function() {
      const tipo = document.getElementById('print-mercado-tipo').value;
      let topN = parseInt(document.getElementById('print-mercado-top').value);
      if (document.getElementById('print-mercado-top').value === 'custom') {
        topN = parseInt(document.getElementById('print-mercado-top-custom').value) || 10;
        if (topN < 1) topN = 1;
        if (topN > 20) topN = 20;
      }
      const allPlayers = [];
      data.teams.forEach(team => {
        team.players.forEach(p => {
          if (p.name && p.name.trim() !== '') {
            const s = p.seasonStats || { pig:0 };
            allPlayers.push({ ...p, teamId: team.id, teamName: team.name, teamShield: team.shield, pig: s.pig || 0, marketValue: p.marketValue || 0 });
          }
        });
      });
      (data.freeAgents || []).forEach(p => {
        if (p.name && p.name.trim() !== '') {
          const s = p.seasonStats || { pig:0 };
          allPlayers.push({ ...p, teamId: null, teamName: 'Agente Libre', teamShield: '', pig: s.pig || 0, marketValue: p.marketValue || 0 });
        }
      });
      let filtered = [], title = '';
      if (tipo === 'caros') {
        filtered = [...allPlayers].sort((a,b) => (b.marketValue||0) - (a.marketValue||0)).slice(0, topN);
        title = `Jugadores más caros - Top ${topN}`;
      } else {
        const equipoId = document.getElementById('print-mercado-equipo').value;
        const orden = document.getElementById('print-mercado-orden').value;
        // CORREGIDO: comparar como strings
        filtered = allPlayers.filter(p => String(p.teamId) === String(equipoId));
        if (orden === 'precio-desc') filtered.sort((a,b) => (b.marketValue||0) - (a.marketValue||0));
        else filtered.sort((a,b) => (a.marketValue||0) - (b.marketValue||0));
        const team = getTeamById(data.teams, equipoId);
        title = `Jugadores de ${team ? team.name : '?'}`;
      }
      if (!filtered.length) {
        alert('No hay jugadores para mostrar.');
        modal.remove();
        return;
      }
      let html = getPrintHeader(title) +
        `<table style="width:100%;border-collapse:collapse;font-size:0.7rem;margin-top:0.2rem;"><thead><tr style="background:#1e1e2f;"><th style="padding:0.3rem 0.5rem;">Jugador</th><th style="padding:0.3rem 0.5rem;">Equipo</th><th style="padding:0.3rem 0.5rem;text-align:right;">Precio</th></tr></thead><tbody>`;
      filtered.forEach(p => {
        html += `<tr style="border-bottom:1px solid #2d2d44;"><td style="padding:0.2rem 0.5rem;display:flex;align-items:center;gap:0.4rem;"><img src="${p.teamShield||''}" style="width:1.4rem;height:1.4rem;border-radius:50%;background:#000;border:1px solid #2d2d44;object-fit:contain;"> ${p.name}</td><td style="padding:0.2rem 0.5rem;">${p.teamName}</td><td style="padding:0.2rem 0.5rem;text-align:right;font-weight:700;">${formatCurrency(p.marketValue||0)}</td></tr>`;
      });
      html += '</tbody></table>';
      html += `<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
      showPrintModal(html, `mercado_${tipo}.jpg`, 700);
      modal.remove();
    };
  }

  function printAmistosos() {

  function printSalon() {

    if (!container) return alert('No hay salón para imprimir.');

    const btn = clone.querySelector('.print-btn');
    if (btn) btn.remove();
    const title = clone.querySelector('.section-title');
    if (title) title.innerHTML = '<span style="font-family:Montserrat,sans-serif;color:var(--neon-purple);font-weight:900;font-size:1.1rem;">Salón de la Fama</span>';
    const html = getPrintHeader('Salón de la Fama') + clone.innerHTML +
      `<div style="margin-top:0.3rem;font-size:0.55rem;color:#94a3b8;">${data.name} · Generado desde MTM Nexus</div>`;
    showPrintModal(html, 'salon_fama.jpg', 800);
  }

  // ==========================================
  // CARGA DE DATOS
  // ==========================================
  async function loadData() {
    try {
      const resp = await fetch('datos.json');
      if (!resp.ok) throw new Error('No se pudo cargar datos.json');
      const raw = await resp.json();
      let torneo = raw;
      if (raw.tournaments && Array.isArray(raw.tournaments) && raw.tournaments.length) {
        torneo = raw.tournaments[0];
      }
      data = torneo;
      loadCustomThemes();
      loadPreferences();
      buildUI(torneo);
      loadLogo('logo.png', 'logo.jpg');
    } catch (err) {
      console.error(err);
      sectionsContainer.innerHTML = `
        <div class="empty-state" style="padding:2rem;">
          <i class="fa-solid fa-triangle-exclamation" style="font-size:2.5rem;color:var(--neon-red);"></i>
          <p style="font-size:1rem;margin-top:0.5rem;">Error al cargar los datos.</p>
          <p style="font-size:0.8rem;color:var(--color-text-muted);">Asegúrate de que el archivo <strong>datos.json</strong> esté en la misma carpeta y sea un JSON válido.</p>
          <p style="font-size:0.7rem;color:var(--color-text-muted);">${err.message}</p>
        </div>
      `;
    }
  }

  // ==========================================
  // EVENTOS DEL SIDEBAR (móvil)
  // ==========================================
  hamburgerBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if (window.innerWidth <= 820) {
      if (!sidebar.contains(e.target) && e.target !== hamburgerBtn && !hamburgerBtn.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    }
  });

  loadData();
</script>
