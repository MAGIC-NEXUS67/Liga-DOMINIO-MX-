<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magic Nexus – Visor de Torneo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <h1>MAGIC <span>NEXUS</span></h1>
        <p id="tournament-name">Visor de Torneo</p>
      </div>
      <nav id="sidebar-nav">
        <ul>
          <li><a href="#" data-view="tabla-general"><i class="fas fa-table"></i> Tabla general</a></li>
          <li><a href="#" data-view="tabla-media"><i class="fas fa-chart-simple"></i> Tabla de Media</a></li>
          <li><a href="#" data-view="jornadas"><i class="fas fa-calendar-day"></i> Jornadas</a></li>
          <li><a href="#" data-view="playoffs"><i class="fas fa-sitemap"></i> PlayOffs</a></li>
          <li><a href="#" data-view="stats"><i class="fas fa-chart-bar"></i> Stats</a></li>
          <li><a href="#" data-view="balon-oro"><i class="fas fa-trophy"></i> Balón de Oro</a></li>
          <li><a href="#" data-view="equipos"><i class="fas fa-users"></i> Equipos</a></li>
          <li><a href="#" data-view="mercado"><i class="fas fa-store"></i> Mercado</a></li>
          <li><a href="#" data-view="economia"><i class="fas fa-coins"></i> Movimientos Económicos</a></li>
          <li><a href="#" data-view="sanciones"><i class="fas fa-gavel"></i> Sanciones</a></li>
          <li><a href="#" data-view="seleccion"><i class="fas fa-flag"></i> Selección Nacional</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <span>KERNEL X v3.6</span>
      </div>
    </aside>

    <!-- Botón hamburguesa (móvil) -->
    <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menú">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Contenido principal -->
    <main id="main-content">
      <header id="main-header">
        <h2 id="view-title">Tabla general</h2>
      </header>
      <div id="view-container">
        <!-- El contenido se renderiza aquí dinámicamente -->
        <div class="loading-container">
          <div class="loader"></div>
          <p>Cargando datos del torneo...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ============================================
    // CARGA DE DATOS DESDE JSON (OPCIÓN 2)
    // ============================================
    
    // Variable global que contendrá los datos del torneo
    let torneoData = null;
    
    // Función principal que se ejecuta cuando los datos están cargados
    function iniciarVisor() {
      // Verificar que los datos se cargaron correctamente
      if (!torneoData || !torneoData.teams) {
        console.warn('No se encontraron datos válidos. Usando datos de ejemplo mínimos.');
        torneoData = {
          name: 'Torneo de Ejemplo',
          teams: [],
          rounds: [],
          playoffs: null,
          tableConfig: { liguilla: 8, descenso: 2, ascenso: 2 },
          economyLogs: [],
          sanctionsLog: [],
          nationalTeams: []
        };
      }
      
      // Actualizar nombre del torneo en el sidebar
      const nameEl = document.getElementById('tournament-name');
      if (nameEl && torneoData.name) {
        nameEl.textContent = torneoData.name;
      }
      
      // Inicializar la aplicación con los datos cargados
      inicializarApp(torneoData);
    }

    // ============================================
    // CARGA DEL ARCHIVO JSON
    // ============================================
    function cargarDatos() {
      const container = document.getElementById('view-container');
      
      fetch('datos.json')
        .then(response => {
          if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status} - ${response.statusText}`);
          }
          return response.json();
        })
        .then(data => {
          console.log('✅ Datos cargados correctamente desde datos.json');
          torneoData = data;
          iniciarVisor();
        })
        .catch(err => {
          console.error('❌ Error cargando datos.json:', err);
          container.innerHTML = `
            <div class="error-container">
              <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:var(--neon-red);"></i>
              <h3 style="color:var(--neon-red);">Error al cargar los datos</h3>
              <p>No se pudo cargar el archivo <strong>datos.json</strong>.</p>
              <p style="font-size:0.85rem;color:var(--color-text-muted);">
                Asegúrate de que el archivo <strong>datos.json</strong> esté en la misma carpeta que este HTML.<br>
                Si estás usando un servidor local, verifica que el archivo sea accesible.
              </p>
              <details style="margin-top:1rem;text-align:left;font-size:0.8rem;color:var(--color-text-muted);">
                <summary>Ver detalles del error</summary>
                <pre style="background:rgba(0,0,0,0.5);padding:0.5rem;border-radius:6px;margin-top:0.5rem;overflow-x:auto;">${err.message}</pre>
              </details>
              <button onclick="cargarDatos()" class="btn-reintentar" style="margin-top:1rem;padding:0.5rem 1.5rem;border-radius:8px;background:var(--neon-cyan);color:#000;border:none;font-weight:700;cursor:pointer;">
                <i class="fas fa-sync-alt"></i> Reintentar
              </button>
              <button onclick="cargarDatosEjemplo()" class="btn-ejemplo" style="margin-top:0.5rem;padding:0.5rem 1.5rem;border-radius:8px;background:var(--color-surface);color:#fff;border:1px solid var(--color-border);font-weight:700;cursor:pointer;">
                <i class="fas fa-file-alt"></i> Cargar datos de ejemplo
              </button>
            </div>
          `;
        });
    }

    // ============================================
    // DATOS DE EJEMPLO (FALLBACK)
    // ============================================
    function cargarDatosEjemplo() {
      console.log('📂 Cargando datos de ejemplo...');
      torneoData = {
        name: 'Torneo de Ejemplo (Sin datos reales)',
        teams: [
          {
            id: 'eq1',
            name: 'Equipo A',
            shield: '',
            players: [
              { id: 'p1', name: 'Jugador 1', role: 'Titular 🌟', rocketRank: 'Platino', division: 2, seasonStats: { goals: 5, assists: 3, saves: 2, pig: 15.5 }, marketValue: 25000, isCaptain: true },
              { id: 'p2', name: 'Jugador 2', role: 'Suplente 🔄', rocketRank: 'Oro', division: 2, seasonStats: { goals: 2, assists: 1, saves: 0, pig: 5.5 }, marketValue: 10000 }
            ],
            budget: 100000,
            totalValue: 35000,
            glb: 120,
            pts: 6,
            pj: 3,
            pg: 2,
            pe: 0,
            pp: 1,
            gf: 8,
            gc: 4
          },
          {
            id: 'eq2',
            name: 'Equipo B',
            shield: '',
            players: [
              { id: 'p3', name: 'Jugador 3', role: 'Titular 🌟', rocketRank: 'Diamante', division: 1, seasonStats: { goals: 8, assists: 4, saves: 3, pig: 24.5 }, marketValue: 45000, isCaptain: true }
            ],
            budget: 75000,
            totalValue: 45000,
            glb: 150,
            pts: 9,
            pj: 3,
            pg: 3,
            pe: 0,
            pp: 0,
            gf: 12,
            gc: 2
          }
        ],
        rounds: [],
        playoffs: null,
        tableConfig: { liguilla: 8, descenso: 2, ascenso: 2 },
        economyLogs: [],
        sanctionsLog: [],
        nationalTeams: []
      };
      iniciarVisor();
    }

    // ============================================
    // APLICACIÓN PRINCIPAL
    // ============================================
    function inicializarApp(data) {
      // -------- UTILIDADES --------
      const $ = (sel, ctx=document) => ctx.querySelector(sel);
      const $$ = (sel, ctx=document) => [...ctx.querySelectorAll(sel)];

      // Formatear moneda
      function formatCurrency(amount) {
        if (amount >= 1e6) return '$' + (amount/1e6).toFixed(1) + 'M';
        if (amount >= 1e3) return '$' + (amount/1e3).toFixed(0) + 'K';
        return '$' + Math.round(amount);
      }

      // Obtener color del rango
      function rankColor(rank) {
        const colors = {
          'Bronce': '#cd7f32',
          'Plata': '#c0c0c0',
          'Oro': '#ffd700',
          'Platino': '#e5e4e2',
          'Diamante': '#b9f2ff',
          'Campeón': '#ff6b6b',
          'Gran Campeón': '#ff4757',
          'SSL': '#ff4757'
        };
        return colors[rank] || '#fff';
      }

      // Estrellas GLB
      function glbStars(glb) {
        if (glb >= 450) return '★★★★★';
        if (glb >= 350) return '★★★★☆';
        if (glb >= 250) return '★★★☆☆';
        if (glb >= 150) return '★★☆☆☆';
        if (glb >= 70) return '★☆☆☆☆';
        return '☆☆☆☆☆';
      }

      // -------- DATOS --------
      const teams = data.teams || [];
      const rounds = data.rounds || [];
      const playoffs = data.playoffs || null;
      const tableConfig = data.tableConfig || { liguilla: 8, descenso: 2, ascenso: 2 };
      const economyLogs = data.economyLogs || [];
      const sanctionsLog = data.sanctionsLog || [];
      const nationalTeams = data.nationalTeams || [];

      // -------- RENDERIZADORES --------
      const views = {};

      // 1. Tabla general
      views['tabla-general'] = function() {
        if (!teams.length) return '<p class="empty">No hay equipos.</p>';
        const sorted = [...teams].sort((a,b) => 
          (b.pts||0) - (a.pts||0) || 
          ((b.gf||0)-(b.gc||0)) - ((a.gf||0)-(a.gc||0)) || 
          (b.gf||0) - (a.gf||0)
        );
        const lig = tableConfig.liguilla || 8;
        const des = tableConfig.descenso || 2;
        const asc = tableConfig.ascenso || 2;
        const showAsc = data.linkedTournamentId && data.divisionLevel > 1;

        let html = `<div class="table-responsive"><table class="table-clasificacion">
          <thead>
            <tr><th>Pos</th><th>Club</th><th>Pts</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>DG</th></tr>
          </thead>
          <tbody>`;
        sorted.forEach((tm, i) => {
          let cls = '';
          if (i < asc && showAsc) cls = 'row-ascenso';
          else if (i < lig) cls = 'row-clasif';
          else if (i >= sorted.length - des && des > 0) cls = 'row-descenso';
          const dg = (tm.gf||0) - (tm.gc||0);
          html += `<tr class="${cls}">
            <td>${i+1}</td>
            <td><img src="${tm.shield||''}" class="team-shield-mini" alt=""/> ${tm.name}</td>
            <td><strong>${tm.pts||0}</strong></td>
            <td>${tm.pj||0}</td>
            <td>${tm.pg||0}</td>
            <td>${tm.pe||0}</td>
            <td>${tm.pp||0}</td>
            <td>${dg}</td>
          </tr>`;
        });
        html += `</tbody></table></div>`;
        html += `<div class="legends">
          <span><span class="legend-color" style="background:var(--neon-green)"></span> Clasificación</span>
          ${showAsc ? `<span><span class="legend-color" style="background:var(--neon-yellow)"></span> Ascenso</span>` : ''}
          ${des > 0 ? `<span><span class="legend-color" style="background:var(--neon-red)"></span> Descenso</span>` : ''}
        </div>`;
        return html;
      };

      // 2. Tabla de Media
      views['tabla-media'] = function() {
        if (!teams.length) return '<p class="empty">No hay equipos.</p>';
        const sorted = [...teams].sort((a,b) => (b.glb||0) - (a.glb||0));
        let html = `<div class="table-responsive"><table class="table-media">
          <thead>
            <tr><th>Pos</th><th>Club</th><th>ATK</th><th>DEF</th><th>GLB</th><th>Estrellas</th></tr>
          </thead>
          <tbody>`;
        sorted.forEach((tm, i) => {
          html += `<tr>
            <td>${i+1}</td>
            <td><img src="${tm.shield||''}" class="team-shield-mini" alt=""/> ${tm.name}</td>
            <td>${tm.atk||50}</td>
            <td>${tm.def||50}</td>
            <td><strong>${tm.glb||50}</strong></td>
            <td>${glbStars(tm.glb||50)}</td>
          </tr>`;
        });
        html += `</tbody></table></div>`;
        return html;
      };

      // 3. Jornadas
      views['jornadas'] = function() {
        if (!rounds.length) return '<p class="empty">No hay jornadas generadas.</p>';
        let html = '';
        rounds.forEach((round, idx) => {
          html += `<div class="jornada-card">
            <h4>Jornada ${idx+1}</h4>
            <div class="partidos">`;
          round.forEach(m => {
            const home = teams.find(t => t.id === m.h) || { name: '???', shield: '' };
            const away = teams.find(t => t.id === m.a) || { name: '???', shield: '' };
            const resultado = m.played ? `${m.sH} - ${m.sA}` : 'vs';
            const statsHtml = (m.played && m.stats && m.stats.length) ? 
              `<button class="btn-ver-stats" onclick="this.nextElementSibling.classList.toggle('hidden')">Ver stats</button>
              <div class="stats-detalle hidden">
                ${m.stats.map(s => {
                  const p = teams.flatMap(t=>t.players).find(p=>p.id===s.pId);
                  return `<span>${p?p.name:'Jugador'}: ${s.g}G ${s.a}A ${s.s}S</span>`;
                }).join(', ')}
              </div>` : '';
            html += `<div class="partido">
              <div class="equipo"><img src="${home.shield||''}" class="team-shield-mini"/> ${home.name}</div>
              <div class="resultado">${resultado}</div>
              <div class="equipo"><img src="${away.shield||''}" class="team-shield-mini"/> ${away.name}</div>
              ${statsHtml}
            </div>`;
          });
          html += `</div></div>`;
        });
        return html;
      };

      // 3.5 PlayOffs
      views['playoffs'] = function() {
        if (!playoffs || !playoffs.rounds || !playoffs.rounds.length) {
          return '<p class="empty">Próximamente</p>';
        }
        let html = `<div class="playoffs-bracket">`;
        playoffs.rounds.forEach((round, ri) => {
          html += `<div class="playoff-ronda"><h4>Ronda ${ri+1}</h4>`;
          round.forEach(m => {
            const home = teams.find(t => t.id === m.h) || { name: 'TBD', shield: '' };
            const away = teams.find(t => t.id === m.a) || { name: 'TBD', shield: '' };
            const res = m.played ? `${m.sH} - ${m.sA}` : 'vs';
            html += `<div class="playoff-partido">
              <span>${home.name}</span> <strong>${res}</strong> <span>${away.name}</span>
            </div>`;
          });
          html += `</div>`;
        });
        html += `</div>`;
        return html;
      };

      // 4. Stats
      views['stats'] = function() {
        const playerStats = {};
        rounds.forEach(round => {
          round.forEach(m => {
            if (m.played && m.stats) {
              m.stats.forEach(s => {
                if (!playerStats[s.pId]) {
                  const p = teams.flatMap(t=>t.players).find(p=>p.id===s.pId);
                  playerStats[s.pId] = { 
                    name: p ? p.name : 'Jugador',
                    teamId: s.tId,
                    teamName: teams.find(t=>t.id===s.tId)?.name || '',
                    shield: teams.find(t=>t.id===s.tId)?.shield || '',
                    g: 0, a: 0, sv: 0, t: 0, pig: 0
                  };
                }
                playerStats[s.pId].g += s.g || 0;
                playerStats[s.pId].a += s.a || 0;
                playerStats[s.pId].sv += s.s || 0;
                playerStats[s.pId].t += s.t || 0;
                playerStats[s.pId].pig += (s.g||0)*2 + (s.a||0)*1.5 + (s.s||0)*1 + (s.t||0)*0.2;
              });
            }
          });
        });
        const players = Object.values(playerStats);
        const topG = [...players].sort((a,b)=>b.g-a.g).slice(0,10);
        const topA = [...players].sort((a,b)=>b.a-a.a).slice(0,10);
        const topSv = [...players].sort((a,b)=>b.sv-a.sv).slice(0,10);
        const topT = [...players].sort((a,b)=>b.t-a.t).slice(0,10);

        const mvpPorJornada = [];
        rounds.forEach((round, idx) => {
          const statsJ = {};
          round.forEach(m => {
            if (m.played && m.stats) {
              m.stats.forEach(s => {
                if (!statsJ[s.pId]) statsJ[s.pId] = { pig: 0 };
                statsJ[s.pId].pig += (s.g||0)*2 + (s.a||0)*1.5 + (s.s||0)*1 + (s.t||0)*0.2;
              });
            }
          });
          const entries = Object.entries(statsJ);
          if (entries.length) {
            const best = entries.reduce((a,b) => a[1].pig > b[1].pig ? a : b);
            const player = players.find(p => p.id === best[0]);
            if (player) {
              mvpPorJornada.push({ jornada: idx+1, name: player.name, pig: best[1].pig });
            }
          }
        });

        const renderTabla = (titulo, items, key, label) => {
          if (!items.length) return `<p>Sin datos</p>`;
          return `<table class="table-stats"><thead><tr><th>#</th><th>Jugador</th><th>${label}</th></tr></thead><tbody>
            ${items.map((p,i) => `<tr><td>${i+1}</td><td><img src="${p.shield||''}" class="team-shield-mini"/> ${p.name}</td><td>${p[key]}</td></tr>`).join('')}
          </tbody></table>`;
        };

        const renderMvp = () => {
          if (!mvpPorJornada.length) return '<p>Sin MVPs registrados.</p>';
          return `<table class="table-stats"><thead><tr><th>Jornada</th><th>Jugador</th><th>PIG</th></tr></thead><tbody>
            ${mvpPorJornada.map(m => `<tr><td>${m.jornada}</td><td>${m.name}</td><td>${m.pig.toFixed(1)}</td></tr>`).join('')}
          </tbody></table>`;
        };

        return `
          <div class="stats-tabs">
            <button class="stats-tab active" data-tab="goles">Goleadores</button>
            <button class="stats-tab" data-tab="asistencias">Asistencias</button>
            <button class="stats-tab" data-tab="salvadas">Salvadas</button>
            <button class="stats-tab" data-tab="tiros">Tiros</button>
            <button class="stats-tab" data-tab="mvp">MVP Jornada</button>
          </div>
          <div class="stats-content">
            <div id="stats-goles" class="stats-panel active">${renderTabla('Goleadores', topG, 'g', 'Goles')}</div>
            <div id="stats-asistencias" class="stats-panel hidden">${renderTabla('Asistencias', topA, 'a', 'Asistencias')}</div>
            <div id="stats-salvadas" class="stats-panel hidden">${renderTabla('Salvadas', topSv, 'sv', 'Salvadas')}</div>
            <div id="stats-tiros" class="stats-panel hidden">${renderTabla('Tiros', topT, 't', 'Tiros')}</div>
            <div id="stats-mvp" class="stats-panel hidden">${renderMvp()}</div>
          </div>
        `;
      };

      // 5. Balón de Oro
      views['balon-oro'] = function() {
        const allPlayers = teams.flatMap(t => t.players.map(p => ({
          ...p,
          teamName: t.name,
          shield: t.shield,
          pig: p.seasonStats?.pig || 0,
          goals: p.seasonStats?.goals || 0,
          assists: p.seasonStats?.assists || 0,
          saves: p.seasonStats?.saves || 0,
          shots: p.seasonStats?.shots || 0
        })));
        const sorted = allPlayers.filter(p => p.name && p.name.trim()).sort((a,b) => (b.pig||0) - (a.pig||0));
        if (!sorted.length) return '<p class="empty">No hay jugadores.</p>';
        const top3 = sorted.slice(0,3);
        const rest = sorted.slice(3);

        let html = `<div class="podium">
          ${top3.map((p,i) => {
            const pos = i+1;
            const cls = pos === 1 ? 'first' : (pos === 2 ? 'second' : 'third');
            return `<div class="podium-item ${cls}">
              <div class="pos">#${pos}</div>
              <img src="${p.shield||''}" alt=""/>
              <div class="name">${p.name}</div>
              <div class="value">${p.pig.toFixed(1)} <small>PIG</small></div>
            </div>`;
          }).join('')}
        </div>`;

        html += `<div class="table-responsive"><table class="table-balon">
          <thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>PIG</th><th>G</th><th>A</th><th>S</th><th>T</th></tr></thead>
          <tbody>`;
        rest.forEach((p,i) => {
          html += `<tr>
            <td>${i+4}</td>
            <td><img src="${p.shield||''}" class="team-shield-mini"/> ${p.name}</td>
            <td>${p.teamName}</td>
            <td>${p.pig.toFixed(1)}</td>
            <td>${p.goals}</td>
            <td>${p.assists}</td>
            <td>${p.saves}</td>
            <td>${p.shots}</td>
          </tr>`;
        });
        html += `</tbody></table></div>`;
        return html;
      };

      // 6. Equipos
      views['equipos'] = function() {
        if (!teams.length) return '<p class="empty">No hay equipos.</p>';
        let html = '';
        teams.forEach(team => {
          const titulares = team.players.filter(p => p.role === 'Titular 🌟' || p.isCaptain);
          const suplentes = team.players.filter(p => p.role === 'Suplente 🔄');
          const reservas = team.players.filter(p => p.role === 'Reserva 💤' || (!p.role && !titulares.includes(p) && !suplentes.includes(p)));
          html += `<div class="team-card-full">
            <div class="team-header">
              <img src="${team.shield||''}" class="team-shield-big" alt=""/>
              <div>
                <h3>${team.name}</h3>
                <div class="team-meta">
                  <span>💰 ${formatCurrency(team.budget||0)}</span>
                  <span>📊 Valor: ${formatCurrency(team.totalValue||0)}</span>
                  <span>⚡ GLB ${team.glb||50}</span>
                  <span>📦 ${team.players.length}/12</span>
                  <span>👤 DT: ${team.dt||'Sin DT'}</span>
                </div>
                <div class="stars">${glbStars(team.glb||50)}</div>
              </div>
            </div>
            <div class="team-squad">
              ${renderSquad('Titulares', titulares)}
              ${renderSquad('Suplentes', suplentes)}
              ${renderSquad('Reservas (F.B)', reservas)}
            </div>
          </div>`;
        });
        return html;
      };

      function renderSquad(label, players) {
        if (!players.length) return `<div class="squad-group"><h5>${label}</h5><p class="empty-squad">Vacío</p></div>`;
        return `<div class="squad-group"><h5>${label}</h5>
          ${players.map(p => `
            <div class="player-mini">
              <span>${p.isCaptain ? '👑 ' : ''}${p.name}</span>
              <span class="rank" style="color:${rankColor(p.rocketRank)}">${p.rocketRank||'Platino'}</span>
              <span class="stats">⚽${p.seasonStats?.goals||0} 🎯${p.seasonStats?.assists||0} 🧤${p.seasonStats?.saves||0}</span>
            </div>
          `).join('')}
        </div>`;
      }

      // 7. Mercado
      views['mercado'] = function() {
        const allPlayers = teams.flatMap(t => t.players.map(p => ({
          ...p,
          teamName: t.name,
          teamId: t.id,
          shield: t.shield,
          pig: p.seasonStats?.pig || 0
        }))).filter(p => p.name && p.name.trim());

        if (!allPlayers.length) return '<p class="empty">No hay jugadores.</p>';

        const teamOpts = [...new Set(allPlayers.map(p => p.teamId))].map(id => {
          const t = teams.find(tm => tm.id === id);
          return `<option value="${id}">${t?t.name:'Desconocido'}</option>`;
        }).join('');

        let html = `
          <div class="filtros-mercado">
            <div>
              <label>Equipo</label>
              <select id="filtro-equipo">
                <option value="all">Todos</option>
                ${teamOpts}
              </select>
            </div>
            <div>
              <label>Ordenar</label>
              <select id="filtro-orden">
                <option value="price-desc">Precio (mayor a menor)</option>
                <option value="price-asc">Precio (menor a mayor)</option>
                <option value="pig-desc">PIG (mayor a menor)</option>
                <option value="pig-asc">PIG (menor a mayor)</option>
                <option value="name-asc">Nombre (A-Z)</option>
                <option value="name-desc">Nombre (Z-A)</option>
              </select>
            </div>
            <div>
              <label>Buscar</label>
              <input type="text" id="filtro-buscar" placeholder="Jugador..."/>
            </div>
          </div>
          <div class="table-responsive" id="mercado-tabla-container">
            ${renderMercadoTabla(allPlayers)}
          </div>
        `;
        return html;
      };

      function renderMercadoTabla(players, filtros={}) {
        let filtered = [...players];
        if (filtros.equipo && filtros.equipo !== 'all') {
          filtered = filtered.filter(p => p.teamId === filtros.equipo);
        }
        if (filtros.buscar) {
          const q = filtros.buscar.toLowerCase();
          filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
        }
        const sort = filtros.orden || 'price-desc';
        switch(sort) {
          case 'price-desc': filtered.sort((a,b) => (b.marketValue||0) - (a.marketValue||0)); break;
          case 'price-asc': filtered.sort((a,b) => (a.marketValue||0) - (b.marketValue||0)); break;
          case 'pig-desc': filtered.sort((a,b) => (b.pig||0) - (a.pig||0)); break;
          case 'pig-asc': filtered.sort((a,b) => (a.pig||0) - (b.pig||0)); break;
          case 'name-asc': filtered.sort((a,b) => a.name.localeCompare(b.name)); break;
          case 'name-desc': filtered.sort((a,b) => b.name.localeCompare(a.name)); break;
        }
        if (!filtered.length) return '<p class="empty">No hay jugadores con esos filtros.</p>';
        return `<table class="table-mercado">
          <thead><tr><th>Jugador</th><th>Equipo</th><th>PIG</th><th>Precio</th><th>Rango</th></tr></thead>
          <tbody>${filtered.map(p => `
            <tr>
              <td><img src="${p.shield||''}" class="team-shield-mini"/> ${p.name}</td>
              <td>${p.teamName}</td>
              <td>${p.pig.toFixed(1)}</td>
              <td>${formatCurrency(p.marketValue||0)}</td>
              <td style="color:${rankColor(p.rocketRank)}">${p.rocketRank||'Platino'}</td>
            </tr>
          `).join('')}</tbody>
        </table>`;
      }

      // 8. Movimientos Económicos
      views['economia'] = function() {
        if (!economyLogs.length) return '<p class="empty">No hay movimientos económicos.</p>';
        const grouped = {};
        economyLogs.forEach(log => {
          if (!grouped[log.teamId]) grouped[log.teamId] = [];
          grouped[log.teamId].push(log);
        });
        let html = '';
        Object.keys(grouped).forEach(teamId => {
          const team = teams.find(t => t.id === teamId);
          if (!team) return;
          const logs = grouped[teamId].sort((a,b) => b.date - a.date);
          html += `<div class="economy-team">
            <div class="economy-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
              <img src="${team.shield||''}" class="team-shield-mini"/> ${team.name}
              <span>💰 ${formatCurrency(team.budget||0)}</span>
              <i class="fas fa-chevron-down"></i>
            </div>
            <div class="economy-logs">
              ${logs.map(log => {
                const sign = log.amount > 0 ? '+' : '';
                const cls = log.amount > 0 ? 'positive' : 'negative';
                const icon = log.type === 'bonus' ? '🏆' : log.type === 'penalty' ? '⚠️' : '📌';
                return `<div class="economy-log">
                  <span class="icon">${icon}</span>
                  <span class="desc">${log.description}</span>
                  <span class="amount ${cls}">${sign}${formatCurrency(log.amount)}</span>
                  <span class="round">J${log.round}</span>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        });
        return html;
      };

      // 9. Sanciones
      views['sanciones'] = function() {
        if (!sanctionsLog.length) return '<p class="empty">No hay sanciones activas.</p>';
        const activas = sanctionsLog.filter(s => s.active);
        if (!activas.length) return '<p class="empty">No hay sanciones activas.</p>';
        let html = `<div class="sanciones-list">`;
        activas.forEach(s => {
          html += `<div class="sanction-card ${s.type}">
            <div class="sanction-header">
              <span class="icon">${s.type === 'yellow' ? '🟨' : s.type === 'red' ? '🟥' : s.type === 'suspension' ? '🚫' : '💰'}</span>
              <span class="player">${s.playerName}</span>
              <span class="team">${s.teamName}</span>
              <span class="type">${s.type}</span>
            </div>
            <div class="sanction-body">
              <span class="reason">${s.reason}</span>
              <span class="rounds">J${s.roundStart} ${s.roundEnd ? '- J'+s.roundEnd : ''}</span>
            </div>
          </div>`;
        });
        html += `</div>`;
        return html;
      };

      // 10. Selección Nacional
      views['seleccion'] = function() {
        let sel = nationalTeams.find(nt => nt.type === 'main');
        if (!sel) sel = nationalTeams.find(nt => nt.type === 'sub');
        if (!sel) return '<p class="empty">No hay selección nacional ni sub selecciones.</p>';
        const players = sel.players || [];
        const logo = sel.logo || '';
        const name = sel.name || 'Selección Nacional';
        const stats = sel.stats || { goals: 0, assists: 0, saves: 0, pig: 0 };

        let html = `<div class="seleccion-card">
          <div class="seleccion-header">
            <img src="${logo}" class="seleccion-logo" alt=""/>
            <div>
              <h3>${name}</h3>
              <p>${players.length} jugadores convocados</p>
              <div class="seleccion-stats">
                <span>⚽ ${stats.goals||0}</span>
                <span>🎯 ${stats.assists||0}</span>
                <span>🧤 ${stats.saves||0}</span>
                <span>📈 ${stats.pig||0}</span>
              </div>
            </div>
          </div>
          <div class="seleccion-jugadores">
            ${players.map(p => `
              <div class="seleccion-jugador">
                <span>${p.name}</span>
                <span class="role">${p.role||''}</span>
                <span class="stats">⚽${p.stats?.goals||0} 🎯${p.stats?.assists||0} 🧤${p.stats?.saves||0}</span>
              </div>
            `).join('')}
          </div>
        </div>`;
        return html;
      };

      // -------- NAVEGACIÓN Y RENDER --------
      const container = document.getElementById('view-container');
      const title = document.getElementById('view-title');
      const navLinks = $$('#sidebar-nav a');

      function renderView(viewId) {
        const renderFn = views[viewId];
        if (!renderFn) {
          container.innerHTML = '<p class="empty">Vista no disponible.</p>';
          return;
        }
        container.innerHTML = renderFn();
        // Aplicar eventos a los tabs de stats
        if (viewId === 'stats') {
          $$('.stats-tab').forEach(btn => {
            btn.addEventListener('click', function() {
              $$('.stats-tab').forEach(b => b.classList.remove('active'));
              this.classList.add('active');
              const target = this.dataset.tab;
              $$('.stats-panel').forEach(p => p.classList.add('hidden'));
              const panel = document.getElementById('stats-'+target);
              if (panel) panel.classList.remove('hidden');
            });
          });
        }
        if (viewId === 'mercado') {
          const equipoSelect = document.getElementById('filtro-equipo');
          const ordenSelect = document.getElementById('filtro-orden');
          const buscarInput = document.getElementById('filtro-buscar');
          const containerTabla = document.getElementById('mercado-tabla-container');
          function actualizarMercado() {
            const filtros = {
              equipo: equipoSelect ? equipoSelect.value : 'all',
              orden: ordenSelect ? ordenSelect.value : 'price-desc',
              buscar: buscarInput ? buscarInput.value : ''
            };
            const allPlayers = teams.flatMap(t => t.players.map(p => ({
              ...p,
              teamName: t.name,
              teamId: t.id,
              shield: t.shield,
              pig: p.seasonStats?.pig || 0
            }))).filter(p => p.name && p.name.trim());
            containerTabla.innerHTML = renderMercadoTabla(allPlayers, filtros);
          }
          if (equipoSelect) equipoSelect.addEventListener('change', actualizarMercado);
          if (ordenSelect) ordenSelect.addEventListener('change', actualizarMercado);
          if (buscarInput) buscarInput.addEventListener('input', actualizarMercado);
          actualizarMercado();
        }
        const link = navLinks.find(a => a.dataset.view === viewId);
        if (link) title.textContent = link.textContent.trim();
        else title.textContent = viewId;
        if (window.innerWidth < 768) {
          document.getElementById('sidebar').classList.remove('open');
        }
      }

      // Eventos de navegación
      navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const view = this.dataset.view;
          if (view) renderView(view);
        });
      });

      // Menú hamburguesa
      document.getElementById('menu-toggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('open');
      });

      // Cerrar sidebar al hacer clic fuera (móvil)
      document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('menu-toggle');
        if (window.innerWidth < 768 && sidebar.classList.contains('open') &&
            !sidebar.contains(e.target) && !toggle.contains(e.target)) {
          sidebar.classList.remove('open');
        }
      });

      // Cargar vista inicial
      renderView('tabla-general');
    }

    // ============================================
    // INICIO DE LA APLICACIÓN
    // ============================================
    
    // Si los datos ya están cargados (por ejemplo, si se usó datos de ejemplo)
    if (window.torneoData) {
      torneoData = window.torneoData;
      iniciarVisor();
    } else {
      // Cargar desde JSON
      cargarDatos();
    }
  </script>
</body>
</html>
